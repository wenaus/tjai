<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/tjai/static/tjai/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tjai ReadMe</title>
    <link rel="stylesheet" href="/tjai/static/tjai/menu.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px 40px;
        }
        .readme-item {
            padding: 8px 12px;
            margin-bottom: 6px;
            border-left: 3px solid #ffb74d;
        }
        .readme-title { font-size: 13px; margin-bottom: 3px; display: flex; align-items: baseline; gap: 8px; }
        .readme-title a { color: #64b5f6; text-decoration: none; }
        .readme-title a:hover { text-decoration: underline; }
        .readme-remove { background: none; border: 1px solid #444; color: #8a8a8a; cursor: pointer; font-size: 11px; font-family: inherit; padding: 2px 8px; border-radius: 3px; }
        .readme-remove:hover { color: #e0e0e0; border-color: #666; }
        .readme-detail { color: #888; font-size: 11px; margin-bottom: 4px; }
        .readme-precis { color: #bbb; font-size: 12px; line-height: 1.5; }
        .loading { color: #8a8a8a; padding: 20px; }
        .empty { color: #8a8a8a; padding: 40px; text-align: center; }
        .count-header { color: #8a8a8a; font-size: 11px; padding: 8px 0 12px; border-bottom: 1px solid #333; margin-bottom: 12px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        * { scrollbar-width: thin; scrollbar-color: #444 #1a1a1a; }
    </style>
</head>
<body>
    {% with current_page="readme" %}{% include "tjai_app/_menu.html" %}{% endwith %}
    <div class="content-area" id="readme-content">
        <div class="loading">Loading reading list...</div>
    </div>

    <script>
        let items = [];

        async function fetchReadme() {
            try {
                const resp = await fetch('/tjai/api/readme/data');
                const data = await resp.json();
                if (data.error) {
                    document.getElementById('readme-content').innerHTML =
                        `<div class="error">${data.error}</div>`;
                    return;
                }
                items = data.items || [];
                render();
            } catch (e) {
                document.getElementById('readme-content').innerHTML =
                    '<div class="error">Error loading reading list</div>';
            }
        }

        function render() {
            if (items.length === 0) {
                document.getElementById('readme-content').innerHTML =
                    '<div class="empty">Reading list is empty. Mark items as ReadMe on the Picks page.</div>';
                return;
            }

            let html = `<div class="count-header">${items.length} item${items.length !== 1 ? 's' : ''} to read</div>`;
            for (const item of items) {
                html += `<div class="readme-item" id="rm-${item.id}">`;
                html += `<div class="readme-title"><a href="${esc(item.url)}" target="_blank" rel="noopener" onclick="dismiss('${item.id}', this)">${esc(item.title)}</a><button class="readme-remove" onclick="dismiss('${item.id}')">remove</button></div>`;
                let detail = item.modified_display || '';
                if (item.url) detail += ' \u00b7 ' + esc(item.url);
                if (item.tags && item.tags.length) detail += ' \u00b7 ' + item.tags.map(t => ':' + esc(t)).join(' ');
                html += `<div class="readme-detail">${detail}</div>`;
                if (item.precis) html += `<div class="readme-precis">${esc(item.precis)}</div>`;
                html += '</div>';
            }
            document.getElementById('readme-content').innerHTML = html;
        }

        // formatDate removed — server provides modified_display

        function esc(s) {
            if (!s) return '';
            const el = document.createElement('span');
            el.textContent = s;
            return el.innerHTML;
        }

        async function dismiss(id, linkEl) {
            fetch('/tjai/api/readme/dismiss', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                body: JSON.stringify({entry_id: id}),
            });
            items = items.filter(i => i.id !== id);
            render();
        }

        function getCsrf() {
            const c = document.cookie.match(/csrftoken=([^;]+)/);
            return c ? c[1] : '';
        }

        fetchReadme();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tjai Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #top-menu {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 4px 16px;
            background: #222;
            border-bottom: 1px solid #333;
            font-size: 12px;
            flex-shrink: 0;
        }
        #top-menu .menu-title {
            color: #d8a070;
            font-weight: bold;
            margin-right: 8px;
        }
        #top-menu a {
            color: #8a8a8a;
        }
        #top-menu a:hover {
            color: #e0e0e0;
        }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .panel {
            padding: 16px;
            overflow-y: auto;
        }
        .panel-left {
            flex: 3;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        #calendar-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #calendar-content {
            flex: 1;
            overflow-y: auto;
        }
        #named-section {
            flex: 1;
            overflow-y: auto;
            border-top: 1px solid #333;
            padding-top: 12px;
            margin-top: 12px;
        }
        .panel-right {
            flex: 5;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #status-fixed {
            flex-shrink: 0;
        }
        #recent-entries {
            flex: 1;
            overflow-y: auto;
        }
        .panel-header {
            color: #d8a070;
            font-weight: bold;
            margin-bottom: 12px;
            padding: 8px;
            background: rgba(156, 120, 180, 0.15);
            border-radius: 4px;
        }
        .status-line {
            margin-bottom: 8px;
        }
        .clock-status {
            color: #9ccc65;
            margin-bottom: 12px;
        }
        .week-header {
            color: #d8a070;
            margin-top: 16px;
            margin-bottom: 8px;
        }
        .day-header {
            color: #d8a070;
            margin-top: 8px;
            margin-left: 8px;
        }
        .day-today {
            font-weight: bold;
        }
        .entry {
            margin: 4px 0 4px 16px;
            line-height: 1.4;
        }
        .entry-time {
            color: #d8a070;
        }
        .entry-content {
            color: #e0e0e0;
        }
        .clock-start {
            color: #9ccc65;
        }
        .clock-stop {
            color: #5d8a3e;
        }
        .entry-annual {
            color: #d47ab0;
        }
        .context {
            color: #ce93d8;
        }
        .tag {
            color: #9ccc65;
        }
        .link {
            color: #64b5f6;
        }
        a {
            color: #64b5f6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .refresh-indicator {
            color: #999;
            font-size: 11px;
            margin-left: auto;
        }
        .now-marker {
            color: #ef5350;
            font-weight: bold;
        }
        .filter-clear {
            background: #444;
            color: #e0e0e0;
            border: none;
            padding: 2px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }
        .filter-clear:hover { background: #666; }
        .machine-link.active { background: #64b5f6; color: #1a1a1a !important; padding: 1px 4px; border-radius: 3px; }
        .tag-link.active { background: #9ccc65; color: #1a1a1a !important; padding: 1px 4px; border-radius: 3px; }
        .kind-link.active { background: #daa520; color: #1a1a1a !important; padding: 1px 4px; border-radius: 3px; }
        .context-link.active { background: #ce93d8; color: #1a1a1a !important; padding: 1px 4px; border-radius: 3px; }
        .ctx-toggle { cursor: pointer; color: #ef5350; font-size: 11px; margin-left: 1px; }
        .ctx-toggle:hover { opacity: 0.7; }
        .ctx-toggle.excluded { color: #9ccc65; }
        .tag-link.available { border: 1px solid #558b2f; padding: 0px 3px; border-radius: 3px; }
        /* Dark mode scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        /* Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: #444 #1a1a1a;
        }
    </style>
</head>
<body>
    <div id="top-menu">
        <span class="menu-title">tjai</span>
        <a href="{% url 'daily_briefing' %}">Briefing</a>
        <a href="{% url 'agent_log' %}">Agent Log</a>
    </div>
    <div class="container">
        <div class="panel panel-left" id="calendar-panel">
            <div id="calendar-section">
                <div class="panel-header">Calendar <span id="calendar-time" style="color:#8a8a8a;font-weight:normal"></span></div>
                <div id="calendar-content">Loading...</div>
            </div>
            <div id="named-section">
                <div class="panel-header">Named Entries</div>
                <div id="named-content">Loading...</div>
            </div>
        </div>
        <div class="panel panel-right" id="status-panel">
            <div class="panel-header" style="display:flex; align-items:center;">Status<span class="refresh-indicator"><span id="refresh-indicator"></span> <a href="{% url 'logout' %}" style="color:#999;margin-left:12px">Logout</a></span></div>
            <div id="status-fixed">Loading...</div>
            <div id="entries-header" style="display:flex; align-items:center; gap:12px; margin-top:16px; margin-bottom:8px; border-top:1px solid #333; padding-top:12px; flex-shrink:0;">
                <span id="entries-label" style="color: #d8a070;">Entries <span style="color:#8a8a8a">with mod time</span></span>
                <input type="text" id="entry-search" placeholder="Search..." style="background:#2a2a2a; color:#e0e0e0; border:1px solid #555; padding:2px 6px; font-family:inherit; font-size:inherit; width:180px; border-radius:3px;">
                <span id="search-clear" style="display:none; cursor:pointer; color:#999; font-size:14px;" title="Clear search (Esc)">&times;</span>
                <button id="filter-clear" class="filter-clear" title="Clear all filters">clear</button>
            </div>
            <div id="recent-entries">
                <div id="entries-list"></div>
                <div id="load-more-indicator" style="display:none; padding:8px 16px; color:#8a8a8a;">Loading more entries...</div>
            </div>
        </div>
    </div>

    <script>
        function formatTime(timestamp) {
            const d = new Date(timestamp * 1000);
            let h = d.getHours();
            const m = d.getMinutes().toString().padStart(2, '0');
            const ampm = h >= 12 ? 'pm' : 'am';
            h = h % 12 || 12;
            return `${h}:${m}${ampm}`;
        }

        // formatDate removed - server provides pre-formatted date_display

        function formatDuration(minutes) {
            const h = Math.floor(minutes / 60);
            const m = minutes % 60;
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function linkifyContent(content) {
            // Convert markdown links [title](url) to clickable HTML
            content = content.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,
                '<a href="$2" target="_blank">$1</a>');
            // Convert bare URLs
            content = content.replace(/(^|[^"'])(https?:\/\/[^\s<]+)/g,
                '$1<a href="$2" target="_blank">$2</a>');
            // Colorize :tags in content
            content = content.replace(/(:[a-zA-Z][a-zA-Z0-9_-]*)/g,
                '<span style="color:#9ccc65">$1</span>');
            return content;
        }

        async function fetchCalendar() {
            try {
                const resp = await fetch('/tjai/api/dashboard/calendar');
                const data = await resp.json();
                renderCalendar(data);
            } catch (e) {
                document.getElementById('calendar-content').innerHTML = 'Error loading calendar';
            }
        }

        async function fetchStatus() {
            try {
                const params = buildFilterParams();
                const qs = params.length ? `?${params.join('&')}` : '';
                const resp = await fetch(`/tjai/api/dashboard/status${qs}`);
                const data = await resp.json();
                renderStatus(data);
            } catch (e) {
                document.getElementById('status-content').innerHTML = 'Error loading status';
            }
        }

        async function fetchNamed() {
            try {
                const resp = await fetch('/tjai/api/dashboard/named');
                const data = await resp.json();
                renderNamed(data);
            } catch (e) {
                document.getElementById('named-content').innerHTML = 'Error loading named entries';
            }
        }

        function renderNamed(data) {
            let html = '';
            for (const entry of data.entries) {
                const nameStr = `<span style="color:#c0d8f0;font-weight:bold">@${escapeHtml(entry.name)}</span>`;
                const contextStr = entry.context ? ` <span style="color:#ce93d8">=${entry.context}</span>` : '';
                const content = linkifyContent(escapeHtml(entry.content));
                const lineCount = entry.line_count > 1 ? ` <span style="color:#8a8a8a">[${entry.line_count} lines]</span>` : '';
                html += `<div class="entry"><a href="/tjai/entry/?name=${encodeURIComponent(entry.name)}" style="color:inherit;text-decoration:none">${nameStr}${contextStr} ${content}${lineCount}</a></div>`;
            }
            document.getElementById('named-content').innerHTML = html || 'No named entries';
        }

        function renderCalendar(data) {
            let html = '';
            const now = data.server_time || (Date.now() / 1000);
            const serverTodayDate = data.today_date;

            let entries = data.entries.slice();  // Copy array

            // Check if today has any entries (using server-provided date_key)
            let hasTodayEntry = false;
            for (const entry of entries) {
                if (entry.date_key === serverTodayDate) {
                    hasTodayEntry = true;
                    break;
                }
            }

            // If no entries for today, inject a placeholder
            if (!hasTodayEntry && serverTodayDate) {
                // Get today's display info from server or construct minimal placeholder
                const todayYear = serverTodayDate.slice(0, 4);
                const todayMonth = parseInt(serverTodayDate.slice(4, 6)) - 1;
                const todayDay = parseInt(serverTodayDate.slice(6, 8));
                const todayDate = new Date(todayYear, todayMonth, todayDay);
                const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const todayDisplay = `${days[todayDate.getDay()]} ${months[todayDate.getMonth()]} ${String(todayDay).padStart(2, '0')}`;
                const weekNum = getWeekNumber(todayDate);
                const weekStart = getWeekStart(todayDate);
                const weekStartKey = `${weekStart.getFullYear()}${String(weekStart.getMonth()+1).padStart(2,'0')}${String(weekStart.getDate()).padStart(2,'0')}`;

                entries.push({
                    id: '__today_placeholder__',
                    content: '',
                    event_date: now,
                    date_key: serverTodayDate,
                    date_display: todayDisplay,
                    time_display: null,
                    week_num: weekNum,
                    week_start_key: weekStartKey,
                    context: null,
                    data: { _placeholder: true }
                });
                // Re-sort by event_date
                entries.sort((a, b) => a.event_date - b.event_date);
            }

            // Find next upcoming event (future, not clock entries)
            let nextUpcomingTs = null;
            for (const entry of entries) {
                if (entry.data?.clock) continue;
                if (entry.data?._placeholder) continue;
                if (entry.event_date > now) {
                    nextUpcomingTs = entry.event_date;
                    break;
                }
            }

            let currentWeek = null;
            let currentDay = null;

            for (const entry of entries) {
                const isToday = entry.date_key === serverTodayDate;

                // Week header (using server-provided week_num and week_start_key)
                if (entry.week_num !== currentWeek) {
                    currentWeek = entry.week_num;
                    html += `<div class="week-header">${entry.week_start_key} Week ${entry.week_num}</div>`;
                    currentDay = null;
                }

                // Day header (using server-provided date_key and date_display)
                if (entry.date_key !== currentDay) {
                    currentDay = entry.date_key;
                    const dayClass = isToday ? 'day-header day-today' : 'day-header';
                    const todayLabel = isToday ? ' <span class="now-marker">Today</span>' : '';
                    const todayId = isToday ? ' id="today-marker"' : '';
                    html += `<div${todayId} class="${dayClass}">${entry.date_display}${todayLabel}</div>`;
                }

                // Skip rendering placeholder entries (they only trigger the day header)
                if (entry.data?._placeholder) continue;

                // Entry
                const clockType = entry.data?.clock;
                const isAnnual = entry.data?.annual;
                let contentClass = 'entry-content';
                if (isAnnual) contentClass = 'entry-annual';
                else if (clockType === 'start') contentClass = 'clock-start';
                else if (clockType === 'stop') contentClass = 'clock-stop';

                // Use server-provided time_display
                const timeStr = entry.time_display
                    ? `<span class="entry-time">${entry.time_display}</span> `
                    : '';

                // Countdown for next upcoming event (only if it's today)
                let countdownStr = '';
                if (entry.event_date === nextUpcomingTs && isToday) {
                    const diffSec = entry.event_date - now;
                    const hours = Math.floor(diffSec / 3600);
                    const minutes = Math.floor((diffSec % 3600) / 60);
                    if (hours > 0) {
                        countdownStr = `<span style="color:#e57373;font-weight:bold">in ${hours}h ${minutes}m</span> `;
                    } else if (minutes > 0) {
                        countdownStr = `<span style="color:#e57373;font-weight:bold">in ${minutes}m</span> `;
                    }
                }

                // For clock entries: show title in color, truncate description on new line
                let contentHtml;
                if (clockType) {
                    const lines = entry.content.split('\n').filter(l => l.trim());
                    const title = lines[0] || entry.content;
                    const hasMore = lines.length > 1;
                    contentHtml = `<span class="${contentClass}">${escapeHtml(title)}</span>`;
                    if (hasMore) {
                        const descPreview = lines[1].substring(0, 40) + (lines[1].length > 40 || lines.length > 2 ? '...' : '');
                        contentHtml += `<br><span class="entry-content" style="margin-left:3em">${escapeHtml(descPreview)}</span>`;
                    }
                } else {
                    contentHtml = `<span class="${contentClass}">${linkifyContent(escapeHtml(entry.content))}</span>`;
                }
                const calEid = entry.data && entry.data.entry_id;
                const calEntryUrl = calEid ? `/tjai/entry/?entry_id=${encodeURIComponent(calEid)}` : `/tjai/entry/?uuid=${entry.id}`;
                html += `<div class="entry"><a href="${calEntryUrl}" style="color:inherit;text-decoration:none">${timeStr}${countdownStr}${contentHtml}</a></div>`;
            }

            document.getElementById('calendar-content').innerHTML = html || 'No upcoming events';

            // Scroll to today, positioning it in the upper third of the calendar
            const todayEl = document.getElementById('today-marker');
            if (todayEl) {
                const calContent = document.getElementById('calendar-content');
                const sectionHeight = calContent.clientHeight;
                // Position today about 1/3 from the top
                calContent.scrollTop = todayEl.offsetTop - (sectionHeight / 3);
            }
        }

        function renderEntries(entries, tz) {
            let html = '';
            for (const entry of entries) {
                const ts = new Date(entry.timestamp * 1000);
                const opts = { timeZone: tz, weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false };
                const parts = new Intl.DateTimeFormat('en-US', opts).formatToParts(ts);
                const p = {};
                parts.forEach(x => p[x.type] = x.value);
                const currentYear = new Date().getFullYear().toString();
                const tsStr = p.year === currentYear
                    ? `${p.weekday} ${p.month}/${p.day}/${p.hour}:${p.minute}`
                    : `${p.month}/${p.day}/${p.year}`;

                const kindMap = {memory: 'm', todo: 'do', profile: 'p', bookmark: 'b', ai: 'ai', journal: 'j', log: 'log'};
                const kindAbbr = kindMap[entry.kind] || entry.kind;

                const entryUrl = entry.entry_id ? `/tjai/entry/?entry_id=${encodeURIComponent(entry.entry_id)}`
                    : entry.nickname ? `/tjai/entry/?nickname=${encodeURIComponent(entry.nickname)}`
                    : entry.name ? `/tjai/entry/?name=${encodeURIComponent(entry.name)}`
                    : `/tjai/entry/?uuid=${entry.id}`;
                let line = `<a href="${entryUrl}" style="color:inherit;text-decoration:none">`;
                line += `<span style="color:#daa520">===</span>  `;
                line += `<span style="color:#8a8a8a">${tsStr}</span> `;
                line += `<span style="color:#daa520">[${kindAbbr}]</span> `;

                if (entry.kind === 'journal' && entry.event_date) {
                    const evd = new Date(entry.event_date * 1000);
                    const evOpts = { timeZone: tz, weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false };
                    const evParts = new Intl.DateTimeFormat('en-US', evOpts).formatToParts(evd);
                    const ev = {};
                    evParts.forEach(x => ev[x.type] = x.value);
                    const isAllDay = (ev.hour === '00' && ev.minute === '00');
                    let evStr;
                    if (ev.year !== currentYear) {
                        evStr = `${ev.month}/${ev.day}/${ev.year}`;
                    } else if (isAllDay) {
                        evStr = `${ev.weekday} ${ev.month}/${ev.day}`;
                    } else {
                        evStr = `${ev.weekday} ${ev.month}/${ev.day}/${ev.hour}:${ev.minute}`;
                    }
                    line += `<span style="color:#d8a070">${evStr}</span> `;
                }

                if (entry.context) line += `<span style="color:#ce93d8">=${entry.context}</span> `;
                if (entry.name) line += `<span style="color:#c0d8f0;font-weight:bold">@${entry.name}</span>  `;

                const hasUrl = /https?:\/\//.test(entry.content) || /\[.*\]\(.*\)/.test(entry.content);
                if (hasUrl) {
                    // Close link before content so inner links aren't nested
                    line += `</a>`;
                    line += linkifyContent(escapeHtml(entry.content));
                } else {
                    line += escapeHtml(entry.content);
                    line += `</a>`;
                }
                if (entry.line_count) line += ` <span style="color:#daa520">[${entry.line_count} lines]</span>`;
                if (entry.tags && entry.tags.length) {
                    const tagStr = entry.tags.map(t => ':' + t).join(' ');
                    line += ` <span style="color:#9ccc65">${tagStr}</span>`;
                }

                html += `<div class="entry" style="margin-left:0" data-context="${entry.context || ''}" data-machine="${entry.hostname || ''}" data-kind="${entry.kind || ''}" data-tags="${(entry.all_tags || entry.tags || []).join(',')}">${line}</div>`;
            }
            return html;
        }

        let dashboardTimezone = 'America/New_York';
        let loadedEntryCount = 0;
        let totalEntryCount = 0;
        let hasMoreEntries = false;
        let loadingMore = false;
        let isSearchActive = false;
        let activeMachine = null;
        let activeTags = new Set();
        let activeKind = null;
        let activeContext = null;
        let excludedContexts = new Set();
        let isFilterActive = false;

        function syncStateToUrl() {
            const params = new URLSearchParams();
            if (activeTags.size > 0) params.set('tag', [...activeTags].sort().join(','));
            if (activeKind) params.set('kind', activeKind);
            if (activeContext) params.set('context', activeContext);
            if (activeMachine) params.set('machine', activeMachine);
            if (excludedContexts.size > 0) params.set('exclude', [...excludedContexts].sort().join(','));
            const qs = params.toString();
            const url = qs ? `${location.pathname}?${qs}` : location.pathname;
            history.replaceState(null, '', url);
        }

        function loadStateFromUrl() {
            const params = new URLSearchParams(location.search);
            const tagParam = params.get('tag');
            if (tagParam) tagParam.split(',').forEach(t => activeTags.add(t));
            activeKind = params.get('kind') || null;
            activeContext = params.get('context') || null;
            activeMachine = params.get('machine') || null;
            const excl = params.get('exclude');
            if (excl) excl.split(',').forEach(c => excludedContexts.add(c));
            isFilterActive = !!(activeTags.size > 0 || activeKind || activeContext || activeMachine || excludedContexts.size > 0);
        }

        function entriesLabel() {
            const prefix = isFilterActive ? 'filtered' : 'with mod time';
            const countStr = hasMoreEntries ? `${loadedEntryCount} of ${totalEntryCount}` : `${loadedEntryCount}`;
            return `Entries <span style="color:#8a8a8a">${prefix} (${countStr})</span>`;
        }

        function buildFilterParams() {
            const params = [];
            if (activeTags.size > 0) params.push(`tag=${encodeURIComponent([...activeTags].join(','))}`);
            if (activeKind) params.push(`kind=${encodeURIComponent(activeKind)}`);
            if (activeContext) params.push(`context=${encodeURIComponent(activeContext)}`);
            if (activeMachine) params.push(`machine=${encodeURIComponent(activeMachine)}`);
            if (excludedContexts.size > 0) params.push(`exclude_context=${encodeURIComponent([...excludedContexts].join(','))}`);
            return params;
        }

        async function loadMoreEntries() {
            if (loadingMore || !hasMoreEntries || isSearchActive) return;
            loadingMore = true;
            const indicator = document.getElementById('load-more-indicator');
            if (indicator) indicator.style.display = 'block';
            try {
                const params = [`offset=${loadedEntryCount}`, ...buildFilterParams()];
                const resp = await fetch(`/tjai/api/dashboard/status?${params.join('&')}`);
                const data = await resp.json();
                const newHtml = renderEntries(data.recent_entries || [], dashboardTimezone);
                document.getElementById('entries-list').insertAdjacentHTML('beforeend', newHtml);
                loadedEntryCount += (data.recent_entries || []).length;
                hasMoreEntries = data.has_more;
                if (data.total_count) totalEntryCount = data.total_count;
                document.getElementById('entries-label').innerHTML = entriesLabel();
            } catch (err) {
                console.error('Load more failed:', err);
            } finally {
                loadingMore = false;
                if (indicator) indicator.style.display = 'none';
            }
        }

        // Infinite scroll on entries container
        document.getElementById('recent-entries').addEventListener('scroll', function() {
            if (this.scrollHeight - this.scrollTop - this.clientHeight < 200) {
                loadMoreEntries();
            }
        });

        async function searchEntries(query) {
            isSearchActive = true;
            try {
                const resp = await fetch(`/tjai/api/dashboard/search?q=${encodeURIComponent(query)}`);
                const data = await resp.json();
                const count = data.entries ? data.entries.length : 0;
                document.getElementById('entries-label').innerHTML = `Search: "${escapeHtml(query)}" <span style="color:#8a8a8a">(${count} results)</span>`;
                document.getElementById('entries-list').innerHTML = renderEntries(data.entries || [], dashboardTimezone);
            } catch (err) {
                document.getElementById('entries-list').innerHTML = `<div style="color:#f44">Search error: ${escapeHtml(err.message)}</div>`;
            }
        }

        async function fetchFilteredEntries() {
            const params = buildFilterParams();
            isFilterActive = params.length > 0;
            if (!isFilterActive) {
                // No filters — do a full refresh to restore normal entries
                refresh();
                return;
            }
            try {
                const resp = await fetch(`/tjai/api/dashboard/status?${params.join('&')}`);
                const data = await resp.json();
                dashboardTimezone = data.timezone || dashboardTimezone;
                const entries = data.recent_entries || [];
                loadedEntryCount = entries.length;
                hasMoreEntries = data.has_more;
                totalEntryCount = data.total_count || entries.length;
                document.getElementById('entries-label').innerHTML = entriesLabel();
                document.getElementById('entries-list').innerHTML = renderEntries(entries, dashboardTimezone);
                highlightAvailableTags(entries);
            } catch (err) {
                console.error('Filter fetch failed:', err);
            }
        }

        function renderStatus(data) {
            let html = '';

            // Context line
            html += `<div class="status-line"><span class="entry-time">${data.timestamp}</span> `;
            if (data.context) {
                html += `Context is <span class="context">=${data.context}</span>.`;
                if (data.context_description) {
                    html += ` ${escapeHtml(data.context_description)}`;
                }
            } else {
                html += 'Context is clear.';
            }
            html += '</div>';

            // Contexts — clickable in-dash filters (poetry/recipe link to custom pages)
            if (data.contexts && data.contexts.length > 0) {
                const customPages = ['poetry', 'recipe'];
                const ctxChips = data.contexts.map(c => {
                    const excl = excludedContexts.has(c);
                    const nameColor = excl ? '#666' : '#ce93d8';
                    if (customPages.includes(c)) {
                        return `<span style="white-space:nowrap"><a href="/tjai/context/${c}/" style="color:${nameColor};text-decoration:none">${c}</a><span class="ctx-toggle${excl ? ' excluded' : ''}" data-ctx="${c}" title="${excl ? 'Include' : 'Exclude'} ${c}">${excl ? '+' : '\u2212'}</span></span>`;
                    }
                    const activeClass = activeContext === c ? ' active' : '';
                    return `<span style="white-space:nowrap"><a href="#" class="context-link${activeClass}" data-context="${c}" style="color:${nameColor};text-decoration:none">${c}</a><span class="ctx-toggle${excl ? ' excluded' : ''}" data-ctx="${c}" title="${excl ? 'Include' : 'Exclude'} ${c}">${excl ? '+' : '\u2212'}</span></span>`;
                }).join(' ');
                html += `<div class="status-line">Contexts: ${ctxChips}</div>`;
            }

            // Tags
            if (data.all_tags && data.all_tags.length > 0) {
                const tagLinks = data.all_tags.map(t => {
                    const activeClass = activeTags.has(t) ? ' active' : '';
                    return `<a href="#" class="tag-link${activeClass}" data-tag="${t}" style="color:#9ccc65;text-decoration:none">${t}</a>`;
                }).join(', ');
                html += `<div class="status-line">Tags: ${tagLinks}, <a href="/tjai/tag/_none/" style="color:#888;text-decoration:none">(none)</a></div>`;
            }

            // Entry types
            const types = [
                ['ai', 'ai', 'AI guidance'], ['b', 'bookmark', 'bookmark'], ['do', 'todo', 'todo'],
                ['j', 'journal', 'journal'], ['m', 'memory', 'memory'], ['p', 'profile', 'profile']
            ];
            const typeLinks = types.map(([abbr, kind, label]) => {
                const activeClass = activeKind === kind ? ' active' : '';
                return `<a href="#" class="kind-link${activeClass}" data-kind="${kind}" style="color:#daa520;text-decoration:none">[${abbr}]=${label}</a>`;
            }).join(' ');
            html += `<div class="status-line">Types: ${typeLinks}</div>`;

            // Open todos
            if (data.open_todos && data.open_todos.length > 0) {
                const todoStr = data.open_todos.map(t =>
                    `<a href="#" class="todo-link" style="color:inherit;text-decoration:none"><span class="context">${t.context ? t.context : '(none)'}</span> <span style="color:#8a8a8a;font-size:11px">${t.count}</span></a>`
                ).join(' ');
                html += `<div class="status-line">Todos: ${todoStr}</div>`;
            }

            // Machines
            if (data.machines && data.machines.length > 0) {
                const machineStrs = data.machines.slice().sort().map(m => {
                    const activeClass = activeMachine === m ? ' active' : '';
                    let mLink = `<a href="#" class="machine-link${activeClass}" data-machine="${m}" style="color:#64b5f6;text-decoration:none">${m}</a>`;
                    if (data.oldest_sync && data.oldest_sync.machine === m) {
                        const age = data.oldest_sync.age_min;
                        const ageStr = age < 60 ? `${age}m` : `${Math.floor(age/60)}h${age%60}m`;
                        mLink += ` <span style="color:#888">(${ageStr})</span>`;
                    }
                    return mLink;
                });
                html += `<div class="status-line">Machines: ${machineStrs.join(', ')}</div>`;
            }

            // Today's work sessions
            if (data.work_sessions && data.work_sessions.length > 0) {
                const tz = data.timezone || 'America/New_York';
                let totalWork = 0;
                let totalBreaks = 0;
                html += '<div style="margin-bottom: 12px;">';
                for (const s of data.work_sessions) {
                    const startDt = new Date(s.start * 1000);
                    const endDt = new Date(s.end * 1000);
                    const startOpts = { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false };
                    const startStr = new Intl.DateTimeFormat('en-US', startOpts).format(startDt);
                    const endStr = new Intl.DateTimeFormat('en-US', startOpts).format(endDt);
                    const ctx = s.context ? `<span style="color:#ce93d8">=${s.context}</span> ` : '';
                    const status = s.stopped ? '' : ' <span style="color:#9ccc65">(active)</span>';
                    html += `<div class="clock-status">${ctx}${startStr}-${endStr}: ${formatDuration(s.work_min)} work, ${formatDuration(s.breaks_min)} breaks${status}</div>`;
                    totalWork += s.work_min;
                    totalBreaks += s.breaks_min;
                }
                if (data.work_sessions.length > 1) {
                    html += `<div class="clock-status" style="margin-top:4px;font-weight:bold;">Total: ${formatDuration(totalWork)} work, ${formatDuration(totalBreaks)} breaks</div>`;
                }
                html += '</div>';
            }

            document.getElementById('status-fixed').innerHTML = html;

            // Entries (tj l format) - skip only if search is active
            dashboardTimezone = data.timezone || 'America/New_York';
            if (!document.getElementById('entry-search').value.trim() && !isSearchActive) {
                const entries = data.recent_entries || [];
                loadedEntryCount = entries.length;
                hasMoreEntries = data.has_more;
                totalEntryCount = data.total_count || entries.length;
                isFilterActive = buildFilterParams().length > 0;
                document.getElementById('entries-label').innerHTML = entriesLabel();
                document.getElementById('entries-list').innerHTML = renderEntries(entries, dashboardTimezone);
                // Highlight tags that co-occur with selected tags
                highlightAvailableTags(entries);
            }
        }

        function highlightAvailableTags(entries) {
            const availableTags = new Set();
            if (activeTags.size > 0) {
                for (const e of entries) {
                    if (e.all_tags) e.all_tags.forEach(t => availableTags.add(t));
                }
            }
            document.querySelectorAll('.tag-link').forEach(chip => {
                const t = chip.dataset.tag;
                chip.classList.toggle('available', activeTags.size > 0 && !activeTags.has(t) && availableTags.has(t));
            });
        }

        function getWeekNumber(d) {
            const oneJan = new Date(d.getFullYear(), 0, 1);
            const days = Math.floor((d - oneJan) / 86400000);
            return Math.ceil((days + oneJan.getDay() + 1) / 7);
        }

        function getWeekStart(d) {
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.getFullYear(), d.getMonth(), diff);
        }

        let lastRefreshTime = Date.now();
        let lastBuildTime = 0;
        function updateRefreshIndicator() {
            lastRefreshTime = Date.now();
        }
        function updateRefreshDisplay() {
            const sec = Math.floor((Date.now() - lastRefreshTime) / 1000);
            document.getElementById('refresh-indicator').textContent = `Last refresh ${sec}s ago. Build time ${lastBuildTime} ms`;
            // Update calendar time
            const now = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const timeStr = `${days[now.getDay()]} ${months[now.getMonth()]} ${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            document.getElementById('calendar-time').textContent = timeStr;
        }

        async function refresh() {
            const start = performance.now();
            await Promise.all([fetchCalendar(), fetchStatus(), fetchNamed()]);
            lastBuildTime = Math.round(performance.now() - start);
            updateRefreshIndicator();
            updateRefreshDisplay();
        }

        // Helper to toggle a filter and update active class on its link group
        function toggleFilter(varName, value, linkClass) {
            if (varName === 'machine') activeMachine = activeMachine === value ? null : value;
            else if (varName === 'tag') { if (activeTags.has(value)) activeTags.delete(value); else activeTags.add(value); }
            else if (varName === 'kind') activeKind = activeKind === value ? null : value;
            else if (varName === 'context') activeContext = activeContext === value ? null : value;
            if (varName === 'tag') {
                document.querySelectorAll(`.${linkClass}`).forEach(el => {
                    el.classList.toggle('active', activeTags.has(el.dataset[varName]));
                });
            } else {
                const current = varName === 'machine' ? activeMachine : varName === 'kind' ? activeKind : activeContext;
                document.querySelectorAll(`.${linkClass}`).forEach(el => {
                    el.classList.toggle('active', el.dataset[varName] === current);
                });
            }
            syncStateToUrl();
            fetchFilteredEntries();
        }

        // Event delegation for all filter clicks
        document.getElementById('status-fixed').addEventListener('click', function(e) {
            // Context exclude toggle (minus sign) — must check before context-link
            const ctxToggle = e.target.closest('.ctx-toggle');
            if (ctxToggle) {
                e.preventDefault();
                e.stopPropagation();
                const ctx = ctxToggle.dataset.ctx;
                if (excludedContexts.has(ctx)) excludedContexts.delete(ctx);
                else excludedContexts.add(ctx);
                const excl = excludedContexts.has(ctx);
                ctxToggle.textContent = excl ? '+' : '\u2212';
                ctxToggle.classList.toggle('excluded', excl);
                ctxToggle.title = (excl ? 'Include ' : 'Exclude ') + ctx;
                const nameEl = ctxToggle.previousElementSibling;
                if (nameEl) nameEl.style.color = excl ? '#666' : '#ce93d8';
                syncStateToUrl();
                fetchFilteredEntries();
                return;
            }

            const machineLink = e.target.closest('.machine-link');
            if (machineLink) { e.preventDefault(); toggleFilter('machine', machineLink.dataset.machine, 'machine-link'); return; }

            const tagLink = e.target.closest('.tag-link');
            if (tagLink) { e.preventDefault(); toggleFilter('tag', tagLink.dataset.tag, 'tag-link'); return; }

            const kindLink = e.target.closest('.kind-link');
            if (kindLink) { e.preventDefault(); toggleFilter('kind', kindLink.dataset.kind, 'kind-link'); return; }

            const todoLink = e.target.closest('.todo-link');
            if (todoLink) {
                e.preventDefault();
                activeKind = activeKind === 'todo' ? null : 'todo';
                document.querySelectorAll('.kind-link').forEach(el => {
                    el.classList.toggle('active', activeKind === el.dataset.kind);
                });
                syncStateToUrl();
                fetchFilteredEntries();
                return;
            }

            const ctxLink = e.target.closest('.context-link');
            if (ctxLink) { e.preventDefault(); toggleFilter('context', ctxLink.dataset.context, 'context-link'); return; }
        });

        // Filter clear button - clears everything: search, all filters
        document.getElementById('filter-clear').addEventListener('click', function() {
            // Clear search
            const searchInput = document.getElementById('entry-search');
            const searchClear = document.getElementById('search-clear');
            if (searchInput.value) {
                searchInput.value = '';
                searchClear.style.display = 'none';
            }
            // Clear all filters
            activeMachine = null;
            activeTags.clear();
            activeKind = null;
            activeContext = null;
            excludedContexts.clear();
            isFilterActive = false;
            document.querySelectorAll('.machine-link.active, .tag-link.active, .kind-link.active, .context-link.active').forEach(el => el.classList.remove('active'));
            syncStateToUrl();
            // Refresh
            refresh();
        });

        // Restore entries after search clears (re-apply filters if active)
        function restoreFromSearch() {
            isSearchActive = false;
            if (isFilterActive) {
                fetchFilteredEntries();
            } else {
                refresh();
            }
        }

        // Search on Enter, Escape to clear
        const searchInput = document.getElementById('entry-search');
        const searchClear = document.getElementById('search-clear');
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const q = this.value.trim();
                if (q) {
                    searchEntries(q);
                } else {
                    restoreFromSearch();
                }
            } else if (e.key === 'Escape') {
                this.value = '';
                searchClear.style.display = 'none';
                restoreFromSearch();
            }
        });
        searchInput.addEventListener('input', function() {
            searchClear.style.display = this.value ? 'inline' : 'none';
        });
        searchClear.addEventListener('click', function() {
            searchInput.value = '';
            searchClear.style.display = 'none';
            searchInput.focus();
            restoreFromSearch();
        });

        // Load filter state from URL params (for bookmarks / programmatic URLs)
        loadStateFromUrl();

        // Initial load
        refresh();

        // Refresh every 20 seconds
        setInterval(refresh, 20000);

        // Update refresh display every second
        setInterval(updateRefreshDisplay, 1000);
    </script>
</body>
</html>

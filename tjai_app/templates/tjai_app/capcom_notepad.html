<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capcom {{ pad_label }}</title>
    <link rel="stylesheet" href="/tjai/static/tjai/vendor/codemirror/5.65.18/codemirror.min.css">
    <link rel="stylesheet" href="/tjai/static/tjai/vendor/codemirror/5.65.18/theme/material-darker.min.css">
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body {
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            color: #e0e0e0;
            font: 13px 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
        }
        .notepad-bar {
            min-height: 27px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 3px 9px;
            border-bottom: 1px solid #2b2b2b;
        }
        .pad-tab { color: #999; text-decoration: none; }
        .pad-tab:hover { color: #ccc; }
        .pad-tab.active { color: #90caf9; }
        .pad-sep { color: #555; }
        .prettify-toggle { display: flex; align-items: center; gap: 4px;
                           color: #aaa; cursor: pointer; }
        .prettify-toggle input { margin: 0; accent-color: #90caf9; }
        #preview-error { color: #ef5350; }
        #save-error { display: none; color: #ef5350; }
        .history { color: #777; text-decoration: none; font-size: 11px;
                   margin-left: auto; }
        .history:hover { color: #bbb; text-decoration: underline; }
        #editor-shell { flex: 1; min-height: 0; }
        [hidden] { display: none !important; }
        #prettified { flex: 1; min-height: 0; overflow: auto; padding: 18px 24px;
                      font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                      overflow-wrap: anywhere; }
        #prettified > :first-child { margin-top: 0; }
        #prettified h1, #prettified h2, #prettified h3,
        #prettified h4 { line-height: 1.3; color: #eee; margin: 1.4em 0 .6em; }
        #prettified h1 { font-size: 1.8em; }
        #prettified h2 { font-size: 1.4em; border-bottom: 1px solid #333; padding-bottom: .3em; }
        #prettified h3 { font-size: 1.15em; }
        #prettified p, #prettified ul, #prettified ol { margin: .7em 0; }
        #prettified li { margin: .25em 0; }
        #prettified a { color: #90caf9; }
        #prettified blockquote { margin-left: 0; padding-left: 16px; border-left: 3px solid #555; color: #bbb; }
        #prettified table { border-collapse: collapse; width: 100%; margin: 1em 0; }
        #prettified th, #prettified td { border: 1px solid #444; padding: 7px 10px; text-align: left; vertical-align: top; }
        #prettified th { background: #252525; }
        #prettified code { font: .9em 'SF Mono', 'Monaco', 'Menlo', monospace; color: #f0c0c0; }
        #prettified pre { overflow: auto; padding: 12px; background: #151515; border: 1px solid #333; border-radius: 4px; }
        #prettified pre code { overflow-wrap: normal; }
        #prettified img { max-width: 100%; height: auto; }
        #prettified hr { border: 0; border-top: 1px solid #444; margin: 1.5em 0; }
        #editor { display: none; }
        .CodeMirror { width: 100%; height: 100% !important; font: inherit; }
        .CodeMirror, .CodeMirror-scroll, .CodeMirror-gutters,
        .CodeMirror-sizer, .CodeMirror-gutter-filler,
        .CodeMirror-hscrollbar, .CodeMirror-vscrollbar,
        .CodeMirror-scrollbar-filler { background: #1a1a1a !important; }
        .CodeMirror-gutters { border-right: 1px solid #2b2b2b; }
        .CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected {
            background: #264f78 !important;
        }
        /* CodeMirror's markdown mode tokens backtick code as 'comment';
           match the entry pages' inline-code pink instead of theme grey */
        .cm-s-material-darker span.cm-comment { color: #f0c0c0; }
        /* bare URLs (padlink overlay): show and behave as links */
        .cm-s-material-darker span.cm-padlink {
            color: #90caf9; text-decoration: underline; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="notepad-bar">
        <a class="pad-tab{% if pad == 'notepad' %} active{% endif %}"
           href="?pad=notepad">Notepad</a>
        <span class="pad-sep">·</span>
        <a class="pad-tab{% if pad == 'pouch' %} active{% endif %}"
           href="?pad=pouch">Pouch</a>
        {% if pad == 'pouch' %}
        <label class="prettify-toggle"><input type="checkbox" id="prettify-toggle">prettified</label>
        <span id="preview-error" hidden></span>
        {% endif %}
        <span id="save-error"></span>
        <a class="history" href="/tjai/entry/?entry_id={{ pad_entry_id }}&amp;edit=1"
           target="_blank" rel="noopener">history</a>
    </div>
    <div id="editor-shell"><textarea id="editor">{{ entry.content }}</textarea></div>
    {% if pad == 'pouch' %}
    <div id="prettified" tabindex="0" aria-label="Pouch rendered Markdown" hidden>{{ content_html|safe }}</div>
    {% include 'tjai_app/_prism.html' %}
    {% include 'tjai_app/_katex.html' %}
    {% endif %}

    <script src="/tjai/static/tjai/vendor/codemirror/5.65.18/codemirror.min.js"></script>
    <script src="/tjai/static/tjai/vendor/codemirror/5.65.18/mode/markdown/markdown.min.js"></script>
    <script>
    (function() {
        const initialContent = "{{ entry.content|escapejs }}";
        const saveUrl = "{% url 'api_entry_save' entry.id %}";
        const csrfToken = "{{ csrf_token }}";
        const entryUuid = "{{ entry.id }}";
        const draftPrefix = 'tjai-capcom-notepad-draft:' + entryUuid + ':';
        const instanceId = (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : Date.now().toString(36) + Math.random().toString(36).slice(2);
        const draftKey = draftPrefix + instanceId;
        let serverTimestamp = Number("{{ entry.timestamp_modified }}") || 0;
        let lastServerContent = initialContent;
        let saveInFlight = null;
        let savePending = false;
        let idleTimer = null;
        let firstSaveForFocus = true;
        let applyingMerge = false;

        function parseJsonResponse(response) {
            return response.text().then(function(text) {
                let data = {};
                try { data = text ? JSON.parse(text) : {}; }
                catch (e) { throw new Error('HTTP ' + response.status + ' returned non-JSON'); }
                if (!response.ok) throw new Error(data.error || ('HTTP ' + response.status));
                return data;
            });
        }

        function unionLines(primary, secondary) {
            const lines = primary.split('\n');
            const seen = new Set(lines);
            secondary.split('\n').forEach(function(line) {
                if (line.trim() && !seen.has(line)) {
                    lines.push(line);
                    seen.add(line);
                }
            });
            return lines.join('\n');
        }

        function recoverDrafts(content) {
            let recovered = content;
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (!key || !key.startsWith(draftPrefix)) continue;
                    const draft = JSON.parse(localStorage.getItem(key));
                    if (!draft || typeof draft.content !== 'string') continue;
                    if (Number(draft.written_at) <= serverTimestamp + 0.5) continue;
                    recovered = unionLines(recovered, draft.content);
                }
            } catch (e) {}
            return recovered;
        }

        const recoveredContent = recoverDrafts(initialContent);
        const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
            mode: 'markdown',
            theme: 'material-darker',
            lineWrapping: true,
            lineNumbers: true,
            indentUnit: 2,
            tabSize: 2,
            indentWithTabs: false,
            extraKeys: {
                'Tab': function(cm) {
                    if (cm.somethingSelected()) cm.indentSelection('add');
                    else cm.replaceSelection('  ', 'end');
                },
                'Shift-Tab': function(cm) { cm.indentSelection('subtract'); },
                'Ctrl-S': function() { flushSave(); },
                'Cmd-S': function() { flushSave(); },
            },
        });
        editor.setValue(recoveredContent);

        const prettifyToggle = document.getElementById('prettify-toggle');
        const preview = document.getElementById('prettified');
        const prettifyKey = 'tjai-capcom-pouch-prettified';
        let renderedContent = initialContent;
        let renderedHtml = preview ? preview.innerHTML : '';
        let renderSequence = 0;

        function focusPad() {
            if (prettifyToggle && prettifyToggle.checked) preview.focus();
            else editor.focus();
        }

        function decoratePreview() {
            preview.querySelectorAll('a').forEach(function(link) {
                // Section links stay in the reading pane; other links keep it open.
                if (!(link.getAttribute('href') || '').startsWith('#')) {
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                }
            });
            if (window.Prism) Prism.highlightAllUnder(preview);
            if (window.katex) preview.querySelectorAll('.arithmatex').forEach(function(el) {
                if (el.querySelector('.katex')) return;
                const tex = el.textContent.trim();
                katex.render(tex.slice(2, -2), el, {
                    displayMode: tex.startsWith('\\['), throwOnError: false,
                });
            });
        }

        async function applyPrettified() {
            const sequence = ++renderSequence;
            const on = prettifyToggle.checked;
            const error = document.getElementById('preview-error');
            error.hidden = true;
            document.getElementById('editor-shell').hidden = on;
            preview.hidden = !on;
            if (!on) {
                editor.refresh();
                return;
            }
            const content = editor.getValue();
            if (content !== renderedContent) {
                preview.textContent = 'Rendering…';
                try {
                    const response = await fetch("{% url 'capcom_notepad' %}", {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
                        body: JSON.stringify({content: content}),
                    });
                    const data = await parseJsonResponse(response);
                    if (sequence !== renderSequence) return;
                    if (typeof data.html !== 'string') throw new Error('Invalid preview response');
                    renderedHtml = data.html;
                    renderedContent = content;
                } catch (e) {
                    if (sequence !== renderSequence) return;
                    preview.textContent = 'Unable to render. Turn off prettified to read or edit the source.';
                    error.textContent = e.message;
                    error.hidden = false;
                    return;
                }
            }
            preview.innerHTML = renderedHtml;
            decoratePreview();
        }

        if (prettifyToggle) {
            try { prettifyToggle.checked = localStorage.getItem(prettifyKey) === '1'; }
            catch (e) { console.warn('Cannot read pouch display preference:', e); }
            prettifyToggle.addEventListener('change', function() {
                try { localStorage.setItem(prettifyKey, prettifyToggle.checked ? '1' : '0'); }
                catch (e) {
                    showError('DISPLAY PREFERENCE NOT SAVED: ' + e.message);
                }
                applyPrettified();
            });
            applyPrettified();
        }

        // Bare URLs render and behave as links: an overlay tokens them
        // (class cm-padlink), a click on one opens it in a new tab.
        // Clicking anywhere else still just places the cursor.
        const urlRe = /https?:\/\/[^\s<>"')\]]+/g;
        editor.addOverlay({
            token: function(stream) {
                urlRe.lastIndex = stream.pos;
                const m = urlRe.exec(stream.string);
                if (m && m.index === stream.pos) {
                    stream.pos = urlRe.lastIndex;
                    return 'padlink';
                }
                if (m) stream.pos = m.index; else stream.skipToEnd();
                return null;
            }
        });
        editor.getWrapperElement().addEventListener('mousedown', function(e) {
            if (!e.target.closest('.cm-padlink')) return;
            const pos = editor.coordsChar({left: e.clientX, top: e.clientY});
            const line = editor.getLine(pos.line) || '';
            urlRe.lastIndex = 0;
            let m;
            while ((m = urlRe.exec(line))) {
                if (pos.ch >= m.index && pos.ch <= m.index + m[0].length) {
                    e.preventDefault();
                    window.open(m[0].replace(/[.,;:]+$/, ''), '_blank');
                    return;
                }
            }
        });

        function writeDraft() {
            try {
                localStorage.setItem(draftKey, JSON.stringify({
                    content: editor.getValue(),
                    written_at: Date.now() / 1000,
                    base_timestamp: serverTimestamp,
                }));
            } catch (e) {
                showError('LOCAL RECOVERY FAILED: ' + e.message);
            }
        }

        function clearSatisfiedDrafts() {
            try {
                const keys = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith(draftPrefix)) keys.push(key);
                }
                keys.forEach(function(key) {
                    const draft = JSON.parse(localStorage.getItem(key));
                    if (!draft || typeof draft.content !== 'string') return;
                    const missing = draft.content.split('\n').some(function(line) {
                        return line.trim() && !lastServerContent.split('\n').includes(line);
                    });
                    if (!missing) localStorage.removeItem(key);
                });
            } catch (e) {}
        }

        function showError(message) {
            const el = document.getElementById('save-error');
            el.textContent = message;
            el.style.display = '';
        }

        function clearError() {
            const el = document.getElementById('save-error');
            el.textContent = '';
            el.style.display = 'none';
        }

        function applyServerMerge(mergedContent) {
            const current = editor.getValue();
            const combined = unionLines(current, mergedContent || '');
            if (combined === current) return;
            applyingMerge = true;
            const end = editor.posFromIndex(current.length);
            editor.replaceRange(combined.slice(current.length), end, end, '+remote');
            applyingMerge = false;
            writeDraft();
            if (prettifyToggle && prettifyToggle.checked) applyPrettified();
        }

        function scheduleSave(delay) {
            savePending = true;
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(flushSave, delay == null ? 1200 : delay);
        }

        function flushSave() {
            if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
            writeDraft();
            savePending = true;
            if (saveInFlight) return saveInFlight;

            const sentContent = editor.getValue();
            if (sentContent === lastServerContent) {
                savePending = false;
                clearSatisfiedDrafts();
                return Promise.resolve();
            }

            const wasFirstSave = firstSaveForFocus;
            const body = {
                content: sentContent,
                autosave: true,
                expected_ts: serverTimestamp,
            };
            if (wasFirstSave) body.first_autosave = true;
            savePending = false;
            let failed = false;
            saveInFlight = fetch(saveUrl, {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
                body: JSON.stringify(body),
            }).then(parseJsonResponse).then(function(data) {
                if (!data.ok) throw new Error(data.error || 'save failed');
                firstSaveForFocus = false;
                serverTimestamp = Number(data.timestamp_modified) || serverTimestamp;
                if (data.merged) applyServerMerge(data.merged_content);
                lastServerContent = data.merged ? data.merged_content : sentContent;
                clearSatisfiedDrafts();
                clearError();
            }).catch(function(error) {
                failed = true;
                savePending = true;
                if (wasFirstSave) firstSaveForFocus = true;
                showError('AUTOSAVE FAILED: ' + error.message);
            }).finally(function() {
                saveInFlight = null;
                if (!failed && (savePending || editor.getValue() !== lastServerContent)) {
                    setTimeout(flushSave, 0);
                }
            });
            return saveInFlight;
        }

        function finalFlush() {
            writeDraft();
            const content = editor.getValue();
            if (content === lastServerContent) return;
            const body = {
                content: content,
                autosave: true,
                expected_ts: serverTimestamp,
            };
            if (firstSaveForFocus) body.first_autosave = true;
            try {
                fetch(saveUrl, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
                    body: JSON.stringify(body),
                    keepalive: true,
                });
            } catch (e) {}
        }

        editor.on('change', function() {
            if (applyingMerge) return;
            writeDraft();
            scheduleSave();
        });
        editor.on('focus', function() { firstSaveForFocus = true; });
        editor.on('blur', flushSave);
        window.addEventListener('blur', flushSave);
        window.addEventListener('online', flushSave);
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'hidden') flushSave();
        });
        window.addEventListener('message', function(event) {
            if (event.origin !== window.location.origin) return;
            if (event.data && event.data.type === 'tjai-capcom-notepad-flush') flushSave();
            if (event.data && event.data.type === 'tjai-capcom-notepad-focus') focusPad();
        });
        window.addEventListener('pagehide', finalFlush);

        if (recoveredContent !== initialContent) {
            writeDraft();
            scheduleSave(0);
        } else {
            clearSatisfiedDrafts();
        }
        if (window.parent !== window) {
            window.parent.postMessage(
                {type: 'tjai-capcom-pad', pad: "{{ pad }}"}, window.location.origin);
        }
        focusPad();
        setInterval(function() {
            if (editor.getValue() !== lastServerContent) flushSave();
        }, 10000);
    })();
    </script>
</body>
</html>

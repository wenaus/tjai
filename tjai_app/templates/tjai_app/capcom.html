<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/tjai/static/tjai/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tjai Capcom</title>
    <link rel="stylesheet" href="/tjai/static/tjai/menu.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        a { color: #90caf9; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .container { flex: 1; display: flex; overflow: hidden; }
        .left-panel {
            flex: 0 0 30%;
            overflow-y: auto;
            border-right: 1px solid #333;
            padding: 12px;
        }
        .right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .section-head { color: #e0e0e0; font-size: 11px; text-transform: uppercase;
                        letter-spacing: 1px; margin: 14px 0 8px; }
        .section-head:first-child { margin-top: 0; }
        .notepad-section {
            color: #ddd;
            background: #222;
            border-left: 3px solid #555;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 14px;
            padding: 6px 8px;
            text-transform: uppercase;
        }
        .notepad-section:hover { background: #292929; }
        .notepad-section.active { border-left-color: #90caf9; }
        .notepad-section .pad-link { cursor: pointer; }
        .notepad-section .pad-link.active-pad { color: #90caf9; }
        .notepad-section .pad-sep { color: #666; padding: 0 5px;
                                    pointer-events: none; }

        /* State tiles */
        .tile { display: flex; align-items: stretch; position: relative;
                margin-bottom: 4px; background: #222;
                border-left: 3px solid #444; cursor: grab; }
        .tile:hover { background: #292929; }
        .tile.sortable-ghost { opacity: 0.1; }
        .tile-main { display: flex; flex: 1; justify-content: space-between;
                     align-items: baseline; min-width: 0; padding: 5px 3px 5px 8px;
                     color: inherit; text-decoration: none; }
        a.tile-main:hover { text-decoration: none; }
        .tile .t-source { color: #bbb; }
        .tile .t-reading { margin-left: 6px; text-align: right; }
        .tile .t-value { font-weight: bold; }
        .tile .t-ago { color: #777; font-size: 11px; margin-left: 6px; }
        .state-menu-btn { width: 17px; padding: 0; border: 0; background: none;
                          color: #777; cursor: pointer; font-family: inherit;
                          font-size: 15px; line-height: 1; }
        .state-menu-btn:hover { color: #ccc; }
        .state-popover { position: absolute; z-index: 20; right: 2px; top: calc(100% - 2px);
                         min-width: 68px; padding: 2px; background: #292929;
                         border: 1px solid #555; box-shadow: 0 3px 8px #111; }
        .state-popover[hidden] { display: none; }
        .state-popover button { width: 100%; padding: 3px 7px; border: 0;
                                background: none; color: #ccc; cursor: pointer;
                                font: 11px inherit; text-align: left; }
        .state-popover button:hover { background: #383838; color: #fff; }
        .tile.green { border-left-color: #9ccc65; } .tile.green .t-value { color: #9ccc65; }
        .tile.yellow { border-left-color: #ffd54f; } .tile.yellow .t-value { color: #ffd54f; }
        .tile.red { border-left-color: #ef5350; } .tile.red .t-value { color: #ef5350; }
        .tile.meeting-tile { border-left-color: #90caf9; cursor: default; }
        .tile.meeting-tile .t-value { color: #e0e0e0; }
        .tile.meeting-tile .t-ago { color: #aaa; }
        .tile.meeting-tile .meeting-time { color: inherit; }
        .tile[data-state-key="corun-ai"] .t-value { font-size: 11px; }
        .tile[data-state-key="corun-ai"] .t-ago.recent { color: #fff; }
        .tile[data-state-key="corun-ai"] .t-ago.fresh { color: #9ccc65; }

        /* Pins */
        .pin { position: relative; display: flex; align-items: baseline; gap: 6px; padding: 4px 4px;
               border-bottom: 1px solid #262626; }
        .pin a { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pin.special { gap: 0; }
        .pin.special a { flex: 0 0 auto; overflow: visible; }
        .pin.special .pin-sep { color: #777; white-space: pre; }
        .pin .state-popover { min-width: 88px; }
        #pins-top .pin { cursor: grab; }
        #pins-top .pin.sortable-ghost { opacity: 0.4; }
        .pins-divider { border-bottom: 1px solid #333; margin: 6px 0; }

        /* Right pane header */
        .pane-header { display: flex; align-items: center; gap: 16px;
                       padding: 10px 16px; border-bottom: 1px solid #333; }
        .view-tabs { display: flex; gap: 14px; }
        .view-tab { color: #8a8a8a; cursor: pointer; padding-bottom: 2px; }
        .view-tab.active { color: #e0e0e0; border-bottom: 2px solid #90caf9; }
        .hdr-controls { margin-left: auto; display: flex; align-items: center; gap: 12px; }
        .hdr-controls label { color: #bbb; cursor: pointer; }
        .hdr-btn { background: none; border: 1px solid #444; color: #bbb; cursor: pointer;
                   font-size: 12px; font-family: inherit; padding: 3px 10px; border-radius: 3px; }
        .hdr-btn:hover { color: #e0e0e0; border-color: #666; }
        #unread-chip { color: #9ccc65; }

        /* Feed */
        .feed-area { flex: 1; overflow-y: auto; padding: 8px 16px 40px; }
        .notice { display: flex; align-items: baseline; gap: 8px; padding: 5px 6px;
                  border-bottom: 1px solid #242424; cursor: pointer; }
        .notice.selected { outline: 1px solid #90caf9; }
        .notice .n-time { color: #aaa; font-size: 11px; white-space: nowrap; }
        .notice .n-dot { font-size: 11px; }
        .notice .n-dot.info { color: #90caf9; }
        .notice .n-dot.warning { color: #ffd54f; }
        .notice .n-dot.alarm { color: #ef5350; }
        .notice .n-source { color: #b39ddb; font-size: 11px; white-space: nowrap; cursor: pointer; }
        .notice .n-spacer { flex: 1; }
        .notice.read, .notice.read .n-title, .notice.read .n-source,
        .notice.read .n-time, .notice.read .n-dot, .notice.read .n-count,
        .notice.read .n-title a { color: #777; }
        .notice .n-count { color: #ffd54f; font-size: 11px; }
        .notice .n-mark { background: #242424; border: 1px solid #555; color: #aaa;
                          cursor: pointer; font-family: inherit; font-size: 12px;
                          font-weight: normal; line-height: 1.15;
                          padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
        .notice.read .n-mark { background: #242424; color: #999; border-color: #555; }
        .notice .n-mark:hover, .notice.read .n-mark:hover {
            background: #2d2d2d; color: #ccc; border-color: #777;
        }
        .notice-detail { margin: 0 6px 6px 60px; padding: 6px 10px;
                         border-left: 3px solid #444; background: #212121;
                         color: #bbb; font-size: 12px; }
        .notice-detail .d-meta { color: #8a8a8a; font-size: 11px; margin-bottom: 4px; }
        .notice-detail .d-text { white-space: pre-wrap; }
        .feed-note { color: #8a8a8a; padding: 20px; text-align: center; }
        #load-more { display: block; margin: 12px auto; }

        /* Config */
        .config-area { flex: 1; overflow-y: auto; padding: 16px; }
        .notepad-area { flex: 1; min-height: 0; }
        .notepad-area iframe { display: block; width: 100%; height: 100%; border: 0; }
        .cfg-section { border: 1px solid #333; border-left-width: 4px;
                       margin-bottom: 24px; padding: 0 12px 12px; }
        .cfg-section.feed { border-left-color: #607d8b; }
        .cfg-section.state { border-left-color: #6f8054; }
        .cfg-section-title { background: #242424; border-bottom: 1px solid #333;
                             color: #ddd; font-size: 13px; font-weight: 600;
                             margin: 0 -12px 10px; padding: 7px 10px; }
        .cfg-table { border-collapse: collapse; margin-bottom: 14px; }
        .cfg-table th { color: #8a8a8a; font-size: 11px; text-align: left;
                        padding: 4px 10px 4px 0; border-bottom: 1px solid #333; }
        .cfg-table td { padding: 4px 10px 4px 0; border-bottom: 1px solid #242424; }
        .cfg-table input[type=text], .cfg-table input[type=number], .cfg-table select {
            background: #222; color: #e0e0e0; border: 1px solid #444;
            font-family: inherit; font-size: 12px; padding: 2px 5px; }
        .cfg-table input.src-name { width: 130px; }
        .cfg-table input.src-cadence { width: 60px; }
        .cfg-table input.src-note { width: 520px; }
        .cfg-row-btn { background: none; border: 1px solid #444; color: #8a8a8a;
                       cursor: pointer; font-family: inherit; font-size: 11px;
                       padding: 2px 8px; border-radius: 3px; }
        .cfg-row-btn:hover { color: #e0e0e0; border-color: #666; }
        .cfg-last { color: #777; font-size: 11px; }
        .cfg-actions { display: flex; gap: 12px; align-items: center; margin-top: 8px; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        * { scrollbar-width: thin; scrollbar-color: #444 #1a1a1a; }
    </style>
</head>
<body>
    {% with current_page="capcom" %}{% include "tjai_app/_menu.html" %}{% endwith %}
    <div class="container">
        <div class="left-panel">
            <div class="notepad-section" id="notepad-section" data-view="notepad"><span class="pad-link" data-pad="notepad">Notepad</span><span class="pad-sep">·</span><span class="pad-link" data-pad="pouch">Pouch</span></div>
            <div class="section-head">State</div>
            <div id="state-tiles"><div class="feed-note">No state reports yet.</div></div>
            <div class="section-head">Pins</div>
            <div id="pins-special"></div>
            <div id="pins-top"></div>
            <div class="pins-divider" id="pins-divider" style="display:none"></div>
            <div id="pins-rest"></div>
        </div>
        <div class="right-panel">
            <div class="pane-header">
                <div class="view-tabs">
                    <span class="view-tab" data-view="feed">Feed</span>
                    <span class="view-tab" data-view="config">Config</span>
                </div>
                <span id="unread-chip"></span>
                <div class="hdr-controls" id="feed-controls">
                    <label><input type="checkbox" id="unread-only"> unread only</label>
                    <button class="hdr-btn" id="mark-all">Mark all read</button>
                    <button class="hdr-btn" id="update-now">Update</button>
                </div>
            </div>
            <div class="feed-area" id="feed-area">
                <div class="feed-note">Loading…</div>
            </div>
            <div class="config-area" id="config-area" style="display:none"></div>
            <div class="notepad-area" id="notepad-area" style="display:none">
                <iframe id="notepad-frame" data-src="{% url 'capcom_notepad' %}"
                        title="Capcom Notepad"></iframe>
            </div>
        </div>
    </div>

    <script src="/tjai/static/tjai/tjai-utils.js"></script>
    <script src="/tjai/static/tjai/sortable.min.js"></script>
    <script>
    let view = 'feed';
    let padSel = null;
    let unreadOnly = false;
    let filterSource = '', filterSeverity = '';
    let offset = 0, notices = [], hasMore = false;
    let selIdx = -1;
    let lastData = null;
    let pinOrder = [];
    let pinDragging = false;
    let stateOrder = [];
    let stateDragging = false;
    let configSaveQueue = Promise.resolve();

    function loadStateFromUrl() {
        const p = new URLSearchParams(location.search);
        view = ['feed', 'config', 'notepad'].includes(p.get('view')) ? p.get('view') : 'feed';
        padSel = ['notepad', 'pouch'].includes(p.get('pad')) ? p.get('pad') : null;
        unreadOnly = p.get('unread') === '1';
        filterSource = p.get('source') || '';
        filterSeverity = p.get('severity') || '';
    }
    function syncStateToUrl() {
        const p = new URLSearchParams();
        if (view !== 'feed') p.set('view', view);
        if (view === 'notepad' && padSel) p.set('pad', padSel);
        if (unreadOnly) p.set('unread', '1');
        if (filterSource) p.set('source', filterSource);
        if (filterSeverity) p.set('severity', filterSeverity);
        const qs = p.toString();
        history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
    }

    async function fetchJson(url, options) {
        const r = await fetch(url, options);
        let d;
        try { d = await r.json(); }
        catch (e) { throw new Error(url + ': non-JSON response'); }
        if (!r.ok) throw new Error(d.error || (url + ': HTTP ' + r.status));
        return d;
    }

    function feedParams(off) {
        const p = new URLSearchParams();
        if (off) p.set('offset', off);
        if (unreadOnly) p.set('unread', '1');
        if (filterSource) p.set('source', filterSource);
        if (filterSeverity) p.set('severity', filterSeverity);
        return p.toString();
    }

    async function fetchData(append) {
        try {
            const d = await fetchJson('/tjai/api/capcom/feed?' + feedParams(append ? offset : 0));
            lastData = d;
            if (append) { notices = notices.concat(d.notices); }
            else { notices = d.notices; offset = 0; }
            hasMore = d.has_more;
            renderAll();
        } catch (e) {
            document.getElementById('feed-area').innerHTML =
                '<div class="feed-note">Fetch failed: ' + escapeHtml(e.message) + '</div>';
        }
    }

    function renderAll() {
        renderTitle(); renderState(); renderPins(); renderFeed(); renderConfig(); renderTabs();
    }

    function renderTitle() {
        const n = lastData ? lastData.unread_count : 0;
        document.title = n ? ('tjai Capcom (' + n + ')') : 'tjai Capcom';
        document.getElementById('unread-chip').textContent = n ? (n + ' unread') : '';
    }

    function renderTabs() {
        document.querySelectorAll('.view-tab').forEach(t => {
            t.classList.toggle('active', t.dataset.view === view);
        });
        document.getElementById('feed-area').style.display = view === 'feed' ? '' : 'none';
        document.getElementById('feed-controls').style.display = view === 'feed' ? '' : 'none';
        document.getElementById('config-area').style.display = view === 'config' ? '' : 'none';
        document.getElementById('notepad-area').style.display = view === 'notepad' ? '' : 'none';
        document.getElementById('notepad-section').classList.toggle('active', view === 'notepad');
        document.querySelectorAll('#notepad-section .pad-link').forEach(el => {
            el.classList.toggle('active-pad',
                view === 'notepad' && padSel === el.dataset.pad);
        });
        if (view === 'notepad') {
            const frame = document.getElementById('notepad-frame');
            const want = frame.dataset.src + (padSel ? '?pad=' + padSel : '');
            if (!frame.dataset.loaded) {
                frame.src = want;
                frame.dataset.loaded = '1';
                frame.dataset.padUrl = want;
            } else if (padSel && frame.dataset.padUrl !== want) {
                flushNotepad();
                frame.src = want;
                frame.dataset.padUrl = want;
            } else {
                frame.contentWindow.postMessage(
                    {type: 'tjai-capcom-notepad-focus'}, location.origin
                );
            }
        }
    }

    function flushNotepad() {
        const frame = document.getElementById('notepad-frame');
        if (frame && frame.contentWindow) {
            frame.contentWindow.postMessage({type: 'tjai-capcom-notepad-flush'}, location.origin);
        }
    }

    // The pad page reports which pad it is showing (the server chooses on a
    // bare load, and in-page tab links navigate inside the iframe); mirror
    // that into padSel, the URL, and the left-panel highlight.
    document.getElementById('notepad-frame').addEventListener('load', function() {
        this.contentWindow.postMessage({type: 'tjai-capcom-notepad-focus'}, location.origin);
    });
    window.addEventListener('message', function(event) {
        if (event.origin !== location.origin) return;
        if (!event.data || event.data.type !== 'tjai-capcom-pad') return;
        const frame = document.getElementById('notepad-frame');
        frame.dataset.padUrl = frame.dataset.src + '?pad=' + event.data.pad;
        if (padSel !== event.data.pad) {
            padSel = event.data.pad;
            syncStateToUrl();
        }
        document.querySelectorAll('#notepad-section .pad-link').forEach(el => {
            el.classList.toggle('active-pad',
                view === 'notepad' && padSel === el.dataset.pad);
        });
    });

    function stateAgo(epoch) {
        if (!epoch) return '';
        const s = Math.max(0, Math.floor(Date.now() / 1000 - epoch));
        if (s < 60) return s + 's';
        if (s < 3600) return Math.floor(s / 60) + 'm';
        if (s < 86400) return Math.floor(s / 3600) + 'h';
        return Math.floor(s / 86400) + 'd';
    }

    function corunAgeClass(source, epoch) {
        if (source !== 'corun-ai' || !epoch) return '';
        const age = Math.max(0, Date.now() / 1000 - epoch);
        if (age < 6 * 3600) return ' fresh';
        if (age < 24 * 3600) return ' recent';
        return '';
    }

    function meetingCountdown(epoch) {
        const seconds = Math.max(0, Math.floor(epoch - Date.now() / 1000));
        if (seconds >= 86400) {
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            return days + 'd' + (hours ? ' ' + hours + 'h' : '');
        }
        if (seconds >= 36000) return Math.floor(seconds / 3600) + 'h';
        if (seconds >= 3600) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return hours + 'h' + (minutes ? ' ' + minutes + 'm' : '');
        }
        if (seconds >= 60) return Math.floor(seconds / 60) + 'm';
        return '<1m';
    }

    function renderState() {
        if (stateDragging) return;
        const el = document.getElementById('state-tiles');
        const st = (lastData && lastData.state) || {};
        const saved = Array.isArray(lastData && lastData.state_order)
            ? lastData.state_order : [];
        const allKeys = Object.keys(st);
        const known = new Set(allKeys);
        const savedSet = new Set();
        const savedKnown = saved.filter(k => {
            if (!known.has(k) || savedSet.has(k)) return false;
            savedSet.add(k);
            return true;
        });
        const keys = savedKnown.concat(allKeys.filter(k => !savedSet.has(k)).sort());
        stateOrder = keys;
        const stateHtml = keys.map(k => {
            const s = st[k];
            const color = ['green', 'yellow', 'red'].includes(s.color) ? s.color : '';
            const tag = s.url ? 'a' : 'div';
            const href = s.url ? ' href="' + escapeHtml(s.url) +
                '" target="_blank" rel="noopener"' : '';
            const menu = '<button type="button" class="state-menu-btn" data-state-menu="' +
                escapeHtml(k) + '" aria-label="Actions for ' + escapeHtml(k) +
                '">&#8942;</button><div class="state-popover" hidden>' +
                '<button type="button" data-state-update="' + escapeHtml(k) +
                '">update</button></div>';
            return '<div class="tile ' + color + '" data-state-key="' + escapeHtml(k) +
                   '"><' + tag + ' class="tile-main"' + href +
                   '><span class="t-source">' + escapeHtml(k) +
                   '</span><span class="t-reading"><span class="t-value">' +
                   escapeHtml(String(s.value)) +
                   '</span><span class="t-ago' + corunAgeClass(k, s.updated) + '">' +
                   stateAgo(s.updated) +
                   '</span></span></' + tag + '>' + menu + '</div>';
        }).join('');
        const meeting = lastData && lastData.next_meeting;
        const meetingHtml = meeting
            ? '<div class="tile meeting-tile"><div class="tile-main">' +
              '<a class="t-source" href="' + escapeHtml(meeting.edit_url) +
              '" target="_blank" rel="noopener">meeting</a>' +
              '<span class="t-reading"><span class="t-value"><a class="meeting-time" href="' +
              escapeHtml(meeting.edit_url) + '" target="_blank" rel="noopener">' +
              escapeHtml(meeting.time_display) + '</a> · ' +
              linkifyContent(escapeHtml(meeting.title)) +
              '</span><span class="t-ago">' + meetingCountdown(meeting.event_date) +
              '</span></span></div></div>'
            : '';
        el.innerHTML = stateHtml + meetingHtml ||
            '<div class="feed-note">No state reports yet.</div>';
    }

    function closeStateMenus(except) {
        document.querySelectorAll('.state-popover').forEach(menu => {
            if (menu !== except) menu.hidden = true;
        });
    }

    async function saveStateOrder() {
        try {
            await fetchJson('/tjai/api/command', {
                method: 'POST',
                body: JSON.stringify({command: 'set_sysconfig', key: 'capcom_state_order',
                                      value: JSON.stringify(stateOrder)}),
            });
        } catch (e) { flashNotice('State order save failed: ' + e.message, '#ef5350'); }
    }

    function pinRow(p, inTop) {
        if (p.special === 'diary') {
            const sep = '<span class="pin-sep"> · </span>';
            return '<div class="pin special"><span>' + escapeHtml(p.title) + '</span>' +
                   sep + '<a href="/tjai/diary/" data-diary-date="' +
                   escapeHtml(p.date) + '" target="_blank" rel="noopener">Diary</a>' +
                   sep + '<a href="' + escapeHtml(p.synopsis_url) +
                   '" target="_blank" rel="noopener">Synopsis</a>' +
                   sep + '<a href="' + escapeHtml(p.ideation_url) +
                   '" target="_blank" rel="noopener">Ideation</a></div>';
        }
        const action = inTop
            ? '<button type="button" data-untop="' + p.id + '">unpin from top</button>'
            : '<button type="button" data-totop="' + p.id + '">pin to top</button>';
        const edit = p.is_bookmark
            ? '<button type="button" data-pin-edit="' + escapeHtml(p.edit_url) +
              '">edit</button>' : '';
        const unpin = '<button type="button" data-unpin="' + p.id + '">unpin</button>';
        const menu = '<button type="button" class="state-menu-btn" data-pin-menu="' + p.id +
                     '" aria-label="Actions for ' + escapeHtml(p.title) + '">&#8942;</button>' +
                     '<div class="state-popover" hidden>' + action + unpin + edit + '</div>';
        return '<div class="pin" data-id="' + p.id + '"><a href="' + escapeHtml(p.url) +
               '" target="_blank" rel="noopener">' + escapeHtml(p.title) + '</a>' + menu + '</div>';
    }

    function renderPins() {
        if (pinDragging) return;
        const pins = (lastData && lastData.pins) || {top: [], rest: []};
        const diary = lastData && lastData.diary_pin;
        document.getElementById('pins-special').innerHTML = diary
            ? pinRow({special: 'diary', ...diary}, true) : '';
        const topEl = document.getElementById('pins-top');
        const restEl = document.getElementById('pins-rest');
        topEl.innerHTML = pins.top.map(p => pinRow(p, true)).join('');
        restEl.innerHTML = pins.rest.length
            ? pins.rest.map(p => pinRow(p, false)).join('')
            : '';
        document.getElementById('pins-divider').style.display =
            (pins.top.length && pins.rest.length) ? '' : 'none';
        pinOrder = Array.from(new Set(pins.top.map(p => p.id)));
    }

    const expandedIds = new Set();

    function expandable(n) { return !!(n.detail || n.count > 1); }

    function detailBlock(n) {
        return '<div class="notice-detail" data-collapse="' + n.id + '">' +
               (n.count > 1 ? '<div class="d-meta">first ' + escapeHtml(n.first_display) +
                    ' &middot; latest ' + escapeHtml(n.time_display) +
                    ' &middot; &times;' + n.count + '</div>' : '') +
               (n.detail ? '<div class="d-text">' + escapeHtml(n.detail) + '</div>' : '') +
               '</div>';
    }

    function renderFeed() {
        const el = document.getElementById('feed-area');
        if (!notices.length) {
            el.innerHTML = '<div class="feed-note">No notices.</div>';
            return;
        }
        el.innerHTML = notices.map((n, i) =>
            '<div class="notice' + (n.was_read ? ' read' : '') + (i === selIdx ? ' selected' : '') +
            '" data-idx="' + i + '">' +
            '<span class="n-time">' + escapeHtml(n.ago) + '</span>' +
            '<span class="n-dot ' + escapeHtml(n.severity) + '">&#9679;</span>' +
            '<span class="n-source" data-source="' + escapeHtml(n.source) + '">' + escapeHtml(n.source) + '</span>' +
            '<span class="n-title">' +
            (n.url ? '<a href="' + escapeHtml(n.url) + '" target="_blank" rel="noopener">' + escapeHtml(n.title) + '</a>'
                   : escapeHtml(n.title)) +
            '</span>' +
            (n.count > 1 ? '<span class="n-count">&times;' + n.count + '</span>' : '') +
            '<button class="n-mark" data-mark="' + n.id + '" title="' +
                (n.was_read ? 'Mark as unread' : 'Mark as read') + '">' +
                (n.was_read ? 'Mark as unread' : 'Mark as read') + '</button>' +
            '<span class="n-spacer"></span>' +
            '</div>' +
            (expandable(n) && expandedIds.has(n.id) ? detailBlock(n) : '')
        ).join('') +
        (hasMore ? '<button class="hdr-btn" id="load-more">Load more</button>' : '');
    }

    async function mark(ids, action) {
        try {
            await fetchJson('/tjai/api/capcom/mark', {
                method: 'POST',
                body: JSON.stringify(ids === 'all' ? {all: true, action: action} : {ids: ids, action: action}),
            });
            await fetchData();
        } catch (e) { flashNotice('Mark failed: ' + e.message, '#ef5350'); }
    }

    async function savePinOrder() {
        pinOrder = Array.from(new Set(pinOrder));
        try {
            await fetchJson('/tjai/api/command', {
                method: 'POST',
                body: JSON.stringify({command: 'set_sysconfig', key: 'capcom_pin_order',
                                      value: JSON.stringify(pinOrder)}),
            });
            await fetchData();
        } catch (e) { flashNotice('Pin order save failed: ' + e.message, '#ef5350'); }
    }

    function cfgRow(s, i, withCounts) {
        return '<tr data-i="' + i + '" data-kind="' + escapeHtml(s.kind || 'feed') +
            '" data-cadence="' + (s.cadence || 10) + '" data-lastrun="' + (s.last_run || 0) +
            '" data-collector="' + escapeHtml(s.collector || '') + '">' +
            '<td><input type="checkbox" class="src-enabled"' + (s.enabled ? ' checked' : '') + '></td>' +
            '<td><input type="text" class="src-name" value="' + escapeHtml(s.source || '') + '"></td>' +
            '<td><select class="src-mode">' +
                ['listen', 'poll', 'missing'].map(m =>
                    '<option' + (s.mode === m ? ' selected' : '') + '>' + m + '</option>').join('') +
            '</select></td>' +
            '<td>' + (s.mode === 'poll'
                ? '<input type="number" class="src-cadence" step="10" min="10" value="' + (s.cadence || 10) + '">'
                : '') + '</td>' +
            '<td class="cfg-last">' + (s.last_run ? stateAgo(s.last_run) + ' ago' : '—') + '</td>' +
            (withCounts ? '<td class="cfg-last">' + ((lastData.counts_24h || {})[s.source] || 0) + '</td>' : '') +
            '<td><input type="text" class="src-note" value="' + escapeHtml(s.note || '') + '"></td>' +
            '<td><button class="cfg-row-btn cfg-del">delete</button></td>' +
            '</tr>';
    }

    function cfgTable(pairs, withCounts) {
        return '<table class="cfg-table"><tr><th>on</th><th>source</th><th>mode</th>' +
            '<th>cadence</th><th>last run</th>' + (withCounts ? '<th>24h</th>' : '') +
            '<th>note</th><th></th></tr>' +
            pairs.map(([s, i]) => cfgRow(s, i, withCounts)).join('') + '</table>';
    }

    function renderConfig() {
        const el = document.getElementById('config-area');
        if (view !== 'config' || !lastData) return;
        const sources = lastData.sources || [];
        const feed = [], state = [];
        sources.forEach((s, i) => ((s.kind === 'state') ? state : feed).push([s, i]));
        el.innerHTML =
            '<section class="cfg-section feed">' +
            '<div class="cfg-section-title">Feed sources</div>' +
            cfgTable(feed, true) +
            '<div class="cfg-actions"><button class="cfg-row-btn" id="cfg-add-feed">Add feed source</button></div>' +
            '</section>' +
            '<section class="cfg-section state">' +
            '<div class="cfg-section-title">State sources</div>' +
            cfgTable(state, false) +
            '<div class="cfg-actions"><button class="cfg-row-btn" id="cfg-add-state">Add state source</button></div>' +
            '</section>';
    }

    function collectConfig() {
        const out = [];
        document.querySelectorAll('#config-area tr[data-i]').forEach(tr => {
            const name = tr.querySelector('.src-name').value.trim();
            if (!name) return;
            const cadenceInput = tr.querySelector('.src-cadence');
            const row = {
                source: name,
                kind: tr.dataset.kind || 'feed',
                mode: tr.querySelector('.src-mode').value,
                cadence: cadenceInput ? (Number(cadenceInput.value) || 10)
                                      : (Number(tr.dataset.cadence) || 10),
                enabled: tr.querySelector('.src-enabled').checked,
                last_run: Number(tr.dataset.lastrun) || 0,
                note: tr.querySelector('.src-note').value.trim(),
            };
            if (tr.dataset.collector) row.collector = tr.dataset.collector;
            out.push(row);
        });
        return out;
    }

    async function setSysconfig(key, value, okMsg) {
        try {
            await fetchJson('/tjai/api/command', {
                method: 'POST',
                body: JSON.stringify({command: 'set_sysconfig', key: key, value: value}),
            });
            flashNotice(okMsg, '#9ccc65');
            await fetchData();
        } catch (e) { flashNotice('Save failed: ' + e.message, '#ef5350'); }
    }

    function saveConfig(sources) {
        const value = JSON.stringify(sources);
        configSaveQueue = configSaveQueue.then(() => fetchJson('/tjai/api/command', {
            method: 'POST',
            body: JSON.stringify({command: 'set_sysconfig', key: 'capcom_sources', value: value}),
        })).catch(e => { flashNotice('Config save failed: ' + e.message, '#ef5350'); });
    }

    document.addEventListener('click', async (ev) => {
        const t = ev.target;
        const menuButton = t.closest('[data-state-menu], [data-pin-menu]');
        if (menuButton) {
            const menu = menuButton.parentElement.querySelector('.state-popover');
            const open = menu.hidden;
            closeStateMenus(menu);
            menu.hidden = !open;
            return;
        }
        const stateUpdate = t.closest('[data-state-update]');
        if (stateUpdate) {
            const source = stateUpdate.dataset.stateUpdate;
            closeStateMenus();
            try {
                const d = await fetchJson('/tjai/api/capcom/run', {
                    method: 'POST', body: JSON.stringify({source: source}),
                });
                const message = d.warning
                    ? 'Triggered; ' + d.warning
                    : (d.message || ('Update triggered: ' + source));
                flashNotice(message, (d.noop || d.warning) ? '#ffd54f' : '#9ccc65');
            } catch (e) { flashNotice('Update failed: ' + e.message, '#ef5350'); }
            return;
        }
        if (!t.closest('.state-popover')) closeStateMenus();
        const diaryLink = t.closest('[data-diary-date]');
        if (diaryLink) {
            ev.preventDefault();
            const diaryTab = window.open('about:blank', '_blank');
            if (diaryTab) diaryTab.opener = null;
            try {
                const d = await fetchJson('/tjai/api/diary/today?date=' +
                    encodeURIComponent(diaryLink.dataset.diaryDate), {
                        method: 'POST', body: '{}',
                    });
                if (!d.entry_id) throw new Error('Diary entry was not returned');
                const diaryUrl = '/tjai/entry/?entry_id=' +
                    encodeURIComponent(d.entry_id) + '&edit=1';
                if (diaryTab) diaryTab.location.replace(diaryUrl);
            } catch (e) {
                if (diaryTab) diaryTab.close();
                flashNotice('Diary open failed: ' + e.message, '#ef5350');
            }
            return;
        }
        if (t.classList.contains('pad-link')) {
            if (view === 'notepad' && padSel !== t.dataset.pad) flushNotepad();
            padSel = t.dataset.pad;
            view = 'notepad'; syncStateToUrl(); renderAll(); return;
        }
        if (t.classList.contains('view-tab') || t.id === 'notepad-section') {
            if (view === 'notepad' && t.dataset.view !== 'notepad') flushNotepad();
            view = t.dataset.view; syncStateToUrl(); renderAll(); return;
        }
        if (t.id === 'mark-all') { mark('all', 'read'); return; }
        if (t.id === 'update-now') {
            try {
                const d = await fetchJson('/tjai/api/capcom/run', {method: 'POST', body: '{}'});
                flashNotice(d.warning ? ('Triggered; ' + d.warning) : 'Update triggered', '#9ccc65');
            } catch (e) { flashNotice('Update failed: ' + e.message, '#ef5350'); }
            return;
        }
        if (t.id === 'load-more') { offset += 100; fetchData(true); return; }
        if (t.id === 'cfg-add-feed' || t.id === 'cfg-add-state') {
            lastData.sources = collectConfig();
            lastData.sources.push({source: '', kind: t.id === 'cfg-add-state' ? 'state' : 'feed',
                                   mode: 'poll', cadence: 10, enabled: false, note: ''});
            renderConfig(); return;
        }
        if (t.classList.contains('cfg-del')) {
            const tr = t.closest('tr');
            const name = tr.querySelector('.src-name').value.trim();
            if (name && !confirm('Delete source "' + name + '"?')) return;
            tr.remove();
            const sources = collectConfig();
            lastData.sources = sources;
            renderConfig();
            saveConfig(sources);
            return;
        }
        if (t.dataset.totop) {
            closeStateMenus();
            if (!pinOrder.includes(t.dataset.totop)) pinOrder.push(t.dataset.totop);
            savePinOrder();
            return;
        }
        if (t.dataset.untop) {
            closeStateMenus();
            pinOrder = pinOrder.filter(id => id !== t.dataset.untop); savePinOrder(); return;
        }
        if (t.dataset.pinEdit) {
            closeStateMenus();
            window.open(t.dataset.pinEdit, '_blank', 'noopener');
            return;
        }
        if (t.dataset.unpin) {
            const entryId = t.dataset.unpin;
            closeStateMenus();
            try {
                await fetchJson('/tjai/api/capcom/pin', {
                    method: 'POST',
                    body: JSON.stringify({entry_id: entryId, action: 'unpin'}),
                });
                pinOrder = pinOrder.filter(id => id !== entryId);
                await fetchData();
            } catch (e) { flashNotice('Unpin failed: ' + e.message, '#ef5350'); }
            return;
        }
        if (t.classList.contains('n-source')) {
            filterSource = (filterSource === t.dataset.source) ? '' : t.dataset.source;
            syncStateToUrl(); fetchData(); return;
        }
        if (t.dataset.mark) {
            ev.stopPropagation();
            const n = notices.find(x => x.id === Number(t.dataset.mark));
            if (n) mark([n.id], n.was_read ? 'unread' : 'read');
            return;
        }
        const det = t.closest('.notice-detail');
        if (det) { expandedIds.delete(Number(det.dataset.collapse)); renderFeed(); return; }
        const row = t.closest('.notice');
        if (row && !t.closest('a')) {
            const n = notices[Number(row.dataset.idx)];
            if (!n) return;
            if (expandable(n)) {
                if (expandedIds.has(n.id)) expandedIds.delete(n.id);
                else expandedIds.add(n.id);
            }
            if (!n.was_read) mark([n.id], 'read'); else renderFeed();
            return;
        }
        if (t.closest('a') && t.closest('.notice')) {
            const n = notices[Number(t.closest('.notice').dataset.idx)];
            if (n && !n.was_read) mark([n.id], 'read');
        }
    });

    document.getElementById('unread-only').addEventListener('change', (ev) => {
        unreadOnly = ev.target.checked; syncStateToUrl(); fetchData();
    });
    document.addEventListener('change', (ev) => {
        if (ev.target.closest('#config-area') &&
            ev.target.matches('.src-enabled, .src-name, .src-mode, .src-cadence, .src-note')) {
            const sources = collectConfig();
            lastData.sources = sources;
            if (ev.target.classList.contains('src-mode')) renderConfig();
            saveConfig(sources);
        }
    });
    document.addEventListener('keydown', (ev) => {
        if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
        if (view !== 'feed') return;
        if (ev.key === 'j' || ev.key === 'k') {
            selIdx = ev.key === 'j' ? Math.min(selIdx + 1, notices.length - 1) : Math.max(selIdx - 1, 0);
            renderFeed();
            const el = document.querySelector('.notice.selected');
            if (el) el.scrollIntoView({block: 'nearest'});
        } else if (ev.key === 'Enter' && selIdx >= 0 && notices[selIdx]) {
            const n = notices[selIdx];
            if (!n.was_read) mark([n.id], 'read');
            if (n.url) window.open(n.url, '_blank', 'noopener');
        }
    });

    new Sortable(document.getElementById('pins-top'), {
        animation: 120,
        filter: '.state-menu-btn, .state-popover, .state-popover *',
        preventOnFilter: false,
        onStart: () => { pinDragging = true; },
        onEnd: () => {
            pinDragging = false;
            pinOrder = Array.from(new Set(
                Array.from(document.querySelectorAll('#pins-top .pin'))
                    .map(el => el.dataset.id)
            ));
            savePinOrder();
        },
    });

    new Sortable(document.getElementById('state-tiles'), {
        animation: 120,
        draggable: '.tile:not(.meeting-tile)',
        filter: '.state-menu-btn, .state-popover, .state-popover *',
        preventOnFilter: false,
        onStart: () => {
            stateDragging = true;
            closeStateMenus();
        },
        onEnd: () => {
            stateDragging = false;
            stateOrder = Array.from(new Set(
                Array.from(document.querySelectorAll('#state-tiles .tile[data-state-key]'))
                    .map(el => el.dataset.stateKey)
            ));
            if (lastData) lastData.state_order = stateOrder;
            requestAnimationFrame(renderState);
            saveStateOrder();
        },
    });

    loadStateFromUrl();
    document.getElementById('unread-only').checked = unreadOnly;
    renderTabs();
    fetchData();
    setInterval(() => { if (view === 'feed') fetchData(); }, 20000);
    window.addEventListener('blur', flushNotepad);
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') flushNotepad();
    });
    window.addEventListener('pagehide', flushNotepad);
    </script>
</body>
</html>

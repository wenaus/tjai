<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/tjai/static/tjai/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tjai Research</title>
    <link rel="stylesheet" href="/tjai/static/tjai/menu.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .research-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 24px;
            background: #222;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            font-size: 12px;
        }
        .research-header a { color: #90caf9; text-decoration: none; }
        .research-header a:hover { text-decoration: underline; }
        .research-header .stats { color: #8a8a8a; font-size: 11px; margin-left: auto; }
        .agent-banner {
            padding: 8px 24px;
            font-size: 12px;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .agent-idle { background: #222; color: #8a8a8a; }
        .agent-running { background: rgba(255, 213, 79, 0.1); color: #ffd54f; }
        .agent-failed { background: rgba(239, 83, 80, 0.1); color: #ef5350; }
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px 40px;
        }
        .research-item {
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 3px solid #333;
            background: #222;
            border-radius: 0 3px 3px 0;
        }
        .research-item.done { border-left-color: #4caf50; }
        .research-item.pending { border-left-color: #90caf9; }
        .item-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 4px;
        }
        .item-eid {
            color: #d8a070;
            font-size: 12px;
            font-weight: bold;
        }
        .item-eid a { color: #d8a070; text-decoration: none; }
        .item-eid a:hover { text-decoration: underline; }
        .item-status {
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 3px;
        }
        .status-pending { background: #1a3a5c; color: #90caf9; }
        .status-active { background: rgba(255, 213, 79, 0.15); color: #ffd54f; }
        .status-running { background: rgba(255, 213, 79, 0.15); color: #ffd54f; }
        .status-staged { background: rgba(144, 202, 249, 0.15); color: #90caf9; }
        .status-done { background: #1a3c1a; color: #4caf50; }
        .status-blocked, .status-failed { background: rgba(239, 83, 80, 0.15); color: #ef5350; }
        .research-item.active { border-left-color: #ffd54f; }
        .research-item.running { border-left-color: #ffd54f; }
        .research-item.staged { border-left-color: #90caf9; }
        .research-item.blocked, .research-item.failed { border-left-color: #ef5350; }
        .item-content {
            color: #bbb;
            font-size: 12px;
            line-height: 1.5;
        }
        .item-meta {
            color: #999;
            font-size: 11px;
            margin-top: 4px;
        }
        .btn-submit {
            background: #333;
            color: #90caf9;
            border: 1px solid #90caf9;
            padding: 2px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            white-space: nowrap;
        }
        .btn-submit:hover { background: #1a3a5c; }
        .btn-submit:disabled {
            color: #555;
            border-color: #444;
            cursor: default;
            background: #2a2a2a;
        }
        .activity-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .dot-active { background: #4caf50; animation: pulse 1.5s ease-in-out infinite; }
        .dot-idle { background: #ff9800; }
        .dot-stale { background: #ef5350; }
        .dot-off { background: #555; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .error-section {
            padding: 6px 24px;
            font-size: 11px;
            background: rgba(239, 83, 80, 0.08);
            color: #ef5350;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .error-section:empty { display: none; }
        .loading { color: #8a8a8a; padding: 20px; }
        .error { color: #ef5350; padding: 20px; }
        .empty { color: #8a8a8a; padding: 40px; text-align: center; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        * { scrollbar-width: thin; scrollbar-color: #444 #1a1a1a; }
    </style>
</head>
<body>
    {% with current_page="research" %}{% include "tjai_app/_menu.html" %}{% endwith %}
    <div class="research-header">
        <span id="ideation-prompt-link"></span>
        <span id="sysprompt-link"></span>
        <a href="#" onclick="event.preventDefault();createResearchTopic()">New Topic</a>
        <span class="stats" id="stats"></span>
    </div>
    <div class="agent-banner agent-idle" id="agent-banner">Agent: loading...</div>
    <div class="error-section" id="error-section"></div>
    <div class="content-area" id="content">
        <div class="loading">Loading research queue...</div>
    </div>

    <script>
        function esc(s) {
            if (!s) return '';
            const el = document.createElement('span');
            el.textContent = s;
            return el.innerHTML;
        }

        // timeAgo, fmtDate removed — server provides _ago and _display fields

        function entryUrl(uuid, entryId) {
            if (entryId) return '/tjai/entry/?entry_id=' + encodeURIComponent(entryId);
            return '/tjai/entry/?uuid=' + uuid;
        }

        async function createResearchTopic() {
            try {
                const resp = await fetch('/tjai/api/entry/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                    body: JSON.stringify({
                        content: 'Research topic title\n\nDescribe the territory to explore here.',
                        kind: 'memory',
                        context: 'tjai',
                        tags: ['research_topic'],
                        data: {entry_id: 'research-', source: 'manual'},
                    }),
                });
                const data = await resp.json();
                if (data.id) window.location.href = '/tjai/entry/?uuid=' + data.id + '&edit=1';
            } catch (e) { alert('Failed: ' + e.message); }
        }

        let agentRunning = false;
        // Pending model-checkbox selections, keyed by `${entry_id}::${model}`.
        // Survives the 10-second fetchData re-render — without this, ticking
        // a checkbox and waiting >10s wipes the selection.
        const pendingChecks = new Set();
        function togglePending(entryId, model, el) {
            const k = entryId + '::' + model;
            if (el.checked) pendingChecks.add(k);
            else pendingChecks.delete(k);
        }

        async function fetchData() {
            try {
                const resp = await fetch('/tjai/api/research/data');
                const data = await resp.json();
                if (data.error) {
                    document.getElementById('content').innerHTML =
                        `<div class="error">${esc(data.error)}</div>`;
                    return;
                }
                agentRunning = (data.agent || {}).status === 'running';
                render(data);
            } catch (e) {
                document.getElementById('content').innerHTML =
                    '<div class="error">Error loading research data</div>';
            }
        }

        function render(data) {
            // Ideation prompt link
            const ipEl = document.getElementById('ideation-prompt-link');
            if (data.ideation_prompt_id) {
                ipEl.innerHTML = `<a href="${entryUrl(data.ideation_prompt_id, 'ideation-agent')}">Ideation Prompt</a>`;
            }

            // Sysprompt link
            const spEl = document.getElementById('sysprompt-link');
            if (data.sysprompt_id) {
                spEl.innerHTML = `<a href="${entryUrl(data.sysprompt_id, 'research-system-prompt-v2')}">Research Prompt</a>`;
            } else {
                spEl.innerHTML = '<span style="color:#666">No research prompt</span>';
            }

            // Banner: three named, non-overlapping facts. Nothing here is
            // allowed to read as contradictory because each line names its
            // own subject ("Local orchestrator", "Remote workers", "Topics in flight")
            // and the subjects do not overlap.
            const items = data.items || [];
            const agent = data.agent || {};
            const workers = data.workers || [];
            const systemBusy = !!data.system_busy;
            const banner = document.getElementById('agent-banner');
            const errorDiv = document.getElementById('error-section');
            const activeItems = items.filter(i =>
                (i.status === 'active' || i.status === 'staged') &&
                i.source !== 'multimodel');
            const agentRunning_ = agent.status === 'running';

            // Activity dot reflects the SYSTEM, not just the local orchestrator.
            //   green pulse = something is actively working (local or remote)
            //   red         = something is wrong: a worker is disconnected with
            //                 staged work, or a zombie claim is held
            //   orange      = staged work waiting for a worker to claim it
            //   grey        = nothing in flight
            const stagedWaiting = items.some(i =>
                (data.models || []).some(m => i[m + '_status'] === 'staged'));
            const anyDisconnected = workers.some(w => w.state === 'disconnected');
            const anyZombie = workers.some(w => w.state === 'zombie');
            let dotClass = 'dot-off';
            if (systemBusy) dotClass = 'dot-active';
            else if (anyZombie || (anyDisconnected && stagedWaiting)) dotClass = 'dot-stale';
            else if (stagedWaiting) dotClass = 'dot-idle';

            // Per-model state lookup so the topic-level phase rendering can
            // mark "gemma in-progress" as bogus when the machine holding
            // the claim is a zombie. Derived from the per-machine workers
            // list: a model M is marked busy/zombie if any machine
            // advertising a cap starting with M is in that state.
            const capStateByModel = {};
            for (const w of workers) {
                for (const cap of (w.caps || [])) {
                    for (const m of (data.models || [])) {
                        if (cap.startsWith(m)) {
                            // Prefer "busy" over "idle" if multiple workers
                            // advertise the same cap family — the model is
                            // whatever any of them is actively doing.
                            const prior = capStateByModel[m];
                            if (!prior || (prior === 'idle' && w.state !== 'idle')) {
                                capStateByModel[m] = w.state;
                            }
                        }
                    }
                }
            }

            const lines = [];

            // --- Fact 1: Local orchestrator (the research-agent process) ---
            let localLine = '';
            if (agentRunning_) {
                const dur = agent.launched_dur ? ' for ' + agent.launched_dur : '';
                const currentItem = items.find(i => i.id === agent.current_entry);
                const entryName = currentItem
                    ? (currentItem.entry_id || currentItem.id.substring(0, 8))
                    : (agent.current_entry || '?').substring(0, 8);
                const logLink = agent.current_entry
                    ? ` <a href="/tjai/agent-log?ref=${agent.current_entry}" style="color:#ffd54f">log</a>`
                    : '';
                const procInfo = agent.process_alive === '0'
                    ? ' · <span style="color:#ef5350">no process</span>' : '';
                const activityInfo = agent.last_activity
                    ? ` · activity ${agent.last_activity_ago}` : '';
                const entryDone = currentItem && currentItem.status === 'done';
                if (entryDone) {
                    localLine = `<strong>Local orchestrator:</strong> running on ${esc(entryName)} (entry already done)${dur}${activityInfo}${procInfo} <button class="btn-submit" style="color:#ef5350;border-color:#ef5350;margin-left:8px" onclick="abortAgent(this)">Abort</button>${logLink}`;
                } else {
                    localLine = `<strong>Local orchestrator:</strong> running on ${esc(entryName)}${dur}${activityInfo}${procInfo}${logLink}`;
                }
            } else if (agent.status === 'failed') {
                const errTime = agent.last_error_time_ago ? ' ' + agent.last_error_time_ago : '';
                localLine = `<strong>Local orchestrator:</strong> <span style="color:#ef5350">failed${errTime}</span>`;
            } else {
                const lastDone = agent.completed_ago ? ` — last run completed ${agent.completed_ago}` : '';
                localLine = `<strong>Local orchestrator:</strong> ready${lastDone}`;
            }
            lines.push(localLine);

            // --- Fact 2: Remote workers (one entry per MACHINE) ---
            // Aliveness is a property of the machine, not of the cap it
            // advertises. A machine holds ONE state — busy / ready /
            // zombie / disconnected — and that state covers every cap
            // the machine advertises. Per-cap display contradictions
            // (cap A busy, cap B disconnected on the same machine) are
            // impossible by construction under this shape.
            if (workers.length > 0) {
                const wbits = [];
                for (const w of workers) {
                    const mid = (w.machine_id || '').substring(0,8);
                    const capList = (w.caps || []).join(', ');
                    const caps = capList ? ` [${esc(capList)}]` : '';
                    let phrase;
                    let color;
                    if (w.state === 'busy') {
                        color = '#ffd54f';
                        let target = '';
                        if (w.busy_on_entry) {
                            target = ` on ${esc(w.busy_on_entry)}`;
                        } else if (w.busy_on_label) {
                            target = ` on ${esc(w.busy_on_label)}`;
                        } else if (w.busy_on_source) {
                            target = ` on ${esc(w.busy_on_source)}`;
                        }
                        const capTag = w.busy_on_cap ? ` (${esc(w.busy_on_cap)})` : '';
                        const since = w.busy_since_ago ? ` claimed ${w.busy_since_ago}` : '';
                        phrase = `busy${target}${capTag}${since}`;
                    } else if (w.state === 'zombie') {
                        color = '#ef5350';
                        const target = w.busy_on_entry ? ` on ${esc(w.busy_on_entry)}` : '';
                        const capTag = w.busy_on_cap ? ` (${esc(w.busy_on_cap)})` : '';
                        const since = w.busy_since_ago ? `, claimed ${w.busy_since_ago}` : '';
                        const lastPoll = w.last_poll_ago ? `, last poll ${w.last_poll_ago}` : '';
                        phrase = `zombie claim${target}${capTag}${since}${lastPoll} — auto-reclaim within 2h`;
                    } else if (w.state === 'idle') {
                        color = '#9ccc65';
                        const lastPoll = w.last_poll_ago ? ` (last poll ${w.last_poll_ago})` : '';
                        phrase = `ready${lastPoll}`;
                    } else if (w.state === 'disconnected') {
                        color = '#ef5350';
                        const lastPoll = w.last_poll_ago ? ` (last poll ${w.last_poll_ago})` : '';
                        phrase = `disconnected${lastPoll}`;
                    } else {
                        color = '#888';
                        phrase = 'unknown';
                    }
                    wbits.push(
                        `<div style="padding-left:14px">• <span style="color:#b0bec5">${esc(mid)}</span>${caps} <span style="color:${color}">${phrase}</span></div>`
                    );
                }
                lines.push(`<strong>Remote workers (${workers.length}):</strong>${wbits.join('')}`);
            }

            // --- Fact 3: Topics with work in flight (active or staged) ---
            // Per-model phases use server-formatted ago strings (no client-clock math).
            if (activeItems.length > 0) {
                const tbits = [];
                for (const it of activeItems) {
                    const name = it.entry_id || it.id.substring(0, 8);
                    const url = entryUrl(it.id, it.entry_id);
                    const workersByModel = {};
                    for (const w of (it.workers || [])) {
                        if (w.model) workersByModel[w.model] = w;
                    }
                    const phaseBits = [];
                    for (const m of (data.models || [])) {
                        const st = it[m + '_status'];
                        if (!st) continue;
                        const w = workersByModel[m];
                        let phrase = '';
                        let clr = '#b0bec5';
                        if (st === 'done') { phrase = `${m} done`; clr = '#9ccc65'; }
                        else if (st === 'blocked' || st === 'failed') { phrase = `${m} failed`; clr = '#ef5350'; }
                        else if (st === 'active' && w && w.worker_claimed_ago) {
                            const mid = (w.worker_claimed_by || '').substring(0,8);
                            // If the worker holding this claim is a zombie at
                            // the cap level, surface that — the "in-progress"
                            // is a stale leftover, not real work.
                            if (capStateByModel[m] === 'zombie') {
                                phrase = `${m} stale claim by ${mid} (${w.worker_claimed_ago})`;
                                clr = '#ef5350';
                            } else {
                                phrase = `${m} in-progress on ${mid} (${w.worker_claimed_ago})`;
                                clr = '#ffd54f';
                            }
                        }
                        else if (st === 'active') {
                            const ago = it[m + '_started_at_ago'];
                            phrase = ago ? `${m} in-progress (${ago})` : `${m} in-progress`;
                            clr = '#ffd54f';
                        }
                        else if (st === 'staged' && w && w.worker_staged_ago) {
                            phrase = `${m} awaiting worker (staged ${w.worker_staged_ago})`;
                            clr = '#90caf9';
                        }
                        else if (st === 'staged') { phrase = `${m} staged`; clr = '#90caf9'; }
                        else { phrase = `${m} ${st}`; }
                        phaseBits.push(`<span style="color:${clr}">${phrase}</span>`);
                    }
                    const phases = phaseBits.length ? ' — ' + phaseBits.join(' · ') : '';
                    tbits.push(`<div style="padding-left:14px">• <a href="${url}" style="color:#ffd54f">${esc(name)}</a>${phases}</div>`);
                }
                const label = activeItems.length === 1 ? 'topic' : 'topics';
                lines.push(`<strong>${activeItems.length} ${label} in flight:</strong>${tbits.join('')}`);
            }

            // --- Fact 4: External (non-research) work in flight ---
            // Without this, a codoc/corun-ai job holding a worker claim
            // would show up only as "busy" in the Remote workers line
            // with no visible topic — the human wouldn't know WHY the
            // worker is busy.
            const extWork = data.external_work_in_flight || [];
            if (extWork.length > 0) {
                const ebits = [];
                for (const w of extWork) {
                    const mid = (w.claimed_by || '').substring(0,8);
                    const src = esc(w.source || '');
                    const lbl = w.label ? ` — ${esc(w.label)}` : '';
                    const since = w.claimed_at_ago ? ` (claimed ${w.claimed_at_ago})` : '';
                    ebits.push(
                        `<div style="padding-left:14px">• <span style="color:#90caf9">${src}</span>${lbl} · ${esc(w.capability)} on ${mid}${since}</div>`
                    );
                }
                const label2 = extWork.length === 1 ? 'external job' : 'external jobs';
                lines.push(`<strong>${extWork.length} ${label2} in flight:</strong>${ebits.join('')}`);
            }

            banner.className = systemBusy ? 'agent-banner agent-running' : 'agent-banner agent-idle';
            banner.innerHTML = `<span class="activity-dot ${dotClass}"></span>` +
                lines.map((l, i) => i === 0 ? l : `<div style="margin-top:4px">${l}</div>`).join('');
            // Error section
            if (agent.last_error && agent.last_error.trim()) {
                const errTime = agent.last_error_time_ago || '';
                errorDiv.innerHTML = `Error${errTime ? ' (' + errTime + ')' : ''}: ${esc(agent.last_error)}`;
            } else {
                errorDiv.innerHTML = '';
            }

            // Stats
            const pending = items.filter(i => i.status === 'pending').length;
            const active = items.filter(i => i.status === 'active').length;
            const done = items.filter(i => i.status === 'done').length;
            const blocked = items.filter(i => i.status === 'blocked' || i.status === 'failed').length;
            let statsText = `${items.length} topics`;
            if (pending) statsText += `, ${pending} pending`;
            if (active) statsText += `, ${active} running`;
            if (done) statsText += `, ${done} completed`;
            if (blocked) statsText += `, ${blocked} failed`;
            document.getElementById('stats').textContent = statsText;

            // Items
            if (items.length === 0) {
                document.getElementById('content').innerHTML =
                    '<div class="empty">No research topics queued.</div>';
                return;
            }

            const currentEntry = (data.agent || {}).current_entry;
            let html = '';
            for (const item of items) {
                const isRunning = agentRunning && item.id === currentEntry && item.status !== 'done';
                const st = item.status;
                // 'blocked' accepted for legacy data; new writes use 'failed'.
                // 'active' displays as 'running' — it is the state in which work
                // is in progress (subprocess running, or remote worker has claimed).
                // Exception: a remote-worker sub-entry has Entry.status='active'
                // from the moment it is staged, regardless of whether a worker
                // has claimed it yet. Distinguish by worker_claimed_at — if
                // absent, the sub-entry is still staged, not running.
                const isFailed = st === 'failed' || st === 'blocked';
                const isUnclaimedRemote = st === 'active'
                    && item.source === 'multimodel'
                    && item.worker_target
                    && !item.worker_claimed_at;
                const cls = st === 'done' ? 'done'
                    : isFailed ? 'failed'
                    : isRunning ? 'running'
                    : isUnclaimedRemote ? 'staged'
                    : st === 'active' ? 'running'
                    : st === 'staged' ? 'staged'
                    : 'pending';
                const statusCls = 'status-' + cls;
                const label = cls;

                html += `<div class="research-item ${cls}">`;
                html += '<div class="item-header">';
                html += `<span class="item-eid"><a href="${entryUrl(item.id, item.entry_id)}">${esc(item.entry_id || item.id.substring(0, 8))}</a></span>`;
                html += `<span class="item-status ${statusCls}">${label}</span>`;
                if (item.priority) {
                    html += `<span style="color:#666;font-size:11px">P${item.priority}</span>`;
                }
                if (item.status === 'done' || item.status === 'active' || item.status === 'blocked' || item.status === 'failed' || isRunning) {
                    const itemName = encodeURIComponent(item.entry_id || item.id.substring(0,8));
                    html += `<a href="/tjai/agent-log?ref=${item.id}&name=${itemName}" style="color:#90caf9;font-size:11px">log</a>`;
                    html += `<a href="/tjai/research/studies/?uuid=${item.id}&name=${itemName}" style="color:#90caf9;font-size:11px">studies</a>`;
                }
                if (isRunning) {
                    html += `<button class="btn-submit" style="color:#ef5350;border-color:#ef5350" onclick="abortAgent(this)">Abort</button>`;
                }
                // Always show model checkboxes + rerun for base entries (not model sub-entries)
                if (!isRunning && item.source !== 'multimodel') {
                    // Models list comes from the API (derived from RESEARCH_MODELS on server)
                    const models = data.models || [];
                    const mColors = {done: '#9ccc65', active: '#ffd54f', staged: '#90caf9', blocked: '#ef5350', failed: '#ef5350'};
                    html += '<span style="margin-left:8px;font-size:11px">';
                    for (const m of models) {
                        const label = m.charAt(0).toUpperCase() + m.slice(1);
                        const st = item[m + '_status'];
                        const clr = mColors[st] || '#b0bec5';
                        const checked = pendingChecks.has(item.entry_id + '::' + m) ? ' checked' : '';
                        html += `<label style="margin-right:8px;cursor:pointer;color:${clr}"><input type="checkbox" class="model-cb-${esc(item.entry_id)}" value="${m}" onchange="togglePending('${esc(item.entry_id)}','${m}',this)"${checked} style="vertical-align:middle;margin-right:2px">${label}</label>`;
                    }
                    html += '</span>';
                    html += `<button class="btn-submit" onclick="rerunModels('${esc(item.entry_id)}', this)">Rerun selections</button>`;
                    html += `<button class="btn-submit" onclick="rerunItem('${esc(item.entry_id)}', this)">Resubmit</button>`;
                    html += `<button class="btn-submit" onclick="submitItem('${esc(item.entry_id)}', this)">Submit</button>`;
                }
                html += '</div>';
                const topic = item.content.split('\n')[0];
                html += `<div class="item-content">${esc(topic)}</div>`;
                let meta = `Created ${item.created_display}`;
                if (isRunning && data.agent && data.agent.launched_dur) {
                    meta += ` · Running for ${data.agent.launched_dur}`;
                } else if (item.status === 'done' && item.started_at) {
                    const dur = item.modified - item.started_at;
                    const durMin = Math.floor(dur / 60);
                    meta += ` · Ran ${durMin < 60 ? durMin + 'm' : Math.floor(durMin/60) + 'h ' + (durMin%60) + 'm'}`;
                    meta += ` · Completed ${item.modified_ago}`;
                } else if (item.status === 'done') {
                    meta += ` · Completed ${item.modified_ago}`;
                }
                html += `<div class="item-meta">${meta}</div>`;
                html += '</div>';
            }

            document.getElementById('content').innerHTML = html;
        }

        function getCsrf() {
            const c = document.cookie.match(/csrftoken=([^;]+)/);
            return c ? c[1] : '';
        }

        async function submitItem(entryId, btn) {
            if (agentRunning) return;
            btn.disabled = true;
            btn.textContent = 'Submitting...';
            try {
                const resp = await fetch('/tjai/api/research/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                    body: JSON.stringify({entry_id: entryId}),
                });
                const data = await resp.json();
                if (data.error) {
                    btn.textContent = data.error;
                    setTimeout(() => { btn.textContent = 'Submit'; btn.disabled = false; }, 3000);
                    return;
                }
                if (data.warning) {
                    btn.textContent = data.warning;
                    btn.style.color = '#ff9800';
                    setTimeout(() => { btn.textContent = 'Submit'; btn.disabled = false; btn.style.color = ''; }, 5000);
                    return;
                }
                btn.textContent = 'Queued';
                setTimeout(fetchData, 3000);
            } catch (e) {
                btn.textContent = 'Error';
                setTimeout(() => { btn.textContent = 'Submit'; btn.disabled = false; }, 3000);
            }
        }

        async function rerunItem(entryId, btn) {
            btn.disabled = true;
            btn.textContent = 'Creating...';
            try {
                const resp = await fetch('/tjai/api/research/rerun', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                    body: JSON.stringify({entry_id: entryId}),
                });
                const data = await resp.json();
                if (data.error) {
                    btn.textContent = data.error;
                    setTimeout(() => { btn.textContent = 'Resubmit'; btn.disabled = false; }, 3000);
                    return;
                }
                btn.textContent = data.new_entry_id;
                btn.style.color = '#4caf50';
                setTimeout(fetchData, 2000);
            } catch (e) {
                btn.textContent = 'Error';
                setTimeout(() => { btn.textContent = 'Resubmit'; btn.disabled = false; }, 3000);
            }
        }

        async function rerunModels(entryId, btn) {
            const cbs = document.querySelectorAll(`.model-cb-${CSS.escape(entryId)}:checked`);
            const models = Array.from(cbs).map(cb => cb.value);
            if (!models.length) { alert('Select at least one model'); return; }
            btn.disabled = true;
            btn.textContent = 'Rerunning...';
            try {
                const resp = await fetch('/tjai/api/research/rerun-models', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                    body: JSON.stringify({entry_id: entryId, models: models}),
                });
                const data = await resp.json();
                if (data.error) {
                    btn.textContent = data.error;
                    setTimeout(() => { btn.textContent = 'Rerun selections'; btn.disabled = false; }, 3000);
                    return;
                }
                btn.textContent = 'Queued ' + models.join('+');
                btn.style.color = '#4caf50';
                // Selections consumed — drop them so the next render doesn't re-tick.
                for (const m of models) pendingChecks.delete(entryId + '::' + m);
                setTimeout(fetchData, 2000);
            } catch (e) {
                btn.textContent = 'Error';
                setTimeout(() => { btn.textContent = 'Rerun selections'; btn.disabled = false; }, 3000);
            }
        }

        async function abortAgent(btn) {
            btn.disabled = true;
            btn.textContent = 'Aborting...';
            try {
                const resp = await fetch('/tjai/api/research/abort', {
                    method: 'POST',
                    headers: {'X-CSRFToken': getCsrf()},
                });
                const data = await resp.json();
                if (data.error) {
                    btn.textContent = data.error;
                    setTimeout(fetchData, 3000);
                    return;
                }
                btn.textContent = 'Aborted';
                setTimeout(fetchData, 2000);
            } catch (e) {
                btn.textContent = 'Error';
                setTimeout(fetchData, 3000);
            }
        }


        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>

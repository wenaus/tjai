<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/tjai/static/tjai/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tjai Research</title>
    <link rel="stylesheet" href="/tjai/static/tjai/menu.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .research-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 24px;
            background: #222;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            font-size: 12px;
        }
        .research-header a { color: #64b5f6; text-decoration: none; }
        .research-header a:hover { text-decoration: underline; }
        .research-header .stats { color: #8a8a8a; font-size: 11px; margin-left: auto; }
        .agent-banner {
            padding: 8px 24px;
            font-size: 12px;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .agent-idle { background: #222; color: #8a8a8a; }
        .agent-running { background: rgba(255, 213, 79, 0.1); color: #ffd54f; }
        .agent-failed { background: rgba(239, 83, 80, 0.1); color: #ef5350; }
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px 40px;
        }
        .research-item {
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 3px solid #333;
            background: #222;
            border-radius: 0 3px 3px 0;
        }
        .research-item.done { border-left-color: #4caf50; }
        .research-item.pending { border-left-color: #64b5f6; }
        .item-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 4px;
        }
        .item-eid {
            color: #d8a070;
            font-size: 12px;
            font-weight: bold;
        }
        .item-eid a { color: #d8a070; text-decoration: none; }
        .item-eid a:hover { text-decoration: underline; }
        .item-status {
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 3px;
        }
        .status-pending { background: #1a3a5c; color: #64b5f6; }
        .status-running { background: rgba(255, 213, 79, 0.15); color: #ffd54f; }
        .status-done { background: #1a3c1a; color: #4caf50; }
        .research-item.running { border-left-color: #ffd54f; }
        .item-content {
            color: #bbb;
            font-size: 12px;
            line-height: 1.5;
        }
        .item-meta {
            color: #999;
            font-size: 11px;
            margin-top: 4px;
        }
        .btn-submit {
            background: #333;
            color: #64b5f6;
            border: 1px solid #64b5f6;
            padding: 2px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            white-space: nowrap;
        }
        .btn-submit:hover { background: #1a3a5c; }
        .btn-submit:disabled {
            color: #555;
            border-color: #444;
            cursor: default;
            background: #2a2a2a;
        }
        .activity-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .dot-active { background: #4caf50; animation: pulse 1.5s ease-in-out infinite; }
        .dot-idle { background: #ff9800; }
        .dot-stale { background: #ef5350; }
        .dot-off { background: #555; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .error-section {
            padding: 6px 24px;
            font-size: 11px;
            background: rgba(239, 83, 80, 0.08);
            color: #ef5350;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .error-section:empty { display: none; }
        .loading { color: #8a8a8a; padding: 20px; }
        .error { color: #ef5350; padding: 20px; }
        .empty { color: #8a8a8a; padding: 40px; text-align: center; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        * { scrollbar-width: thin; scrollbar-color: #444 #1a1a1a; }
    </style>
</head>
<body>
    {% with current_page="research" %}{% include "tjai_app/_menu.html" %}{% endwith %}
    <div class="research-header">
        <span id="sysprompt-link"></span>
        <button class="btn-submit" id="btn-all" onclick="submitAllOrStop()">Submit All</button>
        <span class="stats" id="stats"></span>
    </div>
    <div class="agent-banner agent-idle" id="agent-banner">Agent: loading...</div>
    <div class="error-section" id="error-section"></div>
    <div class="content-area" id="content">
        <div class="loading">Loading research queue...</div>
    </div>

    <script>
        function esc(s) {
            if (!s) return '';
            const el = document.createElement('span');
            el.textContent = s;
            return el.innerHTML;
        }

        // timeAgo, fmtDate removed — server provides _ago and _display fields

        function entryUrl(uuid, entryId) {
            if (entryId) return '/tjai/entry/?entry_id=' + encodeURIComponent(entryId);
            return '/tjai/entry/?uuid=' + uuid;
        }

        let agentRunning = false;
        let hasPending = false;

        async function fetchData() {
            try {
                const resp = await fetch('/tjai/api/research/data');
                const data = await resp.json();
                if (data.error) {
                    document.getElementById('content').innerHTML =
                        `<div class="error">${esc(data.error)}</div>`;
                    return;
                }
                agentRunning = (data.agent || {}).status === 'running';
                hasPending = (data.items || []).some(i => i.status !== 'done');
                render(data);
                updateAllBtn();
            } catch (e) {
                document.getElementById('content').innerHTML =
                    '<div class="error">Error loading research data</div>';
            }
        }

        function render(data) {
            // Sysprompt link
            const spEl = document.getElementById('sysprompt-link');
            if (data.sysprompt_id) {
                spEl.innerHTML = `<a href="${entryUrl(data.sysprompt_id, 'research-system-prompt-v2')}">System Prompt</a>`;
            } else {
                spEl.innerHTML = '<span style="color:#666">No system prompt</span>';
            }

            // Agent status banner with activity dot
            const items = data.items || [];
            const agent = data.agent || {};
            const banner = document.getElementById('agent-banner');
            const errorDiv = document.getElementById('error-section');
            if (agent.status === 'running') {
                const dur = agent.launched_dur ? ' for ' + agent.launched_dur : '';
                const logLink = agent.current_entry ? ` <a href="/tjai/agent-log?ref=${agent.current_entry}" style="color:#ffd54f">log</a>` : '';
                // Look up what entry the agent is working on
                const currentItem = items.find(i => i.id === agent.current_entry);
                const entryName = currentItem ? (currentItem.entry_id || currentItem.id.substring(0, 8)) : (agent.current_entry || '?').substring(0, 8);
                const entryStatus = currentItem ? currentItem.status : '';
                const entryDone = entryStatus === 'done';
                // Activity dot based on health/last_activity
                let dotClass = 'dot-idle';
                let activityInfo = '';
                if (agent.last_activity) {
                    const actAge = agent.last_activity_age;
                    if (actAge < 30) { dotClass = 'dot-active'; }
                    else if (actAge < 300) { dotClass = 'dot-idle'; }
                    else { dotClass = 'dot-stale'; }
                    activityInfo = ` · activity ${agent.last_activity_ago}`;
                } else if (agent.health === 'active') { dotClass = 'dot-active'; }
                else if (agent.health === 'stale') { dotClass = 'dot-stale'; }
                const procInfo = agent.process_alive === '0' ? ' · <span style="color:#ef5350">no process</span>' : '';
                if (entryDone) {
                    banner.className = 'agent-banner agent-running';
                    banner.innerHTML = `<span class="activity-dot ${dotClass}"></span>Agent: process running on <strong>${esc(entryName)}</strong> (entry done)${dur}${activityInfo}${procInfo} <button class="btn-submit" style="color:#ef5350;border-color:#ef5350;margin-left:8px" onclick="abortAgent(this)">Abort</button>${logLink}`;
                } else {
                    banner.className = 'agent-banner agent-running';
                    banner.innerHTML = `<span class="activity-dot ${dotClass}"></span>Agent: <strong>running</strong> ${esc(entryName)}${dur}${activityInfo}${procInfo}${logLink}`;
                }
            } else if (agent.status === 'failed') {
                banner.className = 'agent-banner agent-failed';
                banner.innerHTML = '<span class="activity-dot dot-stale"></span>Agent: <strong>failed</strong>';
            } else {
                banner.className = 'agent-banner agent-idle';
                let text = '<span class="activity-dot dot-off"></span>Agent: idle';
                if (agent.completed) {
                    text += ' — last completed ' + agent.completed_ago;
                }
                banner.innerHTML = text;
            }
            // Error section
            if (agent.last_error && agent.last_error.trim()) {
                const errTime = agent.last_error_time_ago || '';
                errorDiv.innerHTML = `Error${errTime ? ' (' + errTime + ')' : ''}: ${esc(agent.last_error)}`;
            } else {
                errorDiv.innerHTML = '';
            }

            // Stats
            const pending = items.filter(i => i.status === 'pending').length;
            const done = items.filter(i => i.status === 'done').length;
            document.getElementById('stats').textContent =
                `${items.length} topics, ${pending} pending, ${done} completed`;

            // Items
            if (items.length === 0) {
                document.getElementById('content').innerHTML =
                    '<div class="empty">No research topics queued.</div>';
                return;
            }

            const currentEntry = (data.agent || {}).current_entry;
            let html = '';
            for (const item of items) {
                const isRunning = agentRunning && item.id === currentEntry && item.status !== 'done';
                const cls = item.status === 'done' ? 'done' : isRunning ? 'running' : 'pending';
                const statusCls = item.status === 'done' ? 'status-done' : isRunning ? 'status-running' : 'status-pending';
                const label = item.status === 'done' ? 'done' : isRunning ? 'running' : 'pending';

                html += `<div class="research-item ${cls}">`;
                html += '<div class="item-header">';
                html += `<span class="item-eid"><a href="${entryUrl(item.id, item.entry_id)}">${esc(item.entry_id || item.id.substring(0, 8))}</a></span>`;
                html += `<span class="item-status ${statusCls}">${label}</span>`;
                if (item.priority) {
                    html += `<span style="color:#666;font-size:11px">P${item.priority}</span>`;
                }
                if (item.status === 'done' || isRunning) {
                    const itemName = encodeURIComponent(item.entry_id || item.id.substring(0,8));
                    html += `<a href="/tjai/agent-log?ref=${item.id}&name=${itemName}" style="color:#64b5f6;font-size:11px">log</a>`;
                    html += `<a href="/tjai/research/studies/?uuid=${item.id}&name=${itemName}" style="color:#64b5f6;font-size:11px">studies</a>`;
                }
                if (isRunning) {
                    html += `<button class="btn-submit" style="color:#ef5350;border-color:#ef5350" onclick="abortAgent(this)">Abort</button>`;
                } else if (item.status === 'done') {
                    html += `<button class="btn-submit" onclick="rerunItem('${esc(item.entry_id)}', this)">Rerun</button>`;
                } else {
                    const disabled = agentRunning ? ' disabled' : '';
                    html += `<button class="btn-submit"${disabled} onclick="submitItem('${esc(item.entry_id)}', this)">Submit</button>`;
                }
                html += '</div>';
                const topic = item.content.split('\n')[0];
                html += `<div class="item-content">${esc(topic)}</div>`;
                let meta = `Created ${item.created_display}`;
                if (isRunning && data.agent && data.agent.launched_dur) {
                    meta += ` · Running for ${data.agent.launched_dur}`;
                } else if (item.status === 'done' && item.started_at) {
                    const dur = item.modified - item.started_at;
                    const durMin = Math.floor(dur / 60);
                    meta += ` · Ran ${durMin < 60 ? durMin + 'm' : Math.floor(durMin/60) + 'h ' + (durMin%60) + 'm'}`;
                    meta += ` · Completed ${item.modified_ago}`;
                } else if (item.status === 'done') {
                    meta += ` · Completed ${item.modified_ago}`;
                }
                html += `<div class="item-meta">${meta}</div>`;
                html += '</div>';
            }

            document.getElementById('content').innerHTML = html;
        }

        function getCsrf() {
            const c = document.cookie.match(/csrftoken=([^;]+)/);
            return c ? c[1] : '';
        }

        async function submitItem(entryId, btn) {
            if (agentRunning) return;
            btn.disabled = true;
            btn.textContent = 'Submitting...';
            try {
                const resp = await fetch('/tjai/api/research/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                    body: JSON.stringify({entry_id: entryId}),
                });
                const data = await resp.json();
                if (data.error) {
                    btn.textContent = data.error;
                    setTimeout(() => { btn.textContent = 'Submit'; btn.disabled = false; }, 3000);
                    return;
                }
                if (data.warning) {
                    btn.textContent = data.warning;
                    btn.style.color = '#ff9800';
                    setTimeout(() => { btn.textContent = 'Submit'; btn.disabled = false; btn.style.color = ''; }, 5000);
                    return;
                }
                btn.textContent = 'Queued';
                setTimeout(fetchData, 3000);
            } catch (e) {
                btn.textContent = 'Error';
                setTimeout(() => { btn.textContent = 'Submit'; btn.disabled = false; }, 3000);
            }
        }

        async function rerunItem(entryId, btn) {
            btn.disabled = true;
            btn.textContent = 'Creating...';
            try {
                const resp = await fetch('/tjai/api/research/rerun', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                    body: JSON.stringify({entry_id: entryId}),
                });
                const data = await resp.json();
                if (data.error) {
                    btn.textContent = data.error;
                    setTimeout(() => { btn.textContent = 'Rerun'; btn.disabled = false; }, 3000);
                    return;
                }
                btn.textContent = data.new_entry_id;
                btn.style.color = '#4caf50';
                setTimeout(fetchData, 2000);
            } catch (e) {
                btn.textContent = 'Error';
                setTimeout(() => { btn.textContent = 'Rerun'; btn.disabled = false; }, 3000);
            }
        }

        async function abortAgent(btn) {
            btn.disabled = true;
            btn.textContent = 'Aborting...';
            try {
                const resp = await fetch('/tjai/api/research/abort', {
                    method: 'POST',
                    headers: {'X-CSRFToken': getCsrf()},
                });
                const data = await resp.json();
                if (data.error) {
                    btn.textContent = data.error;
                    setTimeout(fetchData, 3000);
                    return;
                }
                btn.textContent = 'Aborted';
                setTimeout(fetchData, 2000);
            } catch (e) {
                btn.textContent = 'Error';
                setTimeout(fetchData, 3000);
            }
        }

        function updateAllBtn() {
            const btn = document.getElementById('btn-all');
            if (agentRunning) {
                btn.textContent = 'Stop';
                btn.style.color = '#ef5350';
                btn.style.borderColor = '#ef5350';
                btn.disabled = false;
            } else if (hasPending) {
                btn.textContent = 'Submit All';
                btn.style.color = '#64b5f6';
                btn.style.borderColor = '#64b5f6';
                btn.disabled = false;
            } else {
                btn.textContent = 'Submit All';
                btn.style.color = '#555';
                btn.style.borderColor = '#444';
                btn.disabled = true;
            }
        }

        async function submitAllOrStop() {
            const btn = document.getElementById('btn-all');
            btn.disabled = true;
            if (agentRunning) {
                btn.textContent = 'Stopping...';
                try {
                    await fetch('/tjai/api/research/stop', {
                        method: 'POST',
                        headers: {'X-CSRFToken': getCsrf()},
                    });
                } catch (e) { /* will refresh on next poll */ }
                setTimeout(fetchData, 3000);
            } else {
                btn.textContent = 'Submitting...';
                try {
                    const resp = await fetch('/tjai/api/research/run', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                        body: JSON.stringify({entry_id: 'all'}),
                    });
                    const data = await resp.json();
                    if (data.error) {
                        btn.textContent = data.error;
                        setTimeout(updateAllBtn, 3000);
                        return;
                    }
                    if (data.warning) {
                        btn.textContent = data.warning;
                        btn.style.color = '#ff9800';
                        setTimeout(updateAllBtn, 5000);
                        return;
                    }
                } catch (e) {
                    btn.textContent = 'Error';
                    setTimeout(updateAllBtn, 3000);
                    return;
                }
                setTimeout(fetchData, 3000);
            }
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>

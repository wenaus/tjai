<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/tjai/static/tjai/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tjai Research List</title>
    <link rel="stylesheet" href="/tjai/static/tjai/menu.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 14px;
            background: #181818;
            color: #e4e4e4;
            min-height: 100vh;
        }
        a { color: #90caf9; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .page-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 24px;
            background: #222;
            border-bottom: 1px solid #333;
            font-size: 13px;
        }
        .page-header .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }
        .page-header .stats {
            color: #a0a0a0;
            font-size: 12px;
        }
        .toolbar {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) 150px 150px auto auto;
            gap: 10px;
            padding: 14px 24px;
            background: #202020;
            border-bottom: 1px solid #333;
            align-items: center;
        }
        input, select, button {
            font: inherit;
            font-size: 13px;
        }
        input, select {
            width: 100%;
            min-height: 34px;
            background: #101010;
            color: #f0f0f0;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 6px 8px;
        }
        button {
            min-height: 32px;
            background: #303030;
            color: #90caf9;
            border: 1px solid #5d8db5;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            white-space: nowrap;
        }
        button:hover { background: #1f3547; }
        button:disabled {
            color: #6a6a6a;
            border-color: #444;
            background: #252525;
            cursor: default;
        }
        .danger { color: #ef9a9a; border-color: #b85d5d; }
        .danger:hover { background: #402424; }
        .secondary { color: #d0d0d0; border-color: #666; }
        .content {
            padding: 16px 24px 42px;
            max-width: 1480px;
        }
        .topic-row {
            display: grid;
            grid-template-columns: minmax(420px, 1fr) 210px 210px;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #303030;
            align-items: start;
        }
        .topic-title {
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 5px;
        }
        .topic-description {
            color: #c5c5c5;
            line-height: 1.45;
        }
        .meta {
            color: #9b9b9b;
            font-size: 12px;
            line-height: 1.5;
        }
        .status {
            display: inline-block;
            min-width: 78px;
            text-align: center;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 7px;
        }
        .status-proposed { background: #3a2f16; color: #ffd180; }
        .status-pending { background: #1a3a5c; color: #90caf9; }
        .status-active, .status-running, .status-staged { background: rgba(255, 213, 79, 0.15); color: #ffd54f; }
        .status-done { background: #1a3c1a; color: #9ccc65; }
        .status-failed, .status-blocked { background: rgba(239, 83, 80, 0.15); color: #ef9a9a; }
        .status-archive { background: #333; color: #aaa; }
        .models {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .model {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            color: #b0bec5;
            background: #282828;
            border: 1px solid #3b3b3b;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 12px;
            text-decoration: none;
        }
        .model:hover {
            background: #1f3547;
            text-decoration: none;
        }
        .model.done { color: #9ccc65; border-color: #406b40; }
        .model.active, .model.staged, .model.launching { color: #ffd54f; border-color: #6a5a25; }
        .model.failed, .model.blocked { color: #ef9a9a; border-color: #754040; }
        .status-actions {
            display: flex;
            gap: 6px;
            margin: 0 0 8px;
            max-width: 162px;
        }
        .status-actions button {
            flex: 1;
            min-height: 26px;
            padding: 2px 8px;
            font-size: 12px;
        }
        .loading, .empty, .error {
            padding: 26px 0;
            color: #a0a0a0;
        }
        .error { color: #ef9a9a; }
        .pager {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 16px;
            color: #9b9b9b;
            font-size: 13px;
        }
        @media (max-width: 900px) {
            .toolbar {
                grid-template-columns: 1fr 1fr;
            }
            .toolbar input {
                grid-column: 1 / -1;
            }
            .topic-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .page-header {
                flex-wrap: wrap;
            }
            .page-header .header-right {
                width: 100%;
                margin-left: 0;
                justify-content: space-between;
                align-items: flex-start;
                gap: 10px;
            }
            .page-header .stats,
            #offline-cache-status {
                overflow-wrap: anywhere;
            }
        }
    </style>
</head>
<body>
    {% with current_page="research" %}{% include "tjai_app/_menu.html" %}{% endwith %}
    <div class="page-header">
        <a href="/tjai/research-legacy/">Legacy Research Page</a>
        <span class="header-right">
            <span class="stats" id="stats">Loading...</span>
            <span class="meta" id="offline-cache-status">cache loading</span>
        </span>
    </div>
    <form class="toolbar" id="search-form">
        <input id="query" type="search" autocomplete="off" placeholder="Search research topics">
        <select id="scope">
            <option value="title">Title</option>
            <option value="topic">Title and topic text</option>
            <option value="bodies">Title, topic text, bodies</option>
        </select>
        <select id="status">
            <option value="open">Open topics</option>
            <option value="all">All statuses</option>
            <option value="proposed">Proposed</option>
            <option value="pending">Pending</option>
            <option value="active">Active</option>
            <option value="done">Done</option>
            <option value="failed,blocked">Failed</option>
            <option value="archive">Archived</option>
        </select>
        <button type="submit">Search</button>
        <button type="button" class="secondary" onclick="clearSearch()">Clear</button>
    </form>
    <main class="content">
        <div id="results" class="loading">Loading research topics...</div>
        <div class="pager" id="pager" style="display:none">
            <button type="button" class="secondary" onclick="prevPage()">Prev</button>
            <span id="page-info"></span>
            <button type="button" class="secondary" onclick="nextPage()">Next</button>
        </div>
    </main>

    <script src="/tjai/static/tjai/research-cache.js?v=3"></script>
    <script>
        const state = {
            offset: 0,
            limit: 100,
            hasMore: false,
            loading: false,
            lastRefreshAt: null,
            latestStats: null,
        };

        function esc(s) {
            if (!s) return '';
            const el = document.createElement('span');
            el.textContent = s;
            return el.innerHTML;
        }

        function getCsrf() {
            const c = document.cookie.match(/csrftoken=([^;]+)/);
            return c ? c[1] : '';
        }

        function params() {
            const p = new URLSearchParams();
            const q = document.getElementById('query').value.trim();
            const scope = document.getElementById('scope').value;
            const status = document.getElementById('status').value;
            if (q) p.set('q', q);
            p.set('scope', scope);
            if (status) p.set('status', status);
            p.set('offset', state.offset);
            p.set('limit', state.limit);
            return p;
        }

        async function refreshList(showLoading = true) {
            if (state.loading) return;
            state.loading = true;
            if (showLoading) {
                document.getElementById('results').innerHTML = '<div class="loading">Loading research topics...</div>';
            }
            try {
                const resp = await fetch('/tjai/api/research/list?' + params().toString(), {cache: 'no-store'});
                const data = await resp.json();
                if (!resp.ok || data.error) throw new Error(data.error || 'Load failed');
                render(data);
            } catch (e) {
                try {
                    const data = await ResearchCache.offlineList(params());
                    render(data);
                    ResearchCache.setStatus('offline');
                } catch (cacheError) {
                    document.getElementById('results').innerHTML = '<div class="error">' + esc(e.message) + '</div>';
                }
            } finally {
                state.loading = false;
            }
        }

        function render(data) {
            const stats = data.stats || {};
            state.hasMore = !!stats.has_more;
            state.latestStats = stats;
            state.lastRefreshAt = new Date();
            updateStatsText();
            if (data.offline) ResearchCache.setStatus('offline');

            const items = data.items || [];
            if (!items.length) {
                document.getElementById('results').innerHTML = '<div class="empty">No matching research topics.</div>';
            } else {
                document.getElementById('results').innerHTML = items.map(item => rowHtml(item, data.models || [])).join('');
            }
            const pager = document.getElementById('pager');
            pager.style.display = (state.offset > 0 || state.hasMore) ? 'flex' : 'none';
            document.getElementById('page-info').textContent =
                `Rows ${state.offset + 1}-${state.offset + items.length} of ${stats.filtered || items.length}`;
            pager.querySelector('button:first-child').disabled = state.offset === 0;
            pager.querySelector('button:last-child').disabled = !state.hasMore;
        }

        function updateStatsText() {
            const stats = state.latestStats || {};
            const bits = [`${stats.filtered || 0} shown`, `${stats.topics || 0} topics`];
            const counts = stats.counts_by_status || {};
            for (const key of ['proposed', 'pending', 'active', 'done', 'failed', 'blocked']) {
                if (counts[key]) bits.push(`${counts[key]} ${key}`);
            }
            if (state.lastRefreshAt) {
                const elapsed = Math.max(0, Math.floor((Date.now() - state.lastRefreshAt.getTime()) / 1000));
                bits.push(`refreshed ${state.lastRefreshAt.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'})}`);
                bits.push(`${elapsed}s since refresh`);
            }
            document.getElementById('stats').textContent = bits.join(' · ');
        }

        function rowHtml(item, models) {
            const status = item.status || 'pending';
            const statusClass = 'status-' + status;
            const source = item.source ? `source ${esc(item.source)}` : '';
            const matched = item.match_scope ? `matched ${esc(item.match_scope)}` : '';
            const meta = [source, `${item.subentry_count || 0} branches`, `modified ${esc(item.modified_display || '')}`, matched]
                .filter(Boolean).join(' · ');
            const canRun = ['proposed', 'pending', 'failed', 'blocked'].includes(status);
            const canArchive = status !== 'archive' && status !== 'active';
            const actions = [
                canRun ? `<button type="button" onclick="runTopic('${esc(item.entry_id)}', this)">Run</button>` : '',
                canArchive ? `<button type="button" class="danger" onclick="archiveTopic('${esc(item.entry_id)}', this)">Archive</button>` : '',
            ].filter(Boolean).join(' ');
            const actionsHtml = actions ? `<div class="status-actions">${actions}</div>` : '';
            const researched = item.researched_models || [];
            let modelHtml = researched.length
                ? researched.map(model => {
                    const st = (item.models || {})[model] || 'done';
                    const href = item.detail_url + '#branch-' + anchorId(model);
                    return `<a class="model ${esc(st)}" href="${href}">${esc(model)}</a>`;
                }).join('')
                : '<span class="meta">No model branches yet</span>';
            if (item.synthesis_done) {
                const href = item.detail_url + '#synthesis';
                modelHtml += `<a class="model done" href="${href}">synthesis</a>`;
            }
            return `
                <section class="topic-row" data-id="${esc(item.id)}" data-entry-id="${esc(item.entry_id)}">
                    <div>
                        <div class="topic-title"><a href="${esc(item.detail_url)}">${esc(item.title)}</a></div>
                        <div class="topic-description">${esc(item.description || '')}</div>
                    </div>
                    <div>
                        <span class="status ${statusClass}">${esc(status)}</span>
                        ${actionsHtml}
                        <div class="models">${modelHtml}</div>
                    </div>
                    <div>
                        <div class="meta">${esc(item.entry_id || item.id.substring(0, 8))}</div>
                        <div class="meta">${meta}</div>
                    </div>
                </section>`;
        }

        function anchorId(s) {
            return String(s || 'section').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'section';
        }

        async function runTopic(entryId, btn) {
            if (!entryId) return;
            btn.disabled = true;
            const original = btn.textContent;
            btn.textContent = 'Running...';
            try {
                const resp = await fetch('/tjai/api/research/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                    body: JSON.stringify({entry_id: entryId}),
                });
                const data = await resp.json();
                if (!resp.ok || data.error) throw new Error(data.error || 'Run failed');
                btn.textContent = 'Queued';
                setTimeout(() => refreshList(false), 1200);
            } catch (e) {
                btn.textContent = e.message;
                setTimeout(() => { btn.disabled = false; btn.textContent = original; }, 2500);
            }
        }

        async function archiveTopic(entryId, btn) {
            if (!entryId) return;
            btn.disabled = true;
            const original = btn.textContent;
            btn.textContent = 'Archiving...';
            try {
                const resp = await fetch('/tjai/api/entry/' + encodeURIComponent(entryId) + '/archive', {
                    method: 'POST',
                    headers: {'X-CSRFToken': getCsrf()},
                });
                const data = await resp.json();
                if (!resp.ok || data.error) throw new Error(data.error || 'Archive failed');
                refreshList(false);
            } catch (e) {
                btn.textContent = e.message;
                setTimeout(() => { btn.disabled = false; btn.textContent = original; }, 2500);
            }
        }

        function prevPage() {
            state.offset = Math.max(0, state.offset - state.limit);
            refreshList();
        }

        function nextPage() {
            if (!state.hasMore) return;
            state.offset += state.limit;
            refreshList();
        }

        function clearSearch() {
            document.getElementById('query').value = '';
            document.getElementById('scope').value = 'title';
            document.getElementById('status').value = 'open';
            state.offset = 0;
            refreshList();
        }

        document.getElementById('search-form').addEventListener('submit', event => {
            event.preventDefault();
            state.offset = 0;
            refreshList();
        });
        for (const id of ['scope', 'status']) {
            document.getElementById(id).addEventListener('change', () => {
                state.offset = 0;
                refreshList();
            });
        }
        ResearchCache.init({statusEl: document.getElementById('offline-cache-status')}).catch(console.warn);
        refreshList();
        setInterval(() => refreshList(false), 30000);
        setInterval(updateStatsText, 1000);
    </script>
</body>
</html>

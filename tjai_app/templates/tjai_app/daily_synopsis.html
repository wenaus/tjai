<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/tjai/static/tjai/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tjai Daily Synopsis</title>
    <link rel="stylesheet" href="/tjai/static/tjai/menu.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .panel-left {
            width: 200px;
            min-width: 200px;
            border-right: 1px solid #333;
            overflow-y: auto;
            padding: 12px 0;
        }
        .panel-right {
            flex: 1;
            overflow-y: auto;
            padding: 20px 32px;
        }
        .panel-right:focus { outline: none; }
        .date-item {
            padding: 6px 16px;
            cursor: pointer;
            color: #8a8a8a;
            white-space: nowrap;
        }
        .date-item:hover {
            background: #2a2a2a;
            color: #e0e0e0;
        }
        .date-item.selected {
            background: #2a2a2a;
            color: #e0e0e0;
            border-right: 2px solid #d8a070;
        }
        .date-item.today {
            color: #9ccc65;
            font-weight: bold;
        }
        .date-item.today.selected {
            color: #9ccc65;
        }
        .synopsis-content {
            line-height: 1.6;
        }
        .synopsis-content h1 {
            color: #d8a070;
            font-size: 18px;
            margin-bottom: 16px;
        }
        .synopsis-content h2 {
            color: #d8a070;
            font-size: 15px;
            margin-top: 20px;
            margin-bottom: 8px;
        }
        .synopsis-content h3 {
            color: #ce93d8;
            font-size: 14px;
            margin-top: 16px;
            margin-bottom: 6px;
        }
        .synopsis-content p {
            margin-bottom: 8px;
        }
        .synopsis-content ul, .synopsis-content ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }
        .synopsis-content li {
            margin-bottom: 4px;
        }
        .synopsis-content li li {
            font-size: 12px;
            color: #8a8a8a;
            margin-bottom: 1px;
        }
        .synopsis-content a {
            color: #90caf9;
            text-decoration: none;
        }
        .synopsis-content a:hover {
            text-decoration: underline;
        }
        .synopsis-content strong {
            color: #e8c87a;
        }
        .synopsis-content em {
            color: #ce93d8;
        }
        .synopsis-content code {
            background: #2a2a2a;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .synopsis-content hr {
            border: none;
            border-top: 1px solid #333;
            margin: 16px 0;
        }
        .synopsis-content table {
            border-collapse: collapse;
            margin-bottom: 12px;
        }
        .synopsis-content th, .synopsis-content td {
            border: 1px solid #444;
            padding: 4px 8px;
        }
        .synopsis-content th {
            background: #2a2a2a;
            color: #d8a070;
        }
        .loading {
            color: #8a8a8a;
            padding: 20px;
        }
        .error {
            color: #ef5350;
            padding: 20px;
        }
        a.entry-link {
            color: #8a8a8a;
            font-size: 11px;
            text-decoration: none;
            margin-left: 12px;
        }
        a.entry-link:hover {
            color: #e0e0e0;
        }
        .btn-rerun {
            display: inline-block;
            background: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 2px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            margin-left: 12px;
            vertical-align: middle;
        }
        .btn-rerun:hover { background: #444; }
        .btn-rerun:disabled { opacity: 0.5; cursor: default; }
        .entry-pill {
            display: inline-block;
            background: #333;
            color: #8a8a8a;
            border: 1px solid #444;
            padding: 0 6px;
            border-radius: 8px;
            font-size: 10px;
            margin-left: 6px;
            text-decoration: none;
            vertical-align: middle;
        }
        .entry-pill:hover { background: #444; color: #e0e0e0; }
        /* Dark mode scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: #444 #1a1a1a;
        }
    </style>
</head>
<body>
    {% with current_page="synopsis" %}{% include "tjai_app/_menu.html" %}{% endwith %}
    <div class="container">
        <div class="panel-left" id="date-list">
            <div class="loading">Loading dates...</div>
        </div>
        <div class="panel-right" id="synopsis-panel" tabindex="-1">
            <div class="loading">Select a date to view the synopsis.</div>
        </div>
    </div>

    <script>
        let allDates = [];
        let todayKey = '';
        let selectedEntryId = null;

        function focusContentArea() {
            const content = document.getElementById('synopsis-panel');
            if (!content) return;
            const active = document.activeElement;
            if (!active || active === document.body || active === content) {
                content.focus({preventScroll: true});
            }
        }

        async function fetchJson(url, options = {}, timeoutMs = 15000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const resp = await fetch(url, {...options, signal: controller.signal});
                let data = {};
                try {
                    data = await resp.json();
                } catch (e) {
                    data = {error: `Invalid JSON response (HTTP ${resp.status})`};
                }
                if (!resp.ok && !data.error) data.error = `HTTP ${resp.status}`;
                return {resp, data};
            } finally {
                clearTimeout(timer);
            }
        }

        async function fetchDates() {
            try {
                const {data} = await fetchJson('/tjai/api/synopsis/dates');
                if (data.error) {
                    document.getElementById('date-list').innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }
                allDates = data.dates || [];
                todayKey = data.today_key || '';
                renderDateList();
                if (allDates.length > 0) {
                    const params = new URLSearchParams(window.location.search);
                    // Accept both `entry_id` (canonical) and `date` (legacy) —
                    // historical links used `?date=daily-YYYY-MM-DD`.
                    let target = params.get('entry_id') || params.get('date');
                    if (!target && todayKey) {
                        const todayEntry = allDates.find(d => d.date_key === todayKey);
                        target = todayEntry ? todayEntry.entry_id : allDates[0].entry_id;
                    }
                    target = target || allDates[0].entry_id;
                    const found = allDates.find(d => d.entry_id === target);
                    selectDate(found ? target : allDates[0].entry_id);
                }
            } catch (e) {
                const msg = e.name === 'AbortError' ? 'Timed out loading dates' : `Error loading dates: ${e.message}`;
                document.getElementById('date-list').innerHTML = `<div class="error">${msg}</div>`;
            }
        }

        function renderDateList() {
            let html = '';
            for (const d of allDates) {
                const isToday = d.date_key === todayKey;
                const todayClass = isToday ? ' today' : '';
                const label = d.date_display;
                html += `<div class="date-item${todayClass}" data-entry-id="${d.entry_id}" data-date-key="${d.date_key}">${label}</div>`;
            }
            document.getElementById('date-list').innerHTML = html || '<div class="loading">No synopses found.</div>';

            document.querySelectorAll('.date-item').forEach(el => {
                el.addEventListener('click', function() {
                    selectDate(this.dataset.entryId);
                });
            });
        }

        async function selectDate(entryId) {
            selectedEntryId = entryId;
            // Update browser URL to reflect selection
            const url = new URL(window.location);
            url.searchParams.set('entry_id', entryId);
            url.searchParams.delete('date');  // drop legacy param when canonicalising
            history.replaceState(null, '', url);

            document.querySelectorAll('.date-item').forEach(el => {
                el.classList.toggle('selected', el.dataset.entryId === entryId);
            });
            document.getElementById('synopsis-panel').innerHTML = '<div class="loading">Loading...</div>';
            try {
                const {data} = await fetchJson(`/tjai/api/synopsis/content?entry_id=${encodeURIComponent(entryId)}`);
                if (data.error) {
                    document.getElementById('synopsis-panel').innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }
                const entryLink = `<a class="entry-link" href="/tjai/entry/?entry_id=${encodeURIComponent(entryId)}">[edit]</a>`;
                document.getElementById('synopsis-panel').innerHTML =
                    `<div class="synopsis-content">${data.content_html}</div>${entryLink}`;
                // Inject Rerun pill button at end of first line (header)
                const firstEl = document.querySelector('#synopsis-panel .synopsis-content > :first-child');
                if (firstEl) {
                    const btn = document.createElement('button');
                    btn.className = 'btn-rerun';
                    btn.textContent = 'Rerun';
                    btn.onclick = () => rerunSynopsis(entryId, btn);
                    firstEl.appendChild(btn);
                }
                // Append "All" link next to the "Today in History" heading — goes
                // to the date-specific all-history page generated by extract_history.py
                // (/var/www/public/today-in-history/<MM-DD>.html).
                const dateMatch = entryId.match(/^daily-(\d{4})-(\d{2})-(\d{2})$/);
                if (dateMatch) {
                    const mmdd = `${dateMatch[2]}-${dateMatch[3]}`;
                    for (const h of document.querySelectorAll('#synopsis-panel .synopsis-content h2')) {
                        if ((h.textContent || '').trim() === 'Today in History') {
                            const a = document.createElement('a');
                            a.href = `/public/today-in-history/${mmdd}.html?dark=1`;
                            a.textContent = 'All';
                            a.style.cssText = 'margin-left: 10px; font-size: 13px; color: #90caf9; text-decoration: none; border: 1px solid #555; padding: 2px 8px; border-radius: 3px; font-weight: normal;';
                            a.target = '_blank';
                            h.appendChild(a);
                            break;
                        }
                    }
                }
                focusContentArea();
            } catch (e) {
                document.getElementById('synopsis-panel').innerHTML = '<div class="error">Error loading synopsis</div>';
                focusContentArea();
            }
        }

        async function rerunSynopsis(entryId, btn) {
            btn.disabled = true;
            btn.textContent = 'Requesting...';
            try {
                const {resp, data} = await fetchJson('/tjai/api/synopsis/rerun', {
                    method: 'POST',
                    headers: {'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/x-www-form-urlencoded'},
                    body: 'entry_id=' + encodeURIComponent(entryId),
                });
                if (!resp.ok || data.error) {
                    btn.textContent = 'Failed';
                    alert('Rerun failed: ' + (data.error || 'Unknown error'));
                    return;
                }
                btn.textContent = 'Running...';
                // Poll for content update (agent runs async)
                let attempts = 0;
                const poll = setInterval(async () => {
                    attempts++;
                    if (attempts > 120) { clearInterval(poll); btn.textContent = 'Timeout'; return; }
                    try {
                        const {resp: cr, data: cd} = await fetchJson(`/tjai/api/synopsis/content?entry_id=${encodeURIComponent(entryId)}`);
                        if (cr.ok) {
                            // Check if content has grown beyond just the header
                            if (cd.content_html && cd.content_html.length > 100) {
                                clearInterval(poll);
                                const entryLink = `<a class="entry-link" href="/tjai/entry/?entry_id=${encodeURIComponent(entryId)}">[edit]</a>`;
                                document.getElementById('synopsis-panel').innerHTML =
                                    `<div class="synopsis-content">${cd.content_html}</div>${entryLink}`;
                                const firstEl = document.querySelector('#synopsis-panel .synopsis-content > :first-child');
                                if (firstEl) {
                                    const newBtn = document.createElement('button');
                                    newBtn.className = 'btn-rerun';
                                    newBtn.textContent = 'Rerun';
                                    newBtn.onclick = () => rerunSynopsis(entryId, newBtn);
                                    firstEl.appendChild(newBtn);
                                }
                            }
                        }
                    } catch(e) {}
                }, 5000);
            } catch (e) {
                btn.textContent = 'Error';
                alert('Rerun failed: ' + e.message);
            }
        }

        focusContentArea();
        fetchDates();
    </script>
</body>
</html>

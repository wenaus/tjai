<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/tjai/static/tjai/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>tjai</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/tjai/static/tjai/tjai-utils.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #1a1a1a);
            --fg: var(--tg-theme-text-color, #e0e0e0);
            --hint: var(--tg-theme-hint-color, #8a8a8a);
            --link: #c8d8ff;
            --btn-bg: var(--tg-theme-button-color, #5288c1);
            --btn-fg: var(--tg-theme-button-text-color, #fff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #232323);
            --accent: #d8a070;
            --green: #9ccc65;
            --purple: #ce93d8;
            --fs-body: 15px;  /* min body/narrative text — adjust this one value */
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --tabs-h: calc(41px + var(--safe-top));
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        a { color: var(--link); }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 15px;
            background: var(--bg);
            color: var(--fg);
            -webkit-text-size-adjust: 100%;
            overflow-x: hidden;
        }
        .tabs {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            background: var(--secondary-bg);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-top: var(--safe-top);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex: 0 0 auto;
            padding: 12px 10px;
            text-align: center;
            font-size: 13px;
            white-space: nowrap;
            font-weight: 600;
            color: var(--hint);
            border: none;
            background: none;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .tab.active {
            color: var(--link);
            border-bottom-color: var(--link);
        }
        .panel {
            display: none;
            padding: 12px 12px calc(12px + var(--safe-bottom));
            min-height: calc(100vh - 50px);
        }
        .panel.active { display: block; }
        .loading {
            text-align: center;
            color: var(--hint);
            padding: 40px 0;
        }
        .error-msg {
            text-align: center;
            color: #ef5350;
            padding: 40px 0;
        }

        /* Calendar */
        #panel-cal { font-size: 18px; }
        .day-header {
            color: var(--accent);
            font-weight: 600;
            margin-top: 16px;
            padding: 4px 0;
            font-size: 17px;
        }
        .day-header:first-child { margin-top: 4px; }
        .day-today { color: var(--green); }
        .week-header {
            color: var(--hint);
            font-size: 12px;
            margin-top: 20px;
            margin-bottom: 4px;
        }
        .cal-entry {
            padding: 6px 0 6px 12px;
            line-height: 1.4;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            min-height: 44px;
            display: flex;
            align-items: center;
        }
        .cal-time {
            color: var(--accent);
            min-width: 48px;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .cal-content { flex: 1; }
        .past-event { opacity: 0.5; }
        .past-event a { color: #90caf9; }
        .today-marker {
            background: rgba(100,181,246,0.08);
            border-left: 3px solid var(--link);
            padding-left: 9px;
        }

        /* Named entries */
        .named-entry {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            min-height: 44px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .named-entry:active { background: rgba(255,255,255,0.04); }
        .named-name {
            color: #c0d8f0;
            font-weight: 600;
        }
        .named-context {
            color: var(--purple);
            font-size: 13px;
        }
        .named-content {
            color: var(--hint);
            font-size: var(--fs-body);
            margin-top: 2px;
        }
        .detail-header {
            margin-bottom: 12px;
        }
        .detail-body {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: var(--fs-body);
            line-height: 1.6;
        }
        .detail-body a { color: var(--link); }
        .detail-body.pretty {
            white-space: normal;
        }
        .detail-body.pretty h1, .detail-body.pretty h2, .detail-body.pretty h3, .detail-body.pretty h4 {
            color: var(--accent);
            margin: 16px 0 8px;
        }
        .detail-body.pretty h1 { font-size: 18px; }
        .detail-body.pretty h2 { font-size: 17px; }
        .detail-body.pretty h3 { font-size: 16px; }
        .detail-body.pretty h4 { font-size: 15px; }
        .detail-body.research h1 { font-size: 20px; }
        .detail-body.research h2 { font-size: 19px; }
        .detail-body.research h3 { font-size: 18px; }
        .detail-body.research h4 { font-size: 17px; }
        .detail-body.research { font-size: 17px; }
        .detail-body.pretty ul, .detail-body.pretty ol { padding-left: 20px; margin: 8px 0; }
        .detail-body.pretty li { margin-bottom: 4px; }
        .detail-body.pretty p { margin: 8px 0; }
        .detail-body.pretty code {
            background: var(--secondary-bg);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 14px;
        }
        .detail-body.pretty pre {
            background: var(--secondary-bg);
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .detail-body.pretty pre code { background: none; padding: 0; }
        .detail-body.pretty blockquote {
            border-left: 3px solid var(--hint);
            padding-left: 12px;
            color: var(--hint);
            margin: 8px 0;
        }
        .detail-edit-area {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: var(--secondary-bg);
            color: var(--fg);
            font-size: var(--fs-body);
            font-family: inherit;
            line-height: 1.5;
            resize: vertical;
        }
        .detail-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .detail-actions button {
            background: var(--secondary-bg);
            color: var(--fg);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            min-height: 36px;
        }
        .detail-actions button.primary {
            background: var(--btn-bg);
            color: var(--btn-fg);
            border-color: var(--btn-bg);
        }
        .detail-actions button.active {
            color: var(--link);
            border-color: var(--link);
        }
        .detail-overlay {
            position: fixed;
            top: var(--tabs-h);
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 50;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px 12px calc(12px + var(--safe-bottom));
        }
        .detail-close {
            float: right;
            font-size: 22px;
            color: var(--hint);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
        }

        /* Contexts */
        .context-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            min-height: 44px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .context-item:active { background: rgba(255,255,255,0.04); }
        .context-name {
            flex: 1;
            color: var(--purple);
            font-weight: 600;
        }
        .context-count {
            color: var(--hint);
            font-size: 13px;
        }
        .context-back {
            display: flex;
            align-items: center;
            padding: 10px 0 14px;
            color: var(--link);
            font-weight: 600;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .context-back::before {
            content: "\2190";
            margin-right: 6px;
        }
        .context-title {
            color: var(--purple);
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
        }

        /* Entry list (shared for context entries and search) */
        .entry-item {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            min-height: 44px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .entry-item:active { background: rgba(255,255,255,0.04); }
        .entry-first-line { line-height: 1.4; }
        .entry-meta {
            font-size: 12px;
            color: var(--hint);
            margin-top: 2px;
        }
        .entry-kind {
            color: var(--accent);
        }
        .entry-tag {
            color: var(--green);
        }
        .entry-name-badge {
            color: #c0d8f0;
            font-weight: 600;
        }
        .entry-lines {
            color: var(--hint);
        }

        /* Expanded content */
        .entry-expanded {
            padding: 8px 12px;
            margin: 4px 0 8px;
            background: var(--secondary-bg);
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: var(--fs-body);
            line-height: 1.5;
        }
        .entry-expanded a { color: var(--link); }

        /* Search */
        .search-box {
            position: sticky;
            top: 48px;
            z-index: 90;
            padding: 8px 0 12px;
            background: var(--bg);
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            background: var(--secondary-bg);
            color: var(--fg);
            font-size: 15px;
            outline: none;
        }
        .search-input::placeholder { color: var(--hint); }
        .search-input:focus { border-color: var(--link); }

        /* Picks */
        .run-block { margin-bottom: 16px; }
        .run-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 13px;
            color: var(--hint);
        }
        .run-time { color: var(--accent); font-weight: 600; }
        .run-stats { flex: 1; }
        .run-block > .run-header:first-child {
            position: sticky;
            top: var(--tabs-h);
            background: var(--bg);
            z-index: 10;
        }
        .run-header button {
            background: var(--secondary-bg);
            color: var(--fg);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .run-header button.done { opacity: 0.4; }
        .pick-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .pick-item.archived { opacity: 0.35; }
        .pick-item.kept { border-left: 3px solid var(--green); padding-left: 9px; }
        .pick-title a { color: var(--link); font-weight: 600; font-size: 15px; }
        .pick-source { font-size: 12px; color: var(--hint); margin-top: 2px; }
        .pick-precis { font-size: var(--fs-body); margin-top: 4px; line-height: 1.4; }
        .pick-rationale { font-size: var(--fs-body); color: var(--hint); margin-top: 4px; font-style: italic; }
        .pick-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        .pick-actions button {
            background: var(--secondary-bg);
            color: var(--fg);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            min-height: 36px;
            -webkit-tap-highlight-color: transparent;
        }
        .pick-actions .active-up { color: var(--green); border-color: var(--green); }
        .pick-actions .active-down { color: #ef5350; border-color: #ef5350; }
        .pick-actions .active-keep { color: var(--green); border-color: var(--green); font-weight: 700; }
        .pick-actions .active-readme { color: var(--accent); border-color: var(--accent); }
        .picks-stats {
            font-size: 13px;
            color: var(--hint);
            padding: 4px 0 8px;
        }

        /* ReadMe */
        .readme-count {
            font-size: 13px;
            color: var(--hint);
            padding: 4px 0 8px;
        }
        .readme-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .readme-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .readme-title a { color: #c8d8ff; font-weight: 600; font-size: 17px; flex: 1; }
        .readme-title button {
            background: var(--secondary-bg);
            color: var(--hint);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .readme-detail { font-size: 12px; color: var(--fg); margin-top: 2px; }
        .readme-precis { font-size: var(--fs-body); margin-top: 4px; line-height: 1.4; }

        /* Synopsis */
        .syn-dates {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 4px 0 12px;
        }
        .syn-date {
            background: var(--secondary-bg);
            color: var(--fg);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .syn-date.today { color: var(--green); border-color: var(--green); }
        .syn-date.selected { color: var(--link); border-color: var(--link); background: rgba(100,181,246,0.12); }
        .syn-content {
            line-height: 1.6;
            font-size: 15px;
        }
        .syn-content h1, .syn-content h2, .syn-content h3 {
            color: var(--accent);
            margin: 16px 0 8px;
            font-size: 16px;
        }
        .syn-content ul, .syn-content ol { padding-left: 20px; }
        .syn-content li { margin-bottom: 4px; }
        .syn-content a { color: var(--link); }

        /* RSS */
        .rss-stats {
            font-size: 13px;
            color: var(--hint);
            padding: 4px 0 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .rss-stats button {
            background: var(--secondary-bg);
            color: var(--fg);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .category-header {
            color: var(--accent);
            font-weight: 700;
            font-size: 15px;
            margin-top: 16px;
            padding: 4px 0;
            text-transform: capitalize;
            position: sticky;
            top: var(--tabs-h);
            background: var(--bg);
            z-index: 10;
        }
        .source-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 13px;
            position: sticky;
            top: calc(var(--tabs-h) + 26px);
            background: var(--bg);
            z-index: 9;
        }
        .source-name { color: var(--purple); font-weight: 600; flex: 1; }
        .source-count { color: var(--hint); }
        .source-header button {
            background: var(--secondary-bg);
            color: var(--fg);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
        }
        .rss-item {
            padding: 8px 0 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .rss-item.read { opacity: 0.35; }
        .rss-title {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .rss-title a { color: #c8d8ff; flex: 1; font-size: 17px; font-weight: 600; }
        .rss-title button {
            background: var(--secondary-bg);
            color: var(--fg);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .rss-title .active-readme { color: var(--accent); border-color: var(--accent); }
        .rss-meta { font-size: 12px; color: var(--fg); margin-top: 2px; }
        .rss-precis { font-size: var(--fs-body); color: var(--fg); margin-top: 2px; line-height: 1.3; }
        .feed-bottom-btn {
            background: var(--secondary-bg);
            color: var(--fg);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
        }

        /* Research */
        .research-item {
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 3px solid #333;
            background: var(--secondary-bg);
            border-radius: 0 3px 3px 0;
        }
        .research-item.done { border-left-color: #4caf50; }
        .research-item.pending { border-left-color: var(--link); }
        .research-item.running { border-left-color: #ffd54f; }
        .research-eid { color: var(--accent); font-size: 15px; font-weight: 600; }
        .research-status {
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 3px;
            margin-left: 8px;
        }
        .rstatus-pending { background: #1a3a5c; color: #90caf9; }
        .rstatus-running { background: rgba(255, 213, 79, 0.15); color: #ffd54f; }
        .rstatus-done { background: #1a3c1a; color: #4caf50; }
        .research-topic { color: var(--fg); font-size: var(--fs-body); margin-top: 4px; }
        .research-meta { color: var(--hint); font-size: 12px; margin-top: 4px; }
        .research-agent {
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 13px;
            border-radius: 6px;
        }
        .research-agent.idle { background: var(--secondary-bg); color: var(--hint); }
        .research-agent.running { background: rgba(255, 213, 79, 0.1); color: #ffd54f; }
        .research-stats { color: var(--hint); font-size: 12px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab" data-tab="cal">Cal</button>
        <button class="tab" data-tab="syn">Daily</button>
        <button class="tab" data-tab="all">All</button>
        <button class="tab" data-tab="picks">Pick</button>
        <button class="tab" data-tab="readme">Read</button>
        <button class="tab" data-tab="rss">RSS</button>
        <button class="tab active" data-tab="named">@</button>
        <button class="tab" data-tab="ctx">=</button>
        <button class="tab" data-tab="research">?</button>
        <button class="tab" data-tab="search">&#x1F50D;</button>
    </div>

    <div id="panel-cal" class="panel">
        <div class="loading">Loading...</div>
    </div>
    <div id="panel-named" class="panel active">
        <div class="loading">Loading...</div>
    </div>
    <div id="panel-ctx" class="panel">
        <div class="loading">Loading...</div>
    </div>
    <div id="panel-picks" class="panel">
        <div class="loading">Loading picks...</div>
    </div>
    <div id="panel-readme" class="panel">
        <div class="loading">Loading reading list...</div>
    </div>
    <div id="panel-syn" class="panel">
        <div class="loading">Loading synopsis...</div>
    </div>
    <div id="panel-all" class="panel">
        <div class="loading">Loading entries...</div>
    </div>
    <div id="panel-rss" class="panel">
        <div class="loading">Loading RSS...</div>
    </div>
    <div id="panel-research" class="panel">
        <div class="loading">Loading research...</div>
    </div>
    <div id="panel-search" class="panel">
        <div class="search-box">
            <input type="search" class="search-input" id="search-input" placeholder="Search entries..." enterkeyhint="search">
        </div>
        <div id="search-results"></div>
    </div>

    <script>
    const tg = window.Telegram?.WebApp;
    let authenticated = false;
    const loaded = {};  // track which tabs have loaded
    const DEFAULT_NAMED_ENTRY = 'shopping';
    let defaultNamedEntryPending = true;
    let activeTab = 'named';
    let lastForegroundRefresh = 0;
    let ctxLevel = 'list';  // 'list' or 'entries'

    // --- Init ---
    async function init() {
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Authenticate
        const initData = tg?.initData || '';
        if (initData) {
            try {
                const resp = await fetch('/tjai/api/tg-auth', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({initData})
                });
                const data = await resp.json();
                if (data.status === 'ok') {
                    authenticated = true;
                } else {
                    showError('panel-cal', 'Auth failed: ' + (data.error || 'unknown'));
                    return;
                }
            } catch (e) {
                showError('panel-cal', 'Auth error: ' + e.message);
                return;
            }
        }
        // If no initData (testing in browser), assume session cookie exists

        // Load @Shopping as the default landing place.
        loadTab('named');

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => switchTab(tab.dataset.tab));
        });

        // Search
        document.getElementById('search-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') doSearch();
        });

        // Telegram BackButton
        if (tg?.BackButton) {
            tg.BackButton.onClick(() => {
                if (ctxLevel === 'entries') {
                    ctxLevel = 'list';
                    tg.BackButton.hide();
                    loadContextList();
                }
            });
        }

        window.addEventListener('focus', refreshForegroundData);
        window.addEventListener('pageshow', refreshForegroundData);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) refreshForegroundData();
        });
    }

    function switchTab(id) {
        activeTab = id;
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === id));
        document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));

        if (tg?.BackButton) {
            if (id === 'ctx' && ctxLevel === 'entries') {
                tg.BackButton.show();
            } else {
                tg.BackButton.hide();
            }
        }

        if (id === 'search') {
            setTimeout(() => document.getElementById('search-input').focus(), 100);
        }

        loadTab(id);

        // Re-scroll to today when returning to calendar tab
        if (id === 'cal' && loaded['cal']) {
            scrollToToday_();
        }

        // Close any open detail overlay
        const existing = document.getElementById('detail-overlay');
        if (existing) existing.remove();
    }

    function loadTab(id, force) {
        if (loaded[id] && !force) return;
        loaded[id] = true;
        if (id === 'cal') loadCalendar();
        else if (id === 'all') loadAll();
        else if (id === 'named') loadNamed();
        else if (id === 'ctx') loadContextList();
        else if (id === 'picks') loadPicks();
        else if (id === 'readme') loadReadme();
        else if (id === 'syn') loadSynopsis();
        else if (id === 'rss') loadRss();
        else if (id === 'research') loadResearch();
    }

    function refreshForegroundData() {
        if (document.hidden) return;
        if (document.getElementById('detail-edit-textarea')) return;
        const now = Date.now();
        if (now - lastForegroundRefresh < 3000) return;
        lastForegroundRefresh = now;
        loadTab(activeTab, true);
        if (_detailEntry && _detailEntry.id) refreshOpenDetail(_detailEntry.id);
    }

    function showError(panelId, msg) {
        document.getElementById(panelId).innerHTML = `<div class="error-msg">${escapeHtml(msg)}</div>`;
    }

    // --- Helpers ---
    // escapeHtml and linkifyContent provided by tjai-utils.js

    // formatTimestamp removed — server provides date_display

    async function toggleExpand(el, entryId) {
        const existing = el.querySelector('.entry-expanded');
        if (existing) {

    // --- Calendar ---
    function scrollToToday_() {
        requestAnimationFrame(() => {
            const anchor = document.getElementById('today-anchor');
            if (anchor) {
                const tabs = document.querySelector('.tabs');
                const tabsH = tabs ? tabs.offsetHeight : 0;
                const y = anchor.getBoundingClientRect().top + window.scrollY - tabsH - 30;
                window.scrollTo(0, Math.max(0, y));
            }
        });
    }

    async function loadCalendar() {
        const panel = document.getElementById('panel-cal');
        try {
            const resp = await fetch('/tjai/api/dashboard/calendar');
            const data = await resp.json();
            renderCalendar(panel, data);
        } catch (e) {
            showError('panel-cal', 'Failed to load calendar');
        }
    }

    function renderCalendar(panel, data) {
        const now = data.server_time || (Date.now() / 1000);
        const todayKey = data.today_date;
        let entries = data.entries.slice();

        // Inject today placeholder if missing
        if (todayKey && !entries.some(e => e.date_key === todayKey)) {
            entries.push({
                id: '__placeholder__', content: '', event_date: now,
                date_key: todayKey,
                date_display: data.today_date_display || todayKey,
                time_display: null, week_num: 0, week_start_key: '0',
                context: null, data: {_placeholder: true}
            });
            // Re-sort: within same day, all-day items first, then by time
            entries.sort((a, b) => {
                if (a.date_key !== b.date_key) return a.date_key < b.date_key ? -1 : 1;
                const aAllday = a.time_display ? 1 : 0;
                const bAllday = b.time_display ? 1 : 0;
                if (aAllday !== bAllday) return aAllday - bAllday;
                return a.event_date - b.event_date;
            });
        }

        let html = '';
        let lastWeek = '', lastDay = '';
        let todayAnchor = false;

        for (const entry of entries) {
            // Week header
            if (entry.week_start_key !== lastWeek) {
                lastWeek = entry.week_start_key;
                html += `<div class="week-header">Week ${entry.week_num}</div>`;
            }

            // Day header
            if (entry.date_key !== lastDay) {
                lastDay = entry.date_key;
                const isToday = entry.date_key === todayKey;
                const todayId = (isToday && !todayAnchor) ? ' id="today-anchor"' : '';
                if (isToday) todayAnchor = true;
                html += `<div${todayId} class="day-header${isToday ? ' day-today' : ''}">${escapeHtml(entry.date_display)}</div>`;
            }

            if (entry.data?._placeholder) continue;

            const isToday = entry.date_key === todayKey;
            const isPast = entry.event_date < now && !entry.data?.clock && !isToday;
            let cls = 'cal-entry';
            if (isPast) cls += ' past-event';
            if (isToday) cls += ' today-marker';

            const timeStr = entry.time_display || '';
            const isAnnual = entry.data?.annual;
            const isSynopsis = entry.data?.entry_id && entry.data.entry_id.startsWith('daily-');
            const ctx = entry.context ? ` <span class="named-context">=${entry.context}</span>` : '';

            let contentHtml;
            if (isSynopsis) {
                contentHtml = `<a href="#" onclick="event.preventDefault();openSynopsis('${escapeHtml(entry.data.entry_id)}')">Daily Synopsis</a>`;
            } else {
                contentHtml = linkifyContent(escapeHtml(entry.content));
            }

            const contentStyle = isAnnual ? ' style="color:#d47ab0"' : '';
            html += `<div class="${cls}"${isSynopsis ? '' : ` onclick="toggleExpand(this,'${entry.id}')"`}>`;
            html += `<span class="cal-time">${escapeHtml(timeStr)}</span>`;
            html += `<span class="cal-content"${contentStyle}>${contentHtml}${ctx}</span>`;
            html += `</div>`;
        }

        panel.innerHTML = html || '<div class="loading">No events</div>';

        scrollToToday_();
    }

    // --- All entries ---
    async function loadAll() {
        const panel = document.getElementById('panel-all');
        try {
            const resp = await fetch('/tjai/api/dashboard/status');
            const data = await resp.json();

    // --- Named ---
    async function loadNamed() {
        const panel = document.getElementById('panel-named');
        try {
            const resp = await fetch(`/tjai/api/dashboard/named?ts=${Date.now()}`, {cache: 'no-store'});
            const data = await resp.json();
            renderNamed(panel, data);
        } catch (e) {
            showError('panel-named', 'Failed to load named entries');
        }
    }

    function renderNamed(panel, data) {
        // Modtime order, newest first (API returns alphabetical)
        const entries = [...data.entries].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        let html = '';
        for (const entry of entries) {
            const ctx = entry.context ? ` <span class="named-context">=${entry.context}</span>` : '';
            const lines = entry.line_count > 1 ? ` <span class="entry-lines">[${entry.line_count}]</span>` : '';
            html += `<div class="named-entry" onclick="openEntryDetail('${entry.id}')">`;
            html += `<span class="named-name">@${escapeHtml(entry.name)}</span>${ctx}${lines}`;
            html += `<div class="named-content">${linkifyContent(escapeHtml(entry.content))}</div>`;
            html += `</div>`;
        }
        panel.innerHTML = html || '<div class="loading">No named entries</div>';

        if (defaultNamedEntryPending) {
            defaultNamedEntryPending = false;
            const defaultEntry = entries.find(entry =>
                (entry.name || '').toLowerCase() === DEFAULT_NAMED_ENTRY
            );
            if (defaultEntry) openEntryDetail(defaultEntry.id);
        }
    }

    // --- Research ---
    async function loadResearch() {
        const panel = document.getElementById('panel-research');
        try {
            const resp = await fetch('/tjai/api/research/data');
            const data = await resp.json();
            if (data.error) {
                panel.innerHTML = `<div class="error-msg">${escapeHtml(data.error)}</div>`;
                return;
            }
            renderResearch(panel, data);
        } catch (e) {
            panel.innerHTML = '<div class="error-msg">Error loading research</div>';
        }
    }

    function renderResearch(panel, data) {
        const agent = data.agent || {};
        const items = data.items || [];
        let html = '';

        // Agent banner
        if (agent.status === 'running') {
            const currentItem = items.find(i => i.id === agent.current_entry);
            const name = currentItem ? (currentItem.entry_id || currentItem.id.substring(0, 8)) : '...';
            html += `<div class="research-agent running">Agent: running ${escapeHtml(name)}</div>`;
        } else {
            html += `<div class="research-agent idle">Agent: idle</div>`;
        }

        // Stats
        const pending = items.filter(i => i.status !== 'done').length;
        const done = items.filter(i => i.status === 'done').length;
        html += `<div class="research-stats">${items.length} topics, ${pending} pending, ${done} completed</div>`;

        // Items
        for (const item of items) {
            const isRunning = agent.status === 'running' && item.id === agent.current_entry && item.status !== 'done';
            const cls = item.status === 'done' ? 'done' : isRunning ? 'running' : 'pending';
            const statusCls = item.status === 'done' ? 'rstatus-done' : isRunning ? 'rstatus-running' : 'rstatus-pending';
            const label = item.status === 'done' ? 'done' : isRunning ? 'running' : 'pending';

            html += `<div class="research-item ${cls}" onclick="openEntryDetail('${item.id}')">`;
            const eid = (item.entry_id || item.id.substring(0, 8)).replace(/^research-/, '');
            html += `<span class="research-eid">${escapeHtml(eid)}</span>`;
            html += `<span class="research-status ${statusCls}">${label}</span>`;
            const topic = item.content.split('\n')[0];
            html += `<div class="research-topic">${escapeHtml(topic)}</div>`;
            let meta = '';
            if (item.status === 'done' && item.modified_ago) {
                meta = 'Completed ' + item.modified_ago;
            } else if (item.created_display) {
                meta = 'Created ' + item.created_display;
            }
            if (meta) html += `<div class="research-meta">${meta}</div>`;
            html += `</div>`;
        }

        if (items.length === 0) {
            html += '<div class="loading">No research topics queued.</div>';
        }

        panel.innerHTML = html;
    }

    // --- Shared entry rendering ---
    function renderEntryList(entries, panelId) {
        let html = '';
        for (const e of entries) {
            const kind = e.kind !== 'memory' ? `<span class="entry-kind">[${e.kind}]</span> ` : '';
            const name = e.name ? `<span class="entry-name-badge">@${escapeHtml(e.name)}</span> ` : '';
            const ctx = e.context ? `<span class="named-context">=${e.context}</span> ` : '';
            const lines = e.line_count > 1 ? `<span class="entry-lines">[${e.line_count}]</span> ` : '';
            const tags = (e.tags || []).map(t => `<span class="entry-tag">:${escapeHtml(t)}</span>`).join(' ');
            const content = linkifyContent(escapeHtml(e.content));

            html += `<div class="entry-item" onclick="openEntryDetail('${e.id}')">`;
            html += `<div class="entry-first-line">${name}${content}</div>`;
            html += `<div class="entry-meta">${kind}${ctx}${lines}${tags ? tags + ' ' : ''}${(e.date_display || '')}</div>`;
            html += `</div>`;
        }
        return html;
    }

    // --- Detail overlay ---
    let _detailEntry = null;  // current entry data for the overlay

    function closeDetail() {
        const ov = document.getElementById('detail-overlay');
        if (ov) ov.remove();
        _detailEntry = null;
    }

    async function openEntryDetail(entryId) {
        // Remove any existing overlay
        closeDetail();
        // Create overlay with loading state
        const ov = document.createElement('div');
        ov.id = 'detail-overlay';
        ov.className = 'detail-overlay';
        ov.innerHTML = '<div class="loading">Loading...</div>';
        document.body.appendChild(ov);
        try {
            const resp = await fetch(`/tjai/api/entry/${entryId}/content?ts=${Date.now()}`, {cache: 'no-store'});
            if (!resp.ok) { closeDetail(); return; }
            const data = await resp.json();
            _detailEntry = data;
            renderDetail(data);
        } catch (e) {
            closeDetail();
        }
    }

    async function refreshOpenDetail(entryId) {
        try {
            const resp = await fetch(`/tjai/api/entry/${entryId}/content?ts=${Date.now()}`, {cache: 'no-store'});
            if (!resp.ok) return;
            const data = await resp.json();
            _detailEntry = data;
            renderDetail(data);
        } catch (e) {
            showToast('Refresh failed');
        }
    }

    function renderDetail(data) {
        const ov = document.getElementById('detail-overlay');
        if (!ov) return;
        const name = data.name ? `<span class="named-name">@${escapeHtml(data.name)}</span> ` : '';
        const eid = (!data.name && data.entry_id) ? `<span class="research-eid">${escapeHtml(data.entry_id.replace(/^research-/, ''))}</span> ` : '';
        const ctx = data.context ? `<span class="named-context">=${data.context}</span> ` : '';
        const kind = data.kind !== 'memory' ? `<span class="entry-kind">[${data.kind}]</span> ` : '';
        const tags = (data.tags || []).map(t => `<span class="entry-tag">:${escapeHtml(t)}</span>`).join(' ');

        let html = `<button class="detail-close" onclick="closeDetail()">&times;</button>`;
        html += `<div class="detail-header">${name}${eid}${ctx}${kind}${tags}</div>`;
        html += `<div id="detail-content" class="detail-body">${linkifyContent(escapeHtml(data.content))}</div>`;
        html += `<div class="detail-actions">`;
        html += `<button onclick="editEntry('${data.id}')">Edit</button>`;
        html += `<button id="btn-pretty" onclick="togglePretty()">Prettify</button>`;
        html += `<button onclick="closeDetail()">Close</button>`;
        html += `</div>`;
        ov.innerHTML = html;
        _detailEntry = data;
        // Auto-prettify research items with larger fonts
        if ((data.tags || []).includes('research_topic')) {
            togglePretty();
            const dc = document.getElementById('detail-content');
            if (dc) dc.classList.add('research');
        }
    }

    function togglePretty() {
        try {
            const el = document.getElementById('detail-content');
            const btn = document.getElementById('btn-pretty');
            if (!el || !_detailEntry) { showToast('Prettify: no content'); return; }
            if (el.classList.contains('pretty')) {
                el.className = 'detail-body';
                el.innerHTML = linkifyContent(escapeHtml(_detailEntry.content));
                btn.classList.remove('active');
                btn.textContent = 'Prettify';
            } else {
                el.className = 'detail-body pretty';
                el.innerHTML = renderMarkdown(_detailEntry.content);
                btn.classList.add('active');
                btn.textContent = 'Markdown';
            }
        } catch (e) {
            showToast('Prettify error: ' + e.message);
        }
    }

    function renderMarkdown(text) {
        let html = escapeHtml(text);
        html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
        html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
        html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
        html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
        html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
        html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
        html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
        html = html.replace(/\n\n/g, '</p><p>');
        html = '<p>' + html + '</p>';
        html = html.replace(/<p><(h[1234]|ul|pre|blockquote)/g, '<$1');
        html = html.replace(/<\/(h[1234]|ul|pre|blockquote)><\/p>/g, '</$1>');
        html = html.replace(/<p><\/p>/g, '');
        return html;
    }

    function editEntry(entryId) {
        if (!_detailEntry) return;
        const ov = document.getElementById('detail-overlay');
        if (!ov) return;

        const contentEl = document.getElementById('detail-content');
        const actionsEl = ov.querySelector('.detail-actions');

        contentEl.outerHTML = `<textarea id="detail-edit-textarea" class="detail-edit-area">${escapeHtml(_detailEntry.content)}</textarea>`;
        actionsEl.innerHTML = `<button class="primary" onclick="saveEntry('${entryId}')">Save</button><button onclick="renderDetail(_detailEntry)">Cancel</button>`;

        const ta = document.getElementById('detail-edit-textarea');
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
    }

    async function saveEntry(entryId) {
        const ta = document.getElementById('detail-edit-textarea');
        if (!ta) return;
        const content = ta.value;

        try {
            const resp = await fetch(`/tjai/api/entry/${entryId}/save`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                body: JSON.stringify({content: content})
            });
            if (!resp.ok) {
                showToast('Save failed');
                return;
            }
            showToast('Saved');
            _detailEntry.content = content;
            renderDetail(_detailEntry);
            // Invalidate loaded tabs so lists refresh with updated content
            Object.keys(loaded).forEach(k => delete loaded[k]);
        } catch (e) {
            showToast('Save failed');
        }
    }

    // --- Helpers ---
    function getCsrf() {
        const c = document.cookie.match(/csrftoken=([^;]+)/);
        return c ? c[1] : '';
    }

    function showToast(msg) {
        const t = document.createElement('div');
        t.textContent = msg;
        t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:10px 20px;border-radius:6px;font-size:14px;z-index:9999;opacity:0;transition:opacity 0.3s';
        document.body.appendChild(t);
        requestAnimationFrame(() => t.style.opacity = '1');
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2000);
    }

    // --- Picks ---
    let allRuns = [];

    async function loadPicks() {
        const panel = document.getElementById('panel-picks');
        try {
            const resp = await fetch('/tjai/api/picks/data');
            const data = await resp.json();
            if (data.error) {
                panel.innerHTML = `<div class="error-msg">${escapeHtml(data.error)}</div>`;
                return;
            }
            allRuns = data.runs || [];
            renderPicks();
        } catch (e) {
            panel.innerHTML = '<div class="error-msg">Error loading picks</div>';
        }
    }

    function renderPicks() {
        const panel = document.getElementById('panel-picks');
        if (allRuns.length === 0) {
            panel.innerHTML = '<div class="loading">No picks yet.</div>';
            return;
        }

        let totalActive = 0, totalKept = 0;
        for (const run of allRuns) {
            for (const p of run.picks) {
                if (p.kept) totalKept++;
                else if (!p.archived) totalActive++;
            }
        }

        let html = `<div class="picks-stats">${totalActive} to review, ${totalKept} kept</div>`;
        for (const run of allRuns) {
            const runId = run.run;
            const picks = run.picks;
            const activeCount = picks.filter(p => !p.archived && !p.kept).length;
            const keptCount = picks.filter(p => p.kept).length;
            const allDone = activeCount === 0;

            // Fully processed with nothing kept — skip entirely
            if (allDone && keptCount === 0) continue;

            // Which picks to show: if fully processed, only kept items
            const visiblePicks = allDone ? picks.filter(p => p.kept) : picks;

            html += `<div class="run-block" data-run="${escapeHtml(runId)}">`;
            html += '<div class="run-header">';
            html += `<span class="run-time">${escapeHtml(run.run_display || runId)}</span>`;
            html += `<span class="run-stats">${picks.length} picks, ${keptCount} kept</span>`;
            if (!allDone) {
                html += `<button onclick="archiveRun('${escapeHtml(runId)}')">Archive All</button>`;
            } else {
                html += `<button class="done" disabled>All reviewed</button>`;
            }
            html += '</div>';

            for (const pick of visiblePicks) {
                const classes = ['pick-item'];
                if (pick.archived) classes.push('archived');
                if (pick.kept) classes.push('kept');

                html += `<div class="${classes.join(' ')}" id="pick-${pick.id}">`;
                html += `<div class="pick-title"><a href="${escapeHtml(pick.url)}" target="_blank" rel="noopener" onclick="markViewed('${pick.id}', this)">${escapeHtml(pick.title)}</a></div>`;
                if (pick.source) html += `<div class="pick-source">${escapeHtml(pick.source)}</div>`;
                html += `<div class="pick-precis">${escapeHtml(pick.precis)}</div>`;
                if (pick.rationale) html += `<div class="pick-rationale">Why: ${escapeHtml(pick.rationale)}</div>`;
                html += '<div class="pick-actions">';
                html += `<button class="${pick.thumbs === 'up' ? 'active-up' : ''}" onclick="setThumbs('${pick.id}', 'up', this)">\u25B2</button>`;
                html += `<button class="${pick.thumbs === 'down' ? 'active-down' : ''}" onclick="setThumbs('${pick.id}', 'down', this)">\u25BC</button>`;
                html += `<button class="${pick.kept ? 'active-keep' : ''}" onclick="togglePickKeep('${pick.id}', ${!pick.kept}, this)">Keep</button>`;
                html += `<button class="${pick.readme ? 'active-readme' : ''}" onclick="togglePickReadme('${pick.id}', this)">ReadMe</button>`;
                html += '</div></div>';
            }
            if (!allDone) {
                html += `<div class="run-header" style="border:none;margin-top:8px;padding:0"><button onclick="archiveRun('${escapeHtml(runId)}')">Archive All</button></div>`;
            }
            html += '</div>';
        }
        panel.innerHTML = html;
    }

    function findPick(id) {
        for (const run of allRuns) {
            const p = run.picks.find(p => p.id === id);
            if (p) return p;
        }
        return null;
    }

    async function updatePick(entryId, field, value) {
        const resp = await fetch('/tjai/api/picks/update', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
            body: JSON.stringify({entry_id: entryId, field, value}),
        });
        const data = await resp.json();
        if (data.error) console.error('Update failed:', data.error);
        return data;
    }

    function markViewed(id, linkEl) {
        const pick = findPick(id);
        if (!pick || pick.archived || pick.kept) return;
        pick.archived = true;
        updatePick(id, 'archived', true);
        const el = document.getElementById('pick-' + id);
        if (el) el.classList.add('archived');
        updatePickStats();
        updateRunHeaders();
    }

    function setThumbs(id, direction, btn) {
        const pick = findPick(id);
        if (!pick) return;
        const newVal = pick.thumbs === direction ? null : direction;
        pick.thumbs = newVal;
        updatePick(id, 'thumbs', newVal);
        const actions = btn.parentElement;
        actions.children[0].className = newVal === 'up' ? 'active-up' : '';
        actions.children[1].className = newVal === 'down' ? 'active-down' : '';
    }

    function togglePickReadme(id, btn) {
        const pick = findPick(id);
        if (!pick) return;
        const newVal = !pick.readme;
        pick.readme = newVal;
        updatePick(id, 'readme', newVal);
        btn.className = newVal ? 'active-readme' : '';
    }

    function togglePickKeep(id, keepVal, btn) {
        const pick = findPick(id);
        if (!pick) return;
        pick.kept = keepVal;
        if (keepVal) pick.archived = false;
        updatePick(id, 'kept', keepVal);
        const el = document.getElementById('pick-' + id);
        if (el) {
            el.classList.toggle('kept', keepVal);
            if (keepVal) el.classList.remove('archived');
        }
        btn.className = keepVal ? 'active-keep' : '';
        updatePickStats();
        updateRunHeaders();
    }

    async function archiveRun(runId) {
        const block = document.querySelector(`.run-block[data-run="${CSS.escape(runId)}"]`);
        const btns = block ? block.querySelectorAll('.run-header button') : [];
        btns.forEach(b => { b.textContent = '...'; b.disabled = true; });
        try {
            const resp = await fetch('/tjai/api/picks/archive-run', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                body: JSON.stringify({run_id: runId}),
            });
            const data = await resp.json();
            if (data.error) {
                alert('Archive failed: ' + data.error);
                btns.forEach(b => { b.textContent = 'Archive All'; b.disabled = false; });
                return;
            }
        } catch (e) {
            alert('Archive failed: ' + e.message);
            btns.forEach(b => { b.textContent = 'Archive All'; b.disabled = false; });
            return;
        }
        const run = allRuns.find(r => r.run === runId);
        if (run) {
            for (const p of run.picks) {
                if (!p.kept) {
                    p.archived = true;
                    const el = document.getElementById('pick-' + p.id);
                    if (el) el.classList.add('archived');
                }
            }
        }
        updatePickStats();
        updateRunHeaders();
    }

    function updatePickStats() {
        let active = 0, kept = 0;
        for (const run of allRuns) {
            for (const p of run.picks) {
                if (p.kept) kept++;
                else if (!p.archived) active++;
            }
        }
        const el = document.querySelector('.picks-stats');
        if (el) el.textContent = `${active} to review, ${kept} kept`;
    }

    function updateRunHeaders() {
        for (const run of allRuns) {
            const block = document.querySelector(`.run-block[data-run="${CSS.escape(run.run)}"]`);
            if (!block) continue;
            const activeCount = run.picks.filter(p => !p.archived && !p.kept).length;
            const keptCount = run.picks.filter(p => p.kept).length;
            const allDone = activeCount === 0;
            // Fully processed, nothing kept — remove entire block
            if (allDone && keptCount === 0) {
                block.remove();
                continue;
            }
            // Fully processed with kept items — hide archived, keep the kept visible
            if (allDone) {
                block.querySelectorAll('.pick-item.archived').forEach(el => el.remove());
            }
            const statsEl = block.querySelector('.run-stats');
            if (statsEl) statsEl.textContent = `${run.picks.length} picks, ${keptCount} kept`;
            // Update all Archive All buttons (header + bottom)
            block.querySelectorAll('.run-header button').forEach(btn => {
                if (allDone) {
                    btn.className = 'done';
                    btn.disabled = true;
                    btn.textContent = 'All reviewed';
                    btn.onclick = null;
                } else {
                    btn.className = '';
                    btn.disabled = false;
                    btn.textContent = 'Archive All';
                }
            });
        }
    }

    // --- ReadMe ---
    let readmeItems = [];

    async function loadReadme() {
        const panel = document.getElementById('panel-readme');
        try {
            const resp = await fetch('/tjai/api/readme/data');
            const data = await resp.json();
            if (data.error) {
                panel.innerHTML = `<div class="error-msg">${escapeHtml(data.error)}</div>`;
                return;
            }
            readmeItems = data.items || [];
            renderReadme();
        } catch (e) {
            panel.innerHTML = '<div class="error-msg">Error loading reading list</div>';
        }
    }

    function renderReadme() {
        const panel = document.getElementById('panel-readme');
        if (readmeItems.length === 0) {
            panel.innerHTML = '<div class="loading">Reading list is empty.</div>';
            return;
        }
        let html = `<div class="readme-count">${readmeItems.length} item${readmeItems.length !== 1 ? 's' : ''} to read</div>`;
        for (const item of readmeItems) {
            html += `<div class="readme-item" id="rm-${item.id}">`;
            html += `<div class="readme-title"><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a><button onclick="dismissReadme('${item.id}')">remove</button></div>`;
            let detail = item.modified_display || '';
            if (item.tags && item.tags.length) detail += (detail ? ' \u00b7 ' : '') + item.tags.map(t => ':' + escapeHtml(t)).join(' ');
            if (detail) html += `<div class="readme-detail">${detail}</div>`;
            if (item.precis) html += `<div class="readme-precis">${escapeHtml(item.precis)}</div>`;
            html += '</div>';
        }
        panel.innerHTML = html;
    }

    function dismissReadme(id) {
        fetch('/tjai/api/readme/dismiss', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
            body: JSON.stringify({entry_id: id}),
        });
        readmeItems = readmeItems.filter(i => i.id !== id);
        renderReadme();
    }

    // --- Synopsis ---
    let synDates = [];
    let synTodayKey = '';

    async function loadSynopsis() {
        const panel = document.getElementById('panel-syn');
        try {
            const resp = await fetch('/tjai/api/synopsis/dates');
            const data = await resp.json();
            if (data.error) {
                panel.innerHTML = `<div class="error-msg">${escapeHtml(data.error)}</div>`;
                return;
            }
            synDates = data.dates || [];
            synTodayKey = data.today_key || '';
            renderSynopsisDates();
            if (synDates.length > 0) selectSynopsis(synDates[0].entry_id);
        } catch (e) {
            panel.innerHTML = '<div class="error-msg">Error loading synopsis</div>';
        }
    }

    function renderSynopsisDates() {
        const panel = document.getElementById('panel-syn');
        if (synDates.length === 0) {
            panel.innerHTML = '<div class="loading">No synopses found.</div>';
            return;
        }
        const recent = synDates.slice(0, 7);
        let html = '<div class="syn-dates">';
        for (const d of recent) {
            const isToday = d.date_key === synTodayKey;
            html += `<div class="syn-date${isToday ? ' today' : ''}" data-entry-id="${escapeHtml(d.entry_id)}" onclick="selectSynopsis('${escapeHtml(d.entry_id)}')">${escapeHtml(d.date_display)}</div>`;
        }
        html += '</div><div id="syn-content"><div class="loading">Select a date...</div></div>';
        panel.innerHTML = html;
    }

    function openSynopsis(entryId) {
        switchTab('syn');
        loaded['syn'] = true;
        const panel = document.getElementById('panel-syn');
        panel.innerHTML = '<div id="syn-content"><div class="loading">Loading...</div></div>';
        selectSynopsis(entryId);
    }

    async function selectSynopsis(entryId) {
        document.querySelectorAll('.syn-date').forEach(el => {
            el.classList.toggle('selected', el.dataset.entryId === entryId);
        });
        const contentEl = document.getElementById('syn-content');
        if (contentEl) contentEl.innerHTML = '<div class="loading">Loading...</div>';
        try {
            const resp = await fetch(`/tjai/api/synopsis/content?entry_id=${encodeURIComponent(entryId)}`);
            const data = await resp.json();
            if (data.error) {
                if (contentEl) contentEl.innerHTML = `<div class="error-msg">${escapeHtml(data.error)}</div>`;
                return;
            }
            if (contentEl) contentEl.innerHTML = `<div class="syn-content">${data.content_html}</div>`;
        } catch (e) {
            if (contentEl) contentEl.innerHTML = '<div class="error-msg">Error loading synopsis</div>';
        }
    }

    // --- RSS ---
    let rssData = [];
    let rssPageBuiltAt = null;

    async function loadRss() {
        const panel = document.getElementById('panel-rss');
        try {
            const resp = await fetch('/tjai/api/rss/data');
            const data = await resp.json();
            if (data.error) {
                panel.innerHTML = `<div class="error-msg">${escapeHtml(data.error)}</div>`;
                return;
            }
            rssData = data.categories || [];
            rssPageBuiltAt = data.server_time;
            renderRss(data.total_unread, data.oldest_date_display);
        } catch (e) {
            panel.innerHTML = '<div class="error-msg">Error loading RSS</div>';
        }
    }

    function renderRss(totalUnread, oldestDateDisplay) {
        const panel = document.getElementById('panel-rss');
        let statsText = `${totalUnread || 0} unread`;
        if (oldestDateDisplay) {
            statsText += ` \u00b7 oldest ${oldestDateDisplay}`;
        }

        if (rssData.length === 0) {
            panel.innerHTML = `<div class="rss-stats" id="rss-stats">${statsText}</div><div class="loading">No unread RSS items.</div>`;
            return;
        }

        let html = `<div class="rss-stats" id="rss-stats"><span>${statsText}</span><button onclick="markRssAllRead(this)">Mark All Read</button></div>`;
        for (const cat of rssData) {
            html += `<div class="category-block"><div class="category-header">${escapeHtml(cat.category)}</div>`;
            for (const src of cat.sources) {
                html += `<div class="source-block" data-source="${escapeHtml(src.source)}">`;
                html += `<div class="source-header"><span class="source-name">${escapeHtml(src.source)}</span><span class="source-count">${src.items.length}</span><button onclick="markRssSourceRead('${escapeHtml(src.source)}', this)">Mark Read</button></div>`;
                for (const item of src.items) {
                    html += `<div class="rss-item" data-guid="${escapeHtml(item.guid)}">`;
                    html += `<div class="rss-title"><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener" onclick="markRssItemRead(this)">${escapeHtml(item.title)}</a>`;
                    html += `<button class="${item.readme ? 'active-readme' : ''}" data-url="${escapeHtml(item.url)}" data-title="${escapeHtml(item.title)}" onclick="toggleRssReadme(this)">ReadMe</button></div>`;
                    if (item.published_display) {
                        html += `<div class="rss-meta">${escapeHtml(item.published_display)}</div>`;
                    }
                    if (item.precis) {
                        const tmp = document.createElement('div');
                        tmp.innerHTML = item.precis;
                        const clean = tmp.textContent || '';
                        if (clean.length > 0) html += `<div class="rss-precis">${escapeHtml(clean)}</div>`;
                    }
                    html += '</div>';
                }
                html += `<div style="margin-top:6px"><button class="feed-bottom-btn" onclick="markRssSourceRead('${escapeHtml(src.source)}', this)">Mark Read</button></div>`;
                html += `<hr style="border:none;border-top:1px solid rgba(255,255,255,0.2);margin:10px 0">`;
                html += '</div>';
            }
            html += '</div>';
        }
        panel.innerHTML = html;
    }

    function markRssItemRead(linkEl) {
        const item = linkEl.closest('.rss-item');
        if (item.classList.contains('read')) return;
        item.classList.add('read');
        const guid = item.dataset.guid;
        fetch('/tjai/api/rss/mark-item-read', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
            body: JSON.stringify({guid}),
        }).then(r => r.json()).then(data => {
            if (data.total_unread !== undefined) {
                const statsEl = document.querySelector('#rss-stats span');
                if (statsEl) statsEl.textContent = `${data.total_unread} unread`;
            }
        });
    }

    function showRssToast(msg) {
        const t = document.createElement('div');
        t.textContent = msg;
        t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:10px 20px;border-radius:6px;font-size:14px;z-index:9999;opacity:0;transition:opacity 0.3s';
        document.body.appendChild(t);
        requestAnimationFrame(() => t.style.opacity = '1');
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
    }

    async function markRssSourceRead(source, btn) {
        btn.textContent = '...';
        btn.disabled = true;
        try {
            const resp = await fetch('/tjai/api/rss/mark-read', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                body: JSON.stringify({source, before: rssPageBuiltAt}),
            });
            const data = await resp.json();
            if (data.ok) {
                showRssToast(`Marked ${source} as read`);
                const block = btn.closest('.source-block');
                if (block) block.remove();
                document.querySelectorAll('.category-block').forEach(cb => {
                    if (cb.querySelectorAll('.source-block').length === 0) cb.remove();
                });
                const statsEl = document.querySelector('#rss-stats span');
                if (statsEl) {
                    const current = parseInt(statsEl.textContent) || 0;
                    statsEl.textContent = `${Math.max(0, current - (data.marked || 0))} unread`;
                }
                if (document.querySelectorAll('.source-block').length === 0) {
                    document.getElementById('panel-rss').innerHTML =
                        '<div class="rss-stats" id="rss-stats"><span>0 unread</span></div><div class="loading">All caught up.</div>';
                }
            } else {
                btn.textContent = 'Mark Read';
                btn.disabled = false;
            }
        } catch (e) {
            btn.textContent = 'Mark Read';
            btn.disabled = false;
        }
    }

    async function markRssAllRead(btn) {
        btn.textContent = '...';
        btn.disabled = true;
        try {
            const resp = await fetch('/tjai/api/rss/mark-all-read', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                body: JSON.stringify({before: rssPageBuiltAt}),
            });
            const data = await resp.json();
            if (data.ok) {
                document.getElementById('panel-rss').innerHTML =
                    '<div class="rss-stats" id="rss-stats"><span>0 unread</span></div><div class="loading">All caught up.</div>';
            }
        } catch (e) {}
        btn.textContent = 'Mark All Read';
        btn.disabled = false;
    }

    async function markRssCatRead(btn) {
        const catBlock = btn.closest('.category-block');
        if (!catBlock) return;
        const sourceBlocks = catBlock.querySelectorAll('.source-block');
        const sources = Array.from(sourceBlocks).map(b => b.dataset.source);
        if (sources.length === 0) return;
        btn.textContent = '...';
        btn.disabled = true;
        let totalMarked = 0;
        for (const source of sources) {
            try {
                const resp = await fetch('/tjai/api/rss/mark-read', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                    body: JSON.stringify({source, before: rssPageBuiltAt}),
                });
                const data = await resp.json();
                if (data.ok) totalMarked += (data.marked || 0);
            } catch (e) {}
        }
        catBlock.remove();
        const statsEl = document.querySelector('#rss-stats span');
        if (statsEl) {
            const current = parseInt(statsEl.textContent) || 0;
            statsEl.textContent = `${Math.max(0, current - totalMarked)} unread`;
        }
        if (document.querySelectorAll('.category-block').length === 0) {
            document.getElementById('panel-rss').innerHTML =
                '<div class="rss-stats" id="rss-stats"><span>0 unread</span></div><div class="loading">All caught up.</div>';
        }
    }

    function toggleRssReadme(btn) {
        if (btn.disabled) return;
        const activate = !btn.classList.contains('active-readme');
        const url = btn.dataset.url;
        const title = btn.dataset.title;
        btn.classList.toggle('active-readme', activate);
        btn.disabled = true;
        fetch('/tjai/api/rss/readme', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
            body: JSON.stringify({url, title, activate}),
        }).then(r => r.json()).then(data => {
            if (!data.ok) {
                btn.classList.toggle('active-readme', !activate);
                console.error('ReadMe toggle failed:', data.error);
            }
        }).catch(e => {
            btn.classList.toggle('active-readme', !activate);
            console.error('ReadMe toggle failed:', e);
        }).finally(() => { btn.disabled = false; });
    }

    // Go
    init();
    </script>
</body>
</html>

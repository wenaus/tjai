<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tjai Picks</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #top-menu {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 4px 16px;
            background: #222;
            border-bottom: 1px solid #333;
            font-size: 12px;
            flex-shrink: 0;
        }
        #top-menu .menu-title {
            color: #d8a070;
            font-weight: bold;
            margin-right: 8px;
        }
        #top-menu a {
            color: #8a8a8a;
        }
        #top-menu a:hover {
            color: #e0e0e0;
        }
        .picks-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 24px;
            background: #222;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .picks-header a {
            color: #64b5f6;
            text-decoration: none;
            font-size: 12px;
        }
        .picks-header a:hover {
            text-decoration: underline;
        }
        .picks-header .stats {
            color: #8a8a8a;
            font-size: 11px;
            margin-left: auto;
        }
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 40px;
        }
        .run-block {
            margin-bottom: 24px;
        }
        .run-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #444;
            margin-bottom: 12px;
        }
        .run-block > .run-header:first-child {
            position: sticky;
            top: 0;
            background: #1a1a1a;
            z-index: 1;
            padding-top: 16px;
        }
        .run-header .run-time {
            color: #d8a070;
            font-weight: bold;
            font-size: 13px;
        }
        .run-header .run-stats {
            color: #8a8a8a;
            font-size: 11px;
        }
        .run-header button {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 3px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
        }
        .run-header button:hover {
            background: #444;
        }
        .run-header button.done {
            color: #666;
            border-color: #444;
            cursor: default;
        }
        .pick-item {
            padding: 8px 12px;
            margin-bottom: 6px;
            border-left: 3px solid #333;
            transition: opacity 0.2s;
        }
        .pick-item.archived {
            opacity: 0.4;
        }
        .pick-item.kept {
            border-left-color: #4caf50;
        }
        .pick-title {
            font-size: 13px;
            margin-bottom: 3px;
        }
        .pick-title a {
            color: #64b5f6;
            text-decoration: none;
        }
        .pick-title a:hover {
            text-decoration: underline;
        }
        .pick-item.archived .pick-title a {
            color: #666;
        }
        .pick-item.kept .pick-title a {
            color: #81c784;
        }
        .pick-source {
            color: #8a8a8a;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .pick-precis {
            color: #bbb;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 3px;
        }
        .pick-rationale {
            color: #9a9a6a;
            font-size: 11px;
            font-style: italic;
            margin-bottom: 6px;
        }
        .pick-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .pick-actions button {
            background: none;
            border: 1px solid #444;
            color: #8a8a8a;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
        }
        .pick-actions button:hover {
            color: #e0e0e0;
            border-color: #666;
        }
        .pick-actions button.active-up {
            color: #4caf50;
            border-color: #4caf50;
        }
        .pick-actions button.active-down {
            color: #ef5350;
            border-color: #ef5350;
        }
        .pick-actions button.active-keep {
            color: #4caf50;
            border-color: #4caf50;
            font-weight: bold;
        }
        .pick-actions button.active-readme {
            color: #ffb74d;
            border-color: #ffb74d;
        }
        .activity-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .dot-active { background: #4caf50; animation: pulse 1.5s ease-in-out infinite; }
        .dot-idle { background: #ff9800; }
        .dot-stale { background: #ef5350; }
        .dot-off { background: #555; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .error-section {
            padding: 6px 24px;
            font-size: 11px;
            background: rgba(239, 83, 80, 0.08);
            color: #ef5350;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .error-section:empty { display: none; }
        .loading {
            color: #8a8a8a;
            padding: 20px;
        }
        .error {
            color: #ef5350;
            padding: 20px;
        }
        .empty {
            color: #8a8a8a;
            padding: 40px;
            text-align: center;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        * { scrollbar-width: thin; scrollbar-color: #444 #1a1a1a; }
    </style>
</head>
<body>
    {% with current_page="picks" %}{% include "tjai_app/_menu.html" %}{% endwith %}
    <div class="picks-header">
        <a href="/tjai/entry/?entry_id=picks-sources">Sources</a>
        <span id="next-run" style="color:#8a8a8a;font-size:11px"></span>
        <button class="btn-run" id="btn-run" onclick="runNow()" style="background:#333;color:#64b5f6;border:1px solid #64b5f6;padding:2px 10px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:11px;white-space:nowrap">Run now</button>
        <button class="btn-run" id="btn-abort" onclick="abortAgent()" style="display:none;background:#333;color:#ef5350;border:1px solid #ef5350;padding:2px 10px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:11px;white-space:nowrap">Abort</button>
        <span class="stats" id="global-stats"></span>
    </div>
    <div class="error-section" id="error-section"></div>
    <div class="content-area" id="picks-content">
        <div class="loading">Loading picks...</div>
    </div>

    <script>
        let allRuns = [];
        let totalSources = 0;

        async function fetchPicks() {
            try {
                const resp = await fetch('/tjai/api/picks/data');
                const data = await resp.json();
                if (data.error) {
                    document.getElementById('picks-content').innerHTML =
                        `<div class="error">${data.error}</div>`;
                    return;
                }
                allRuns = data.runs || [];
                totalSources = data.total_sources || 0;
                updateAgentInfo(data.agent || {});
                renderPicks();
            } catch (e) {
                document.getElementById('picks-content').innerHTML =
                    '<div class="error">Error loading picks</div>';
            }
        }

        function renderPicks() {
            if (allRuns.length === 0) {
                document.getElementById('picks-content').innerHTML =
                    '<div class="empty">No picks yet. Run the picks agent to generate curated news.</div>';
                updateGlobalStats();
                return;
            }

            let html = '';
            for (const run of allRuns) {
                const runId = run.run;
                const picks = run.picks;
                const activeCount = picks.filter(p => !p.archived && !p.kept).length;
                const keptCount = picks.filter(p => p.kept).length;
                const allDone = activeCount === 0;

                // Fully processed with nothing kept — skip entirely
                if (allDone && keptCount === 0) continue;

                // Which picks to show: if fully processed, only kept items
                const visiblePicks = allDone ? picks.filter(p => p.kept) : picks;

                html += `<div class="run-block" data-run="${esc(runId)}">`;
                html += '<div class="run-header">';
                html += `<span class="run-time">${formatRunTime(runId)}</span>`;
                let statsText = `${picks.length} picks, ${keptCount} kept`;
                if (run.source_count) {
                    statsText += totalSources ? `, ${run.source_count} of ${totalSources} sources` : `, ${run.source_count} sources`;
                }
                if (run.duration_seconds != null) statsText += ` · ${formatDuration(run.duration_seconds)}`;
                html += `<span class="run-stats">${statsText}</span>`;
                if (!allDone) {
                    html += `<button onclick="archiveRun('${esc(runId)}')">Archive All</button>`;
                } else {
                    html += `<button class="done" disabled>All reviewed</button>`;
                }
                html += '</div>';

                for (const pick of visiblePicks) {
                    const classes = ['pick-item'];
                    if (pick.archived) classes.push('archived');
                    if (pick.kept) classes.push('kept');

                    html += `<div class="${classes.join(' ')}" id="pick-${pick.id}">`;
                    html += `<div class="pick-title"><a href="${esc(pick.url)}" target="_blank" rel="noopener" onclick="markViewed('${pick.id}', this)">${esc(pick.title)}</a></div>`;
                    if (pick.source) {
                        html += `<div class="pick-source">${esc(pick.source)}</div>`;
                    }
                    html += `<div class="pick-precis">${esc(pick.precis)}</div>`;
                    if (pick.rationale) {
                        html += `<div class="pick-rationale">Why: ${esc(pick.rationale)}</div>`;
                    }
                    html += '<div class="pick-actions">';
                    html += `<button class="${pick.thumbs === 'up' ? 'active-up' : ''}" onclick="setThumbs('${pick.id}', 'up', this)">&#x25B2;</button>`;
                    html += `<button class="${pick.thumbs === 'down' ? 'active-down' : ''}" onclick="setThumbs('${pick.id}', 'down', this)">&#x25BC;</button>`;
                    html += `<button class="${pick.kept ? 'active-keep' : ''}" onclick="toggleKeep('${pick.id}', ${!pick.kept}, this)">Keep</button>`;
                    html += `<button class="${pick.readme ? 'active-readme' : ''}" onclick="toggleReadme('${pick.id}', this)">ReadMe</button>`;
                    html += '</div>';
                    html += '</div>';
                }

                if (!allDone) {
                    html += `<div class="run-header" style="border:none;margin-top:8px;padding:0"><button onclick="archiveRun('${esc(runId)}')">Archive All</button></div>`;
                }
                html += '</div>';
            }

            document.getElementById('picks-content').innerHTML = html;
            updateGlobalStats();
        }

        function updateGlobalStats() {
            let total = 0, active = 0, kept = 0, archived = 0;
            for (const run of allRuns) {
                for (const p of run.picks) {
                    total++;
                    if (p.kept) kept++;
                    else if (p.archived) archived++;
                    else active++;
                }
            }
            const el = document.getElementById('global-stats');
            if (total === 0) {
                el.textContent = '';
            } else {
                el.textContent = `${total} total, ${active} to review, ${kept} kept, ${archived} archived`;
            }
        }

        function formatRunTime(runStr) {
            if (!runStr || runStr === 'unknown') return 'Unknown run';
            try {
                const d = new Date(runStr);
                return d.toLocaleDateString('en-US', {
                    weekday: 'short', month: 'short', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
            } catch {
                return runStr;
            }
        }

        function formatDuration(seconds) {
            if (seconds < 60) return seconds + 's';
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            if (m < 60) return s > 0 ? `${m}m ${s}s` : `${m}m`;
            const h = Math.floor(m / 60);
            const rm = m % 60;
            return rm > 0 ? `${h}h ${rm}m` : `${h}h`;
        }

        function esc(s) {
            if (!s) return '';
            const el = document.createElement('span');
            el.textContent = s;
            return el.innerHTML;
        }

        function findPick(id) {
            for (const run of allRuns) {
                const p = run.picks.find(p => p.id === id);
                if (p) return p;
            }
            return null;
        }

        async function updatePick(entryId, field, value) {
            const resp = await fetch('/tjai/api/picks/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                body: JSON.stringify({entry_id: entryId, field, value}),
            });
            const data = await resp.json();
            if (data.error) console.error('Update failed:', data.error);
            return data;
        }

        function markViewed(id, linkEl) {
            const pick = findPick(id);
            if (!pick || pick.archived || pick.kept) return;
            pick.archived = true;
            updatePick(id, 'archived', true);
            const el = document.getElementById('pick-' + id);
            if (el) el.classList.add('archived');
            updateGlobalStats();
            updateRunHeaders();
        }

        function setThumbs(id, direction, btn) {
            const pick = findPick(id);
            if (!pick) return;
            const newVal = pick.thumbs === direction ? null : direction;
            pick.thumbs = newVal;
            updatePick(id, 'thumbs', newVal);

            const actions = btn.parentElement;
            const upBtn = actions.children[0];
            const downBtn = actions.children[1];
            upBtn.className = newVal === 'up' ? 'active-up' : '';
            downBtn.className = newVal === 'down' ? 'active-down' : '';
        }

        function toggleReadme(id, btn) {
            const pick = findPick(id);
            if (!pick) return;
            const newVal = !pick.readme;
            pick.readme = newVal;
            updatePick(id, 'readme', newVal);
            btn.className = newVal ? 'active-readme' : '';
        }

        function toggleKeep(id, keepVal, btn) {
            const pick = findPick(id);
            if (!pick) return;
            pick.kept = keepVal;
            if (keepVal) pick.archived = false;
            updatePick(id, 'kept', keepVal);

            const el = document.getElementById('pick-' + id);
            if (el) {
                el.classList.toggle('kept', keepVal);
                if (keepVal) el.classList.remove('archived');
            }
            btn.className = keepVal ? 'active-keep' : '';
            updateGlobalStats();
            updateRunHeaders();
        }

        async function archiveRun(runId) {
            const resp = await fetch('/tjai/api/picks/archive-run', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                body: JSON.stringify({run_id: runId}),
            });
            const data = await resp.json();
            if (data.error) {
                console.error('Archive run failed:', data.error);
                return;
            }

            // Update local state
            const run = allRuns.find(r => r.run === runId);
            if (run) {
                for (const p of run.picks) {
                    if (!p.kept) {
                        p.archived = true;
                        const el = document.getElementById('pick-' + p.id);
                        if (el) el.classList.add('archived');
                    }
                }
            }
            updateGlobalStats();
            updateRunHeaders();
        }

        function updateRunHeaders() {
            for (const run of allRuns) {
                const block = document.querySelector(`.run-block[data-run="${CSS.escape(run.run)}"]`);
                if (!block) continue;
                const activeCount = run.picks.filter(p => !p.archived && !p.kept).length;
                const keptCount = run.picks.filter(p => p.kept).length;
                const allDone = activeCount === 0;
                // Fully processed, nothing kept — remove entire block
                if (allDone && keptCount === 0) {
                    block.remove();
                    continue;
                }
                // Fully processed with kept items — hide archived, keep the kept visible
                if (allDone) {
                    block.querySelectorAll('.pick-item.archived').forEach(el => el.remove());
                }
                const statsEl = block.querySelector('.run-stats');
                if (statsEl) {
                    let st = `${run.picks.length} picks, ${keptCount} kept`;
                    if (run.source_count) {
                        st += totalSources ? `, ${run.source_count} of ${totalSources} sources` : `, ${run.source_count} sources`;
                    }
                    if (run.duration_seconds != null) st += ` · ${formatDuration(run.duration_seconds)}`;
                    statsEl.textContent = st;
                }
                // Update all Archive All buttons (header + bottom)
                block.querySelectorAll('.run-header button').forEach(btn => {
                    if (allDone) {
                        btn.className = 'done';
                        btn.disabled = true;
                        btn.textContent = 'All reviewed';
                        btn.onclick = null;
                    } else {
                        btn.className = '';
                        btn.disabled = false;
                        btn.textContent = 'Archive All';
                    }
                });
            }
        }

        function getCsrf() {
            const c = document.cookie.match(/csrftoken=([^;]+)/);
            return c ? c[1] : '';
        }

        let picksAgentRunning = false;

        function timeAgo(ts) {
            if (!ts) return '';
            const sec = Math.floor(Date.now() / 1000 - ts);
            if (sec < 60) return sec + 's ago';
            if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
            return Math.floor(sec / 3600) + 'h ' + Math.floor((sec % 3600) / 60) + 'm ago';
        }

        function updateAgentInfo(agent) {
            const el = document.getElementById('next-run');
            const btn = document.getElementById('btn-run');
            const abortBtn = document.getElementById('btn-abort');
            const errorDiv = document.getElementById('error-section');
            picksAgentRunning = agent.status === 'running';
            if (picksAgentRunning) {
                let runText = '';
                // Activity dot
                let dotClass = 'dot-idle';
                if (agent.last_activity) {
                    const actAge = Date.now() / 1000 - parseFloat(agent.last_activity);
                    if (actAge < 30) dotClass = 'dot-active';
                    else if (actAge < 300) dotClass = 'dot-idle';
                    else dotClass = 'dot-stale';
                } else if (agent.health === 'active') dotClass = 'dot-active';
                else if (agent.health === 'stale') dotClass = 'dot-stale';
                runText += `<span class="activity-dot ${dotClass}"></span>`;
                if (agent.launched) {
                    const elapsed = Math.floor(Date.now() / 1000 - agent.launched);
                    const m = Math.floor(elapsed / 60);
                    const s = elapsed % 60;
                    runText += m > 0 ? `Running ${m}m ${s}s` : `Running ${s}s`;
                } else {
                    runText += 'Running...';
                }
                if (agent.last_activity) {
                    runText += ` · activity ${timeAgo(parseFloat(agent.last_activity))}`;
                }
                el.innerHTML = runText;
                btn.disabled = true;
                btn.style.color = '#555';
                btn.style.borderColor = '#444';
                abortBtn.style.display = '';
                abortBtn.textContent = 'Abort';
                abortBtn.disabled = false;
            } else {
                abortBtn.style.display = 'none';
                if (agent.next_run) {
                    const secLeft = agent.next_run - Date.now() / 1000;
                    if (secLeft <= 0) {
                        el.textContent = 'Due now';
                    } else {
                        const h = Math.floor(secLeft / 3600);
                        const m = Math.floor((secLeft % 3600) / 60);
                        el.textContent = h > 0 ? `Next run in ${h}h ${m}m` : `Next run in ${m}m`;
                    }
                }
                btn.disabled = false;
                btn.style.color = '#64b5f6';
                btn.style.borderColor = '#64b5f6';
            }
            // Error section
            if (agent.last_error && agent.last_error.trim()) {
                const errTime = agent.last_error_time ? timeAgo(parseFloat(agent.last_error_time)) : '';
                errorDiv.innerHTML = `Error${errTime ? ' (' + errTime + ')' : ''}: ${esc(agent.last_error)}`;
            } else {
                errorDiv.innerHTML = '';
            }
        }

        async function runNow() {
            const btn = document.getElementById('btn-run');
            btn.disabled = true;
            btn.textContent = 'Starting...';
            try {
                const resp = await fetch('/tjai/api/picks/run', {
                    method: 'POST',
                    headers: {'X-CSRFToken': getCsrf()},
                });
                if (!resp.ok && resp.status === 403) {
                    btn.textContent = 'CSRF error — reload page';
                    setTimeout(() => { btn.textContent = 'Run now'; btn.disabled = false; }, 5000);
                    return;
                }
                const data = await resp.json();
                if (data.error) {
                    btn.textContent = data.error;
                    setTimeout(() => { btn.textContent = 'Run now'; btn.disabled = false; }, 5000);
                    return;
                }
                if (data.warning) {
                    btn.textContent = data.warning;
                    btn.style.color = '#ff9800';
                    setTimeout(() => { btn.textContent = 'Run now'; btn.disabled = false; btn.style.color = '#64b5f6'; }, 5000);
                    return;
                }
                btn.textContent = 'Queued';
                startPolling();
            } catch (e) {
                btn.textContent = 'Error: ' + e.message;
                setTimeout(() => { btn.textContent = 'Run now'; btn.disabled = false; }, 5000);
            }
        }

        async function abortAgent() {
            const btn = document.getElementById('btn-abort');
            btn.disabled = true;
            btn.textContent = 'Aborting...';
            try {
                const resp = await fetch('/tjai/api/picks/abort', {
                    method: 'POST',
                    headers: {'X-CSRFToken': getCsrf()},
                });
                const data = await resp.json();
                if (data.error) {
                    btn.textContent = data.error;
                    setTimeout(() => { btn.textContent = 'Abort'; btn.disabled = false; }, 3000);
                    return;
                }
                btn.textContent = 'Aborted';
                setTimeout(fetchPicks, 2000);
            } catch (e) {
                btn.textContent = 'Error';
                setTimeout(() => { btn.textContent = 'Abort'; btn.disabled = false; }, 3000);
            }
        }

        // Poll for status updates while agent is running
        let pollTimer = null;
        function startPolling() {
            if (pollTimer) return;
            pollTimer = setInterval(() => {
                fetchPicks().then(() => {
                    if (!picksAgentRunning && pollTimer) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                    }
                });
            }, 10000);
        }

        fetchPicks().then(() => {
            if (picksAgentRunning) startPolling();
        });
    </script>
</body>
</html>

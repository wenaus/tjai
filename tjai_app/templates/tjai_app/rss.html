<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tjai RSS</title>
    <link rel="stylesheet" href="/tjai/static/tjai/menu.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .rss-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 24px;
            background: #222;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .rss-header button {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 3px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }
        .rss-header button:hover {
            background: #444;
        }
        .rss-header a {
            color: #64b5f6;
            text-decoration: none;
            font-size: 12px;
        }
        .rss-header a:hover {
            text-decoration: underline;
        }
        .rss-header .stats {
            color: #8a8a8a;
            font-size: 12px;
        }
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 40px;
        }
        .category-block {
            margin-bottom: 24px;
        }
        .category-header {
            color: #d8a070;
            font-weight: bold;
            font-size: 14px;
            padding: 16px 0 6px;
            border-bottom: 1px solid #444;
            margin-bottom: 12px;
            text-transform: capitalize;
            position: sticky;
            top: 0;
            background: #1a1a1a;
            z-index: 2;
        }
        .source-block {
            margin-bottom: 16px;
            margin-left: 8px;
        }
        .source-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0 4px;
            margin-bottom: 6px;
            position: sticky;
            top: 40px;
            background: #1a1a1a;
            z-index: 1;
        }
        .source-header .source-name {
            color: #81c784;
            font-weight: bold;
            font-size: 13px;
        }
        .source-header .source-count {
            color: #8a8a8a;
            font-size: 11px;
        }
        .source-header button {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
        }
        .source-header button:hover {
            background: #444;
        }
        .feed-bottom-btn {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
        }
        .feed-bottom-btn:hover {
            background: #444;
        }
        .source-header button.done {
            color: #666;
            border-color: #444;
            cursor: default;
        }
        .rss-item {
            padding: 4px 12px;
            margin-bottom: 3px;
            border-left: 2px solid #333;
        }
        .rss-item:hover {
            border-left-color: #555;
        }
        .rss-item.read .rss-title a {
            color: #999;
        }
        .rss-actions button {
            background: none;
            border: 1px solid #444;
            color: #8a8a8a;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
        }
        .rss-actions button:hover {
            color: #e0e0e0;
            border-color: #666;
        }
        .rss-actions button.active-readme {
            color: #ffb74d;
            border-color: #ffb74d;
        }
        .rss-title {
            font-size: 13px;
        }
        .rss-title a {
            color: #64b5f6;
            text-decoration: none;
        }
        .rss-title a:hover {
            text-decoration: underline;
        }
        .rss-meta {
            color: #666;
            font-size: 13px;
        }
        .rss-precis {
            color: #999;
            font-size: 13px;
            line-height: 1.4;
            margin-top: 2px;
            max-height: 2.8em;
            overflow: hidden;
        }
        .loading { color: #8a8a8a; padding: 20px; }
        .error { color: #ef5350; padding: 20px; }
        .empty { color: #8a8a8a; padding: 40px; text-align: center; }
        /* Add source modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #2a2a2a;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 20px;
            width: 400px;
            max-width: 90vw;
        }
        .modal h3 { color: #d8a070; margin-bottom: 12px; font-size: 14px; }
        .modal label { color: #aaa; font-size: 12px; display: block; margin-bottom: 4px; }
        .modal input, .modal select {
            width: 100%;
            padding: 6px 8px;
            background: #1a1a1a;
            border: 1px solid #555;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 12px;
            border-radius: 3px;
            margin-bottom: 12px;
        }
        .modal .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .modal button {
            padding: 5px 14px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            border: 1px solid #555;
        }
        .modal button.primary { background: #2e7d32; color: #fff; border-color: #2e7d32; }
        .modal button.cancel { background: #333; color: #e0e0e0; }
        .modal .modal-status { color: #8a8a8a; font-size: 11px; margin-bottom: 8px; min-height: 16px; }
        .modal .modal-status.error { color: #ef5350; padding: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        * { scrollbar-width: thin; scrollbar-color: #444 #1a1a1a; }
    </style>
</head>
<body>
    {% with current_page="rss" %}{% include "tjai_app/_menu.html" %}{% endwith %}
    <div class="rss-header">
        <button onclick="showAddModal()">+ Add Source</button>
        <button onclick="fetchNow()">Fetch Now</button>
        <button onclick="markAllReadGlobal(this)">Mark All Read</button>
        <a href="/tjai/entry/?entry_id=rss-sources">Sources</a>
        <span class="stats" id="global-stats"></span>
    </div>
    <div class="content-area" id="rss-content">
        <div class="loading">Loading RSS...</div>
    </div>

    <div class="modal-overlay" id="add-modal">
        <div class="modal">
            <h3>Add RSS Source</h3>
            <label>URL (site or feed URL)</label>
            <input type="text" id="add-url" placeholder="https://example.com or https://example.com/feed.xml">
            <label>Category</label>
            <select id="add-category">
                <option value="tech">tech</option>
                <option value="science">science</option>
                <option value="culture">culture</option>
                <option value="uncategorized">uncategorized</option>
            </select>
            <div class="modal-status" id="add-status"></div>
            <div class="modal-actions">
                <button class="cancel" onclick="hideAddModal()">Cancel</button>
                <button class="primary" id="add-submit" onclick="submitAddSource()">Add</button>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let pageBuiltAt = null;

        async function loadRss() {
            try {
                const resp = await fetch('/tjai/api/rss/data');
                const data = await resp.json();
                if (data.error) {
                    document.getElementById('rss-content').innerHTML =
                        `<div class="error">${esc(data.error)}</div>`;
                    return;
                }
                allData = data.categories || [];
                pageBuiltAt = data.server_time;
                renderRss();
                let statsText = `${data.total_unread} unread`;
                if (data.oldest_date) {
                    const d = new Date(data.oldest_date);
                    statsText += ` · oldest ${d.toLocaleDateString('en-US', {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'})}`;
                }
                document.getElementById('global-stats').textContent = statsText;
            } catch (e) {
                document.getElementById('rss-content').innerHTML =
                    '<div class="error">Error loading RSS data</div>';
            }
        }

        function renderRss() {
            if (allData.length === 0) {
                document.getElementById('rss-content').innerHTML =
                    '<div class="empty">No unread RSS items. Add sources and click Fetch Now.</div>';
                return;
            }

            let html = '';
            for (const cat of allData) {
                html += `<div class="category-block">`;
                html += `<div class="category-header">${esc(cat.category)}</div>`;

                for (const src of cat.sources) {
                    const count = src.items.length;
                    html += `<div class="source-block" data-source="${esc(src.source)}">`;
                    html += `<div class="source-header">`;
                    html += `<span class="source-name">${esc(src.source)}</span>`;
                    html += `<span class="source-count">${count}</span>`;
                    html += `<button onclick="markAllRead(this.closest('.source-block').dataset.source, this)">Mark All Read</button>`;
                    html += `</div>`;

                    for (const item of src.items) {
                        html += `<div class="rss-item" data-guid="${esc(item.guid)}">`;
                        html += `<div class="rss-title"><a href="${esc(item.url)}" target="_blank" rel="noopener" onclick="markItemRead(this)">${esc(item.title)}</a> <span class="rss-actions"><button class="${item.readme ? 'active-readme' : ''}" data-url="${esc(item.url)}" data-title="${esc(item.title)}" onclick="toggleReadme(this)">ReadMe</button><button onclick="markAboveRead(this)" title="Mark all items above as read">▲ Clear</button></span></div>`;
                        if (item.published) {
                            const d = new Date(item.published);
                            html += `<div class="rss-meta">${d.toLocaleDateString('en-US', {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'})}</div>`;
                        }
                        if (item.precis) {
                            // Strip HTML tags from precis
                            const tmp = document.createElement('div');
                            tmp.innerHTML = item.precis;
                            const cleanPrecis = tmp.textContent || tmp.innerText || '';
                            if (cleanPrecis.length > 0) {
                                html += `<div class="rss-precis">${esc(cleanPrecis)}</div>`;
                            }
                        }
                        html += `</div>`;
                    }
                    html += `<div style="margin-top:6px"><button class="feed-bottom-btn" onclick="markAllRead(this.closest('.source-block').dataset.source, this)">Mark All Read</button></div>`;
                    html += `<hr style="border:none;border-top:1px solid #333;margin:10px 0">`;
                    html += `</div>`;
                }
                html += `</div>`;
            }
            document.getElementById('rss-content').innerHTML = html;
        }

        function toggleReadme(btn) {
            if (btn.disabled) return;
            const activate = !btn.classList.contains('active-readme');
            const url = btn.dataset.url;
            const title = btn.dataset.title;
            btn.classList.toggle('active-readme', activate);
            btn.disabled = true;
            fetch('/tjai/api/rss/readme', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                body: JSON.stringify({url, title, activate}),
            }).then(r => r.json()).then(data => {
                if (!data.ok) {
                    btn.classList.toggle('active-readme', !activate);
                    console.error('ReadMe toggle failed:', data.error);
                }
            }).catch(e => {
                btn.classList.toggle('active-readme', !activate);
                console.error('ReadMe toggle failed:', e);
            }).finally(() => {
                btn.disabled = false;
            });
        }

        async function markAllReadGlobal(btn) {
            btn.textContent = '...';
            btn.disabled = true;
            try {
                const resp = await fetch('/tjai/api/rss/mark-all-read', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                    body: JSON.stringify({before: pageBuiltAt}),
                });
                if (!resp.ok) {
                    alert('Mark all read failed: HTTP ' + resp.status);
                    btn.textContent = 'Mark All Read';
                    btn.disabled = false;
                    return;
                }
                const data = await resp.json();
                if (data.ok) {
                    document.getElementById('rss-content').innerHTML =
                        '<div class="empty">All caught up.</div>';
                    document.getElementById('global-stats').textContent = '0 unread';
                }
            } catch (e) {
                alert('Mark all read failed: ' + e.message);
            }
            btn.textContent = 'Mark All Read';
            btn.disabled = false;
        }

        function markItemRead(linkEl) {
            const item = linkEl.closest('.rss-item');
            if (item.classList.contains('read')) return;
            item.classList.add('read');
            const guid = item.dataset.guid;
            fetch('/tjai/api/rss/mark-item-read', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                body: JSON.stringify({guid}),
            }).then(r => r.json()).then(data => {
                if (data.total_unread !== undefined) {
                    document.getElementById('global-stats').textContent = `${data.total_unread} unread`;
                }
            });
        }

        async function markAboveRead(btn) {
            const thisItem = btn.closest('.rss-item');
            if (!thisItem) return;
            const allItems = Array.from(document.querySelectorAll('.rss-item'));
            const idx = allItems.indexOf(thisItem);
            if (idx < 0) return;
            const above = allItems.slice(0, idx + 1).filter(el => !el.classList.contains('read'));
            if (above.length === 0) return;
            const guids = above.map(el => el.dataset.guid);
            btn.textContent = '...';
            btn.disabled = true;
            try {
                const resp = await fetch('/tjai/api/rss/mark-guids-read', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                    body: JSON.stringify({guids}),
                });
                const data = await resp.json();
                if (data.ok) {
                    above.forEach(el => el.remove());
                    document.querySelectorAll('.source-block').forEach(sb => {
                        if (sb.querySelectorAll('.rss-item').length === 0) sb.remove();
                    });
                    document.querySelectorAll('.category-block').forEach(cb => {
                        if (cb.querySelectorAll('.source-block').length === 0) cb.remove();
                    });
                    if (data.total_unread !== undefined) {
                        document.getElementById('global-stats').textContent = `${data.total_unread} unread`;
                    }
                    if (document.querySelectorAll('.rss-item').length === 0) {
                        document.getElementById('rss-content').innerHTML =
                            '<div class="empty">All caught up.</div>';
                    }
                }
            } catch (e) {
                alert('Mark above read failed: ' + e.message);
            }
            btn.textContent = '▲ Clear';
            btn.disabled = false;
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.textContent = msg;
            t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:10px 20px;border-radius:6px;font-size:14px;z-index:9999;opacity:0;transition:opacity 0.3s';
            document.body.appendChild(t);
            requestAnimationFrame(() => t.style.opacity = '1');
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        async function markAllRead(source, btn) {
            btn.textContent = '...';
            btn.disabled = true;
            try {
                const resp = await fetch('/tjai/api/rss/mark-read', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                    body: JSON.stringify({source, before: pageBuiltAt}),
                });
                if (!resp.ok) {
                    alert('Mark read failed: HTTP ' + resp.status);
                    btn.textContent = 'Mark All Read';
                    btn.disabled = false;
                    return;
                }
                const data = await resp.json();
                if (data.ok) {
                    showToast(`Marked ${source} as read`);
                    const block = btn.closest('.source-block');
                    if (block) block.remove();
                    document.querySelectorAll('.category-block').forEach(cb => {
                        if (cb.querySelectorAll('.source-block').length === 0) cb.remove();
                    });
                    const statsEl = document.getElementById('global-stats');
                    const current = parseInt(statsEl.textContent) || 0;
                    const newCount = Math.max(0, current - (data.marked || 0));
                    statsEl.textContent = `${newCount} unread`;
                    if (document.querySelectorAll('.source-block').length === 0) {
                        document.getElementById('rss-content').innerHTML =
                            '<div class="empty">All caught up.</div>';
                    }
                } else {
                    alert('Mark read failed: ' + (data.error || 'unknown error'));
                    btn.textContent = 'Mark All Read';
                    btn.disabled = false;
                }
            } catch (e) {
                alert('Mark read failed: ' + e.message);
                btn.textContent = 'Mark All Read';
                btn.disabled = false;
            }
        }

        async function markCatRead(btn) {
            const catBlock = btn.closest('.category-block');
            if (!catBlock) return;
            const sources = Array.from(catBlock.querySelectorAll('.source-block')).map(b => b.dataset.source);
            if (sources.length === 0) return;
            btn.textContent = '...';
            btn.disabled = true;
            let totalMarked = 0;
            for (const source of sources) {
                try {
                    const resp = await fetch('/tjai/api/rss/mark-read', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                        body: JSON.stringify({source, before: pageBuiltAt}),
                    });
                    const data = await resp.json();
                    if (data.ok) totalMarked += (data.marked || 0);
                } catch (e) {
                    alert('Mark category read failed: ' + e.message);
                }
            }
            catBlock.remove();
            const statsEl = document.getElementById('global-stats');
            const current = parseInt(statsEl.textContent) || 0;
            statsEl.textContent = `${Math.max(0, current - totalMarked)} unread`;
            if (document.querySelectorAll('.category-block').length === 0) {
                document.getElementById('rss-content').innerHTML =
                    '<div class="empty">All caught up.</div>';
            }
        }

        async function fetchNow() {
            const btn = document.querySelector('.rss-header button[onclick="fetchNow()"]');
            const statsEl = document.getElementById('global-stats');
            btn.textContent = 'Fetching...';
            btn.disabled = true;
            statsEl.textContent = 'Fetching feeds...';
            try {
                const resp = await fetch('/tjai/api/rss/fetch', {
                    method: 'POST',
                    headers: {'X-CSRFToken': getCsrf()},
                });
                const data = await resp.json();
                if (data.error) {
                    statsEl.textContent = 'Fetch failed: ' + data.error;
                    return;
                }
                await loadRss();
            } catch (e) {
                statsEl.textContent = 'Fetch error';
            }
            btn.textContent = 'Fetch Now';
            btn.disabled = false;
        }

        function showAddModal() {
            document.getElementById('add-modal').classList.add('active');
            document.getElementById('add-url').value = '';
            document.getElementById('add-status').textContent = '';
            document.getElementById('add-url').focus();
        }
        function hideAddModal() {
            document.getElementById('add-modal').classList.remove('active');
        }

        async function submitAddSource() {
            const url = document.getElementById('add-url').value.trim();
            const category = document.getElementById('add-category').value;
            const statusEl = document.getElementById('add-status');
            const submitBtn = document.getElementById('add-submit');

            if (!url) { statusEl.textContent = 'Enter a URL'; statusEl.className = 'modal-status error'; return; }

            statusEl.textContent = 'Validating feed...';
            statusEl.className = 'modal-status';
            submitBtn.disabled = true;

            try {
                const resp = await fetch('/tjai/api/rss/add-source', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
                    body: JSON.stringify({url, category}),
                });
                const data = await resp.json();
                if (data.error) {
                    statusEl.textContent = data.error;
                    statusEl.className = 'modal-status error';
                } else {
                    statusEl.textContent = `Added: ${data.feed_title} (${data.entry_count} entries)`;
                    setTimeout(hideAddModal, 1500);
                }
            } catch (e) {
                statusEl.textContent = 'Request failed';
                statusEl.className = 'modal-status error';
            }
            submitBtn.disabled = false;
        }

        function esc(s) {
            if (!s) return '';
            const el = document.createElement('span');
            el.textContent = s;
            return el.innerHTML;
        }

        function getCsrf() {
            const c = document.cookie.match(/csrftoken=([^;]+)/);
            return c ? c[1] : '';
        }

        loadRss();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TJAI Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
    }
    body {
      font-family: 'Rajdhani', sans-serif;
      background: linear-gradient(to top,
        #966342 0%,
        #cb7e58 15%,
        #da8d63 30%,
        #d08975 45%,
        #c592a1 55%,
        #a892b8 70%,
        #8e88b0 82%,
        #75779e 92%,
        #656589 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 10vh;
    }
    .login-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 3rem;
      border-radius: 8px;
      width: 320px;
      backdrop-filter: blur(10px);
    }
    .login-title {
      font-size: 3rem;
      font-weight: 500;
      color: #a83820;
      text-align: center;
      margin-bottom: 2rem;
      text-shadow:
        0 0 30px rgba(180, 60, 35, 0.5),
        0 0 60px rgba(180, 60, 35, 0.3);
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      color: #e0d0c0;
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      font-family: 'Rajdhani', sans-serif;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.2);
      color: #f0e0d0;
    }
    input:focus {
      outline: none;
      border-color: #a83820;
      box-shadow: 0 0 10px rgba(168, 56, 32, 0.3);
    }
    button {
      width: 100%;
      padding: 0.75rem;
      font-size: 1.1rem;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 500;
      background: #a83820;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #c04828;
    }
    .error {
      background: rgba(200, 50, 50, 0.3);
      color: #ffcccc;
      padding: 0.75rem;
      border-radius: 4px;
      margin-bottom: 1.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-title">TJAI</div>

    {% if form.errors %}
    <div class="error">Invalid username or password</div>
    {% endif %}

    <form method="post" action="{% url 'login' %}" autocomplete="on" id="login-form" name="login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" name="submit">Login</button>
      {% csrf_token %}
      {% if next %}
      <input type="hidden" name="next" value="{{ next }}">
      {% endif %}
    </form>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/tjai/static/tjai/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tjai Git Activity</title>
    <link rel="stylesheet" href="/tjai/static/tjai/menu.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 32px;
            max-width: 900px;
        }
        .content:focus { outline: none; }
        /* Heatmap */
        .heatmap { margin-bottom: 24px; }
        .heatmap-grid {
            display: flex;
            gap: 2px;
        }
        .heatmap-week {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .heatmap-cell {
            width: 11px;
            height: 11px;
            border-radius: 2px;
            cursor: pointer;
        }
        .heatmap-cell:hover {
            outline: 1px solid #aaa;
        }
        .heatmap-months {
            display: flex;
            font-size: 10px;
            color: #888;
            margin-bottom: 4px;
            padding-left: 28px;
        }
        .heatmap-month { text-align: left; }
        .heatmap-days {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-right: 4px;
            font-size: 9px;
            color: #888;
            justify-content: space-between;
            padding: 0;
        }
        .heatmap-days span {
            height: 11px;
            line-height: 11px;
        }
        .heatmap-body { display: flex; }
        /* Weekly LoC chart */
        .locchart { margin: 28px 0 24px; }
        .locchart-title { font-size: 13px; font-weight: bold; color: #e0e0e0; }
        .locchart-sub { font-size: 11px; color: #888; margin: 2px 0 8px; }
        .locchart-legend {
            display: flex; flex-wrap: wrap; gap: 4px 14px;
            font-size: 11px; color: #e0e0e0; margin-bottom: 8px;
        }
        .locchart-legend .chip {
            display: inline-block; width: 10px; height: 10px;
            border-radius: 2px; margin-right: 5px; vertical-align: -1px;
        }
        .locchart-legend .tot { color: #888; margin-left: 3px; }
        .locchart svg { display: block; }
        .stats-row {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: #888;
            margin-top: 6px;
        }
        .stats-row:first-of-type { margin-top: 10px; }
        .stats-label { color: #666; min-width: 70px; }
        .stats-row strong { color: #39d353; }
        .heatmap-leaderboard {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            font-size: 11px;
            color: #888;
        }
        .lb-entry {
            cursor: pointer;
        }
        .lb-entry:hover { color: #e0e0e0; }
        .lb-entry strong { color: #39d353; }
        .heatmap-legend {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-top: 6px;
            font-size: 10px;
            color: #888;
        }
        .heatmap-legend-cell {
            width: 11px;
            height: 11px;
            border-radius: 2px;
        }
        .heatmap-tooltip {
            position: fixed;
            background: #333;
            color: #e0e0e0;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 11px;
            pointer-events: none;
            z-index: 100;
            display: none;
            white-space: nowrap;
        }
        /* Day list */
        .day-header {
            font-size: 1.1em;
            font-weight: bold;
            color: #ff9800;
            margin: 24px 0 8px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid #ff9800;
        }
        .day-header:first-child { margin-top: 0; }
        .day-content {
            padding: 4px 0 8px 0;
        }
        .day-content ul { list-style: disc; margin-left: 20px; }
        .day-content li { margin: 3px 0; line-height: 1.5; }
        .day-content a { color: #81d4fa; text-decoration: none; }
        .day-content a:hover { text-decoration: underline; }
        .day-content strong { color: #c5e1a5; }
        .loading { color: #888; padding: 20px 0; }
        /* Dark mode scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: #444 #1a1a1a;
        }
    </style>
</head>
<body>
{% with current_page="git" %}{% include "tjai_app/_menu.html" %}{% endwith %}
<div class="heatmap-tooltip" id="tooltip"></div>
<div class="content" id="content" tabindex="-1">
    <div class="loading">Loading git activity...</div>
</div>
<script>
function focusContentArea() {
    const content = document.getElementById('content');
    if (!content) return;
    const active = document.activeElement;
    if (!active || active === document.body || active === content) {
        content.focus({preventScroll: true});
    }
}

function buildHeatmap(heatmap) {
    // Grid from Feb 1 2026 (retirement day 1) to today. tjai dates are
    // Eastern: the grid day must come from America/New_York, never the
    // viewer's clock. Dates are carried at local noon so day arithmetic
    // crosses DST changes safely, and labels are formatted without a UTC
    // round trip.
    const fmtIso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const etToday = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date());
    const today = new Date(etToday + 'T12:00:00');
    const endDay = new Date(today);
    endDay.setDate(endDay.getDate() + (6 - endDay.getDay()));

    // Start on the Sunday of the week containing Feb 1
    const feb1 = new Date(2026, 1, 1, 12); // Feb 1 2026
    const startDay = new Date(feb1);
    startDay.setDate(startDay.getDate() - startDay.getDay()); // back to Sunday

    // Collect all cells
    const cells = [];
    const d = new Date(startDay);
    while (d <= endDay) {
        const iso = fmtIso(d);
        const count = heatmap[iso] || 0;
        const future = d > today;
        cells.push({ date: iso, count, dow: d.getDay(), future });
        d.setDate(d.getDate() + 1);
    }

    // Colour scale: regular gradations of twenty to sixty, then the top
    // level saturates. The GitHub default saturated at ten, which stopped
    // discriminating years ago — a ten-commit day and an eighty-commit day
    // were the same green. Above sixty the colour says "a full day" and
    // the leaderboard says by how much, which is the job colour is bad at
    // and a ranked list is good at.
    const colors = ['#2d2d2d', '#0e4429', '#006d32', '#26a641', '#39d353'];
    function getColor(count, future) {
        if (future) return '#1a1a1a';
        if (count === 0) return colors[0];
        if (count <= 20) return colors[1];
        if (count <= 40) return colors[2];
        if (count < 60) return colors[3];
        return colors[4];
    }

    // Group into weeks (columns)
    const weeks = [];
    let week = [];
    for (const cell of cells) {
        if (cell.dow === 0 && week.length > 0) {
            weeks.push(week);
            week = [];
        }
        week.push(cell);
    }
    if (week.length > 0) weeks.push(week);

    // Month labels
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    let monthsHtml = '';
    let lastMonth = -1;
    const weekWidth = 13; // 11px cell + 2px gap
    for (let wi = 0; wi < weeks.length; wi++) {
        const firstInWeek = new Date(weeks[wi][0].date + 'T12:00:00');
        const m = firstInWeek.getMonth();
        if (m !== lastMonth && !(m === 0 && firstInWeek.getFullYear() === 2026)) {
            monthsHtml += `<span class="heatmap-month" style="width:${weekWidth}px">${monthNames[m]}</span>`;
            lastMonth = m;
        } else {
            monthsHtml += `<span style="width:${weekWidth}px"></span>`;
        }
    }

    // Day labels (Mon, Wed, Fri)
    const dayLabels = ['', 'Mon', '', 'Wed', '', 'Fri', ''];
    let daysHtml = '';
    for (let i = 0; i < 7; i++) {
        daysHtml += `<span>${dayLabels[i]}</span>`;
    }

    // Grid
    let gridHtml = '';
    for (const w of weeks) {
        let weekHtml = '';
        // Pad first week if it doesn't start on Sunday
        if (w === weeks[0]) {
            for (let pad = 0; pad < w[0].dow; pad++) {
                weekHtml += `<div class="heatmap-cell" style="background:#1a1a1a;cursor:default;"></div>`;
            }
        }
        for (const cell of w) {
            const bg = getColor(cell.count, cell.future);
            const dt = new Date(cell.date + 'T12:00:00');
            const dayName = cell.future ? '' : dt.toLocaleDateString('en-US', {weekday:'short'}) + ' ' + dt.toLocaleDateString('en-US', {month:'short'}) + ' ' + dt.getDate();
            const label = cell.future ? '' : `${dayName}: ${cell.count} commit${cell.count !== 1 ? 's' : ''}`;
            weekHtml += `<div class="heatmap-cell" style="background:${bg};" data-tip="${label}" data-date="${cell.date}"></div>`;
        }
        gridHtml += `<div class="heatmap-week">${weekHtml}</div>`;
    }

    return `<div class="heatmap">
        <div class="heatmap-months">${monthsHtml}</div>
        <div class="heatmap-body">
            <div class="heatmap-days">${daysHtml}</div>
            <div class="heatmap-grid">${gridHtml}</div>
        </div>
    </div>`;
}

function buildStats(heatmap) {
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    // Monthly totals (from Feb 2026 onward)
    const months = {};
    for (const [date, count] of Object.entries(heatmap)) {
        if (count === 0 || date < '2026-02') continue;
        const key = date.slice(0, 7);
        months[key] = (months[key] || 0) + count;
    }
    const sortedMonths = Object.entries(months).sort();
    let monthHtml = '<span class="stats-label">Monthly:</span>';
    for (const [ym, count] of sortedMonths) {
        const m = parseInt(ym.slice(5, 7)) - 1;
        monthHtml += `<span>${monthNames[m]} <strong>${count}</strong></span>`;
    }

    // Leaderboard — top 5 days
    const ranked = Object.entries(heatmap)
        .filter(([d, c]) => c > 0)
        .sort((a, b) => b[1] - a[1] || b[0].localeCompare(a[0]))
        .slice(0, 5);
    let lbHtml = '<span class="stats-label">Leaderboard:</span>';
    for (const [date, count] of ranked) {
        const dt = new Date(date + 'T12:00:00');
        const label = dt.toLocaleDateString('en-US', {weekday:'short'}) + ' ' + dt.toLocaleDateString('en-US', {month:'short'}) + ' ' + dt.getDate();
        lbHtml += `<span class="lb-entry" data-date="${date}">${label} <strong>${count}</strong></span>`;
    }

    return `<div class="stats-row">${monthHtml}</div><div class="stats-row">${lbHtml}</div>`;
}

// Weekly lines-added stacked bars, colored by project. Palette validated
// (dataviz six checks, dark surface #1a1a1a); 'other' is a deliberate
// neutral gray, not a categorical slot.
const LOC_COLORS = {
    'tjai': '#4a9df0',
    'AI': '#00a800',
    // virtual-world family: shades of one orange — primus deepest
    // (SL/OS scripting dirs count here), etaverse mid, blender (the
    // pipeline serving both) lightest
    'primus': '#f26b35', 'etaverse': '#ff8f33', 'blender': '#ffb680',
    'pax-eden': '#a89bff',
    // swf family: subtle shades of one pink — residual deepest
    'swf': '#d15c92', 'swf-monitor': '#e86ba0',
    'swf-epicprod': '#f77fb0', 'swf-testbed': '#ff96c2',
    // dev (development support: web/doc sites, tooling, machine and
    // workspace config): validated against stack neighbors pax-eden
    // (ΔE 23.7) and corun-ai (19.6), dark surface
    'dev': '#bf8a4d',
    'other': '#8a8983',
};

function buildLocChart(d) {
    const weeks = d.week_start || [];
    const projects = d.projects || [];
    if (!weeks.length || !projects.length) return '';
    const n = weeks.length;
    const fmt = v => v.toLocaleString('en-US');
    const kfmt = v => v >= 1000 ? (v / 1000) + 'k' : '' + v;

    const totals = weeks.map((_, i) =>
        projects.reduce((s, p) => s + (d.series[p][i] || 0), 0));
    const rawMax = Math.max(...totals, 1);
    const pow = Math.pow(10, Math.floor(Math.log10(rawMax)));
    const yMax = [1, 1.5, 2, 3, 4, 5, 6, 8, 10].map(m => m * pow).find(m => m >= rawMax);

    const axisW = 46, plotH = 400, topPad = 6, xLabH = 16;
    const slotW = Math.max(8, Math.floor((836 - axisW) / n));
    const barW = slotW - 2;
    const width = axisW + slotW * n, height = topPad + plotH + xLabH;
    const y = v => topPad + plotH - (v / yMax) * plotH;

    let svg = '';
    // Recessive gridlines + axis labels
    for (let g = 0; g <= 4; g++) {
        const v = yMax * g / 4, gy = y(v);
        svg += `<line x1="${axisW}" y1="${gy}" x2="${width}" y2="${gy}" stroke="#2e2e2e" stroke-width="1"/>`;
        svg += `<text x="${axisW - 6}" y="${gy + 3}" text-anchor="end" font-size="10" fill="#888">${kfmt(v)}</text>`;
    }
    // Bars: hover column first (under segments), then stacked segments
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    let lastMonth = -1;
    for (let i = 0; i < n; i++) {
        const x = axisW + i * slotW;
        const wk = new Date(weeks[i] + 'T12:00:00');
        const wkLabel = monthNames[wk.getMonth()] + ' ' + wk.getDate();
        svg += `<rect x="${x}" y="${topPad}" width="${slotW}" height="${plotH}" fill="transparent" data-tip="wk of ${wkLabel}: ${fmt(totals[i])} lines"/>`;
        let cum = 0, topSeg = null;
        const segs = [];
        for (const p of projects) {
            const v = d.series[p][i] || 0;
            if (!v) continue;
            const y1 = y(cum + v), y0 = y(cum);
            segs.push({p, v, y1, h: Math.max(y0 - y1 - 1, 1)});
            cum += v;
        }
        if (segs.length) topSeg = segs[segs.length - 1];
        for (const s of segs) {
            const rx = s === topSeg ? 2 : 0;
            svg += `<rect x="${x}" y="${s.y1}" width="${barW}" height="${s.h}" rx="${rx}" fill="${LOC_COLORS[s.p] || '#8a8983'}" data-tip="${s.p}: ${fmt(s.v)} lines · wk of ${wkLabel} (week total ${fmt(totals[i])})"/>`;
        }
        // Month tick at first week of each month
        if (wk.getMonth() !== lastMonth) {
            const lbl = monthNames[wk.getMonth()] + (wk.getMonth() === 0 ? ' ' + String(wk.getFullYear()).slice(2) : '');
            svg += `<text x="${x}" y="${topPad + plotH + 12}" font-size="10" fill="#888">${lbl}</text>`;
            lastMonth = wk.getMonth();
        }
    }

    // Average line over complete weeks — the in-progress week would
    // understate the average, so a trailing partial bucket is excluded.
    const lastWk = new Date(weeks[n - 1] + 'T12:00:00');
    const done = (lastWk.getTime() + 7 * 86400e3 < Date.now()) ? totals : totals.slice(0, -1);
    if (done.length) {
        const avg = done.reduce((a, b) => a + b, 0) / done.length;
        const ay = y(Math.min(avg, yMax));
        svg += `<line x1="${axisW}" y1="${ay}" x2="${width}" y2="${ay}" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="5 4" data-tip="average ${fmt(Math.round(avg))} lines/week over ${done.length} complete weeks"/>`;
        svg += `<text x="${axisW + 6}" y="${topPad + 11}" font-size="10" fill="#e8e8e8">avg ${kfmt(Math.round(avg / 100) * 100)}/wk</text>`;
    }

    let legend = '';
    for (const p of projects) {
        const tot = (d.series[p] || []).reduce((a, b) => a + b, 0);
        legend += `<span><span class="chip" style="background:${LOC_COLORS[p] || '#8a8983'}"></span>${p}<span class="tot">${kfmt(Math.round(tot / 100) * 100)}</span></span>`;
    }

    return `<div class="locchart">
        <div class="locchart-title">Lines added per week, by project, third party and data excluded</div>
        <div class="locchart-sub">commits authored by wenaus since Jun 2025 · archives and bulk-import commits (&gt;${kfmt(d.bulk_commit_lines || 100000)} lines) excluded</div>
        <div class="locchart-legend">${legend}</div>
        <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${svg}</svg>
    </div>`;
}

function buildLocPie(d) {
    const projects = d.projects || [];
    if (!projects.length) return '';
    const totals = projects.map(p => ({
        p, v: (d.series[p] || []).reduce((a, b) => a + b, 0),
    })).filter(t => t.v > 0);
    const grand = totals.reduce((s, t) => s + t.v, 0);
    if (!grand) return '';
    const fmt = v => v.toLocaleString('en-US');

    // cx leaves room for the longest left-hand label (swf-epicprod 11%,
    // ~106px at 11px monospace) between the box edge and the label ring.
    const cx = 230, cy = 130, r = 105, labelR = r + 12;
    let a0 = -Math.PI / 2;  // start at 12 o'clock, stacking order
    let svg = '';
    for (const t of totals) {
        const frac = t.v / grand;
        const a1 = a0 + frac * 2 * Math.PI;
        const large = frac > 0.5 ? 1 : 0;
        const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
        const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        const pct = (frac * 100).toFixed(frac < 0.02 ? 1 : 0);
        const tip = `${t.p}: ${fmt(t.v)} lines (${pct}%)`;
        svg += `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${LOC_COLORS[t.p] || '#8a8983'}" stroke="#1a1a1a" stroke-width="2" data-tip="${tip}"/>`;
        // Direct label for slices >= 2.5%; smaller ones carry the tooltip only
        if (frac >= 0.025) {
            const mid = (a0 + a1) / 2;
            const lx = cx + labelR * Math.cos(mid), ly = cy + labelR * Math.sin(mid);
            const anchor = Math.cos(mid) > 0.25 ? 'start' : (Math.cos(mid) < -0.25 ? 'end' : 'middle');
            svg += `<text x="${lx.toFixed(1)}" y="${(ly + 3).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="#e0e0e0">${t.p} <tspan fill="#888">${pct}%</tspan></text>`;
        }
        a0 = a1;
    }

    return `<div class="locchart">
        <div class="locchart-title">Share of lines added, by project</div>
        <div class="locchart-sub">${fmt(grand)} lines total over ${d.week_start.length} weeks</div>
        <svg width="500" height="260" viewBox="0 0 500 260">${svg}</svg>
    </div>`;
}

(async function() {
    const el = document.getElementById('content');
    const tooltip = document.getElementById('tooltip');
    focusContentArea();
    try {
        const locPromise = fetch('/tjai/api/git/weekly-loc?_=' + Date.now())
            .then(r => r.ok ? r.json() : null).catch(() => null);
        const resp = await fetch('/tjai/api/git/data?_=' + Date.now());
        if (!resp.ok) {
            const text = await resp.text();
            el.innerHTML = `<div class="loading" style="color:#ef5350;">HTTP ${resp.status}: ${text.slice(0, 200)}</div>`;
            return;
        }
        const data = await resp.json();
        if (!data.days || data.days.length === 0) {
            el.innerHTML = '<div class="loading">No git activity found. Run backfill?</div>';
            return;
        }
        let html = '';
        if (data.errors && data.errors.length > 0) {
            html += '<div style="color:#ef5350;background:#2a1a1a;padding:10px;margin-bottom:16px;border:1px solid #ef5350;border-radius:4px;">';
            html += '<strong>Refresh errors:</strong><br>';
            for (const err of data.errors) {
                html += `${err}<br>`;
            }
            html += '</div>';
        }
        // Heatmap, then stats, then weekly LoC chart, then day list
        if (data.heatmap) {
            html += buildHeatmap(data.heatmap);
            html += buildStats(data.heatmap);
        }
        const locData = await locPromise;
        if (locData) html += buildLocChart(locData) + buildLocPie(locData);
        for (const day of data.days) {
            const countBadge = day.commits ? ` <span style="font-size:.8em;color:#888;font-weight:normal;">(${day.commits} commit${day.commits !== 1 ? 's' : ''})</span>` : '';
            html += `<div class="day-header" data-isodate="${day.date}">${day.date_display}${countBadge}</div>`;
            html += `<div class="day-content">${day.html}</div>`;
        }
        el.innerHTML = html;

        // Tooltip + click-to-scroll on heatmap cells
        el.addEventListener('mouseover', function(e) {
            const tip = e.target.dataset?.tip;
            if (tip) {
                tooltip.textContent = tip;
                tooltip.style.display = 'block';
                tooltip.style.left = (e.clientX + 12) + 'px';
                tooltip.style.top = (e.clientY - 8) + 'px';
            }
        });
        el.addEventListener('mousemove', function(e) {
            if (tooltip.style.display === 'block') {
                tooltip.style.left = (e.clientX + 12) + 'px';
                tooltip.style.top = (e.clientY - 8) + 'px';
            }
        });
        el.addEventListener('mouseout', function(e) {
            if (e.target.dataset?.tip) {
                tooltip.style.display = 'none';
            }
        });
        el.addEventListener('click', function(e) {
            const date = e.target.dataset?.date || e.target.closest('[data-date]')?.dataset?.date;
            if (!date) return;
            const header = el.querySelector(`.day-header[data-isodate="${date}"]`);
            if (header) {
                header.scrollIntoView({ behavior: 'smooth', block: 'start' });
                header.style.background = '#333';
                setTimeout(() => header.style.background = '', 1500);
            }
        });
        focusContentArea();
    } catch (e) {
        el.innerHTML = `<div class="loading" style="color:#ef5350;">Error: ${e.message}</div>`;
        focusContentArea();
    }
})();
</script>
</body>
</html>

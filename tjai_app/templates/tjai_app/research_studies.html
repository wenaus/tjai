<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Studies - tjai</title>
    <link rel="stylesheet" href="/tjai/static/tjai/menu.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            font-size: 12px;
        }
        .toolbar a { color: #64b5f6; text-decoration: none; }
        .toolbar a:hover { text-decoration: underline; }
        .toolbar .topic-name { color: #d8a070; font-weight: bold; }
        .toolbar .topic-desc { color: #999; margin-left: 8px; }
        .toolbar .count { color: #8a8a8a; margin-left: auto; }
        #content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }
        .study-item {
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 3px solid #555;
            background: #222;
            border-radius: 0 3px 3px 0;
        }
        .study-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 4px;
        }
        .study-eid {
            color: #d8a070;
            font-size: 12px;
            font-weight: bold;
        }
        .study-eid a { color: #d8a070; text-decoration: none; }
        .study-eid a:hover { text-decoration: underline; }
        .study-kind {
            font-size: 11px;
            color: #8a8a8a;
            padding: 1px 6px;
            background: #2a2a2a;
            border-radius: 3px;
        }
        .study-context {
            font-size: 11px;
            color: #ce93d8;
        }
        .study-content {
            color: #bbb;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            max-height: 200px;
            overflow: hidden;
        }
        .study-meta {
            color: #999;
            font-size: 11px;
            margin-top: 4px;
        }
        .loading { color: #8a8a8a; padding: 20px; }
        .error { color: #ef5350; padding: 20px; }
        .empty { color: #8a8a8a; padding: 40px; text-align: center; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        * { scrollbar-width: thin; scrollbar-color: #444 #1a1a1a; }
    </style>
</head>
<body>
    {% with current_page="research" %}{% include "tjai_app/_menu.html" %}{% endwith %}
    <div class="toolbar">
        <a href="/tjai/research/">&larr; Research</a>
        <span class="topic-name" id="topic-name">Loading...</span>
        <span class="topic-desc" id="topic-desc"></span>
        <span class="count" id="count"></span>
    </div>
    <div id="content">
        <div class="loading">Loading studies...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const topicUuid = urlParams.get('uuid') || '';
        const topicName = urlParams.get('name') || '';

        if (topicName) {
            document.getElementById('topic-name').textContent = topicName;
        }

        function esc(s) {
            if (!s) return '';
            const el = document.createElement('span');
            el.textContent = s;
            return el.innerHTML;
        }

        function fmtDate(ts) {
            if (!ts) return '';
            try {
                const d = new Date(ts * 1000);
                return d.toLocaleDateString('en-US', {
                    month: 'short', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
            } catch { return ''; }
        }

        function entryUrl(uuid) {
            return '/tjai/entry/?uuid=' + uuid;
        }

        async function fetchStudies() {
            if (!topicUuid) {
                document.getElementById('content').innerHTML =
                    '<div class="error">No topic UUID specified</div>';
                return;
            }
            try {
                const resp = await fetch(`/tjai/api/research/studies?uuid=${encodeURIComponent(topicUuid)}`);
                const data = await resp.json();
                if (data.error) {
                    document.getElementById('content').innerHTML =
                        `<div class="error">${esc(data.error)}</div>`;
                    return;
                }
                render(data);
            } catch (e) {
                document.getElementById('content').innerHTML =
                    '<div class="error">Error loading studies</div>';
            }
        }

        function render(data) {
            if (data.parent) {
                document.getElementById('topic-name').textContent =
                    data.parent.entry_id || data.parent.id.substring(0, 8);
                document.getElementById('topic-desc').textContent =
                    data.parent.content;
            }

            const items = data.items || [];
            document.getElementById('count').textContent =
                items.length + ' ' + (items.length === 1 ? 'study' : 'studies');

            if (items.length === 0) {
                document.getElementById('content').innerHTML =
                    '<div class="empty">No subagent entries found for this topic.</div>';
                return;
            }

            let html = '';
            for (const item of items) {
                // Derive a display name from entry_id (strip parent prefix)
                let displayName = item.entry_id || item.id.substring(0, 8);
                if (item.entry_id && data.parent && data.parent.entry_id) {
                    const prefix = data.parent.entry_id + ':';
                    if (item.entry_id.startsWith(prefix)) {
                        displayName = item.entry_id.substring(prefix.length);
                    }
                }

                html += `<div class="study-item">`;
                html += '<div class="study-header">';
                html += `<span class="study-eid"><a href="${entryUrl(item.id)}">${esc(displayName)}</a></span>`;
                html += `<span class="study-kind">${esc(item.kind)}</span>`;
                if (item.context) {
                    html += `<span class="study-context">${esc(item.context)}</span>`;
                }
                html += '</div>';

                // Show first few lines of content
                const lines = (item.content || '').split('\n');
                const preview = lines.slice(0, 6).join('\n');
                const truncated = lines.length > 6 ? '\n...' : '';
                html += `<div class="study-content">${esc(preview + truncated)}</div>`;

                html += `<div class="study-meta">${fmtDate(item.modified)}</div>`;
                html += '</div>';
            }

            document.getElementById('content').innerHTML = html;
        }

        fetchStudies();
    </script>
</body>
</html>

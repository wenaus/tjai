<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/tjai/static/tjai/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tjai AI</title>
    <link rel="stylesheet" href="/tjai/static/tjai/menu.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .container { display: flex; flex: 1; overflow: hidden; }
        .panel-left {
            width: 200px; min-width: 200px;
            border-right: 1px solid #333;
            overflow-y: auto; padding: 12px 0;
        }
        .panel-right { flex: 1; overflow-y: auto; padding: 20px 32px; }
        .date-item {
            padding: 6px 16px; cursor: pointer;
            color: #8a8a8a; white-space: nowrap;
            display: flex; justify-content: space-between;
        }
        .date-item:hover { background: #2a2a2a; color: #e0e0e0; }
        .date-item.selected {
            background: #2a2a2a; color: #e0e0e0;
            border-right: 2px solid #d8a070;
        }
        .date-item.today { color: #9ccc65; font-weight: bold; }
        .date-item.today.selected { color: #9ccc65; }
        .date-score {
            font-size: 11px; font-weight: bold; margin-left: 8px;
        }
        .date-score .pos { color: #9ccc65; }
        .date-score .neg { color: #ef5350; }
        .date-score .zero { color: #8a8a8a; }

        /* Assessment content */
        .assessment-header {
            display: flex; align-items: baseline; gap: 12px;
            margin-bottom: 20px;
        }
        .assessment-header h1 {
            color: #d8a070; font-size: 18px;
        }
        .assessment-summary {
            color: #8a8a8a; font-size: 12px;
            margin-bottom: 20px; line-height: 1.5;
        }

        /* Score table — vertical layout with inline chart */
        .score-row {
            display: grid;
            grid-template-columns: 70px 40px 40px 1fr 180px;
            gap: 8px;
            padding: 4px 0;
            border-bottom: 1px solid #222;
            align-items: center;
        }
        .score-row.header {
            color: #d8a070; font-size: 11px;
            border-bottom: 1px solid #444;
            padding-bottom: 6px; margin-bottom: 4px;
        }
        .score-time { color: #8a8a8a; font-size: 12px; }
        .score-val { font-weight: bold; text-align: right; }
        .score-val.pos { color: #9ccc65; }
        .score-val.neg { color: #ef5350; }
        .score-cum { text-align: right; color: #e8c87a; font-size: 12px; }
        .score-precis { color: #e0e0e0; font-size: 12px; }
        .score-chart {
            height: 16px; position: relative;
            border-left: 1px solid #555;
        }
        .score-bar {
            position: absolute; top: 2px; height: 12px;
            border-radius: 2px;
        }
        .score-bar.pos { background: #9ccc65; }
        .score-bar.neg { background: #ef5350; }
        .score-marker {
            position: absolute; top: 0; height: 16px; width: 1px;
            background: #555;
        }

        /* Markdown content (observations section) */
        .md-content { margin-top: 24px; line-height: 1.6; }
        .md-content h2 { color: #d8a070; font-size: 15px; margin-top: 20px; margin-bottom: 8px; }
        .md-content h3 { color: #ce93d8; font-size: 14px; margin-top: 16px; margin-bottom: 6px; }
        .md-content p { margin-bottom: 8px; }
        .md-content ul, .md-content ol { margin-left: 20px; margin-bottom: 8px; }
        .md-content li { margin-bottom: 4px; }
        .md-content a { color: #90caf9; text-decoration: none; }
        .md-content a:hover { text-decoration: underline; }
        .md-content strong { color: #e8c87a; }
        .md-content em { color: #ce93d8; }

        .loading { color: #8a8a8a; padding: 20px; }
        .error { color: #ef5350; padding: 20px; }
        a.entry-link {
            color: #8a8a8a; font-size: 11px;
            text-decoration: none; margin-left: 12px;
        }
        a.entry-link:hover { color: #e0e0e0; }
        .btn-rerun {
            display: inline-block; background: #333; color: #e0e0e0;
            border: 1px solid #555; padding: 2px 10px; border-radius: 12px;
            cursor: pointer; font-family: inherit; font-size: 11px;
            margin-left: 12px; vertical-align: middle;
        }
        .btn-rerun:hover { background: #444; }
        .btn-rerun:disabled { opacity: 0.5; cursor: default; }
        .agent-banner {
            padding: 6px 24px; font-size: 12px;
            border-bottom: 1px solid #333; flex-shrink: 0;
        }
        .agent-idle { color: #8a8a8a; }
        .agent-running { color: #ffd54f; }
        .agent-failed { color: #ef5350; }
        .date-item.dashboard-item {
            color: #d8a070; font-weight: bold;
            border-bottom: 1px solid #333;
            margin-bottom: 4px; padding-bottom: 8px;
        }
        .session-row {
            display: grid;
            grid-template-columns: 80px 50px 50px 50px 1fr;
            gap: 8px; padding: 3px 0;
            border-bottom: 1px solid #222;
            font-size: 12px;
        }
        .session-row.header { color: #d8a070; font-size: 11px; border-bottom: 1px solid #444; }
        .session-dur { color: #8a8a8a; }
        .session-dur.pos { color: #9ccc65; }
        .session-dur.neg { color: #ef5350; }
        .session-net { font-weight: bold; }
        .session-precis { color: #e0e0e0; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        * { scrollbar-width: thin; scrollbar-color: #444 #1a1a1a; }
    </style>
</head>
<body>
    {% with current_page="assessment" %}{% include "tjai_app/_menu.html" %}{% endwith %}
    <div class="agent-banner agent-idle" id="agent-banner">Agent: loading...</div>
    <div class="container">
        <div class="panel-left" id="date-list">
            <div class="loading">Loading dates...</div>
        </div>
        <div class="panel-right" id="content-panel">
            <div class="loading">Select a date to view the assessment.</div>
        </div>
    </div>

    <script>
        let allDates = [];
        let todayKey = '';
        let selectedEntryId = null;

        function updateBanner(agent) {
            const banner = document.getElementById('agent-banner');
            if (!agent || !banner) return;
            if (agent.status === 'running') {
                const dur = agent.launched_dur ? ' for ' + agent.launched_dur : '';
                banner.className = 'agent-banner agent-running';
                banner.innerHTML = `Agent: <strong>running</strong>${dur}`;
            } else if (agent.status === 'failed') {
                const err = agent.last_error ? ' — ' + agent.last_error : '';
                banner.className = 'agent-banner agent-failed';
                banner.innerHTML = `Agent: <strong>failed</strong>${err}`;
            } else {
                banner.className = 'agent-banner agent-idle';
                banner.innerHTML = 'Agent: idle';
            }
        }

        async function fetchDates() {
            try {
                const resp = await fetch('/tjai/api/assessment/dates');
                const data = await resp.json();
                if (data.error) {
                    document.getElementById('date-list').innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }
                allDates = data.dates || [];
                todayKey = data.today_key || '';
                updateBanner(data.agent);
                renderDateList();
                const params = new URLSearchParams(window.location.search);
                let target = params.get('entry_id');
                if (!target) {
                    target = '__dashboard__';
                }
                if (target === '__dashboard__') {
                    selectDate('__dashboard__');
                } else if (allDates.length > 0) {
                    const found = allDates.find(d => d.entry_id === target);
                    selectDate(found ? target : '__dashboard__');
                }
            } catch (e) {
                document.getElementById('date-list').innerHTML = '<div class="error">Error loading dates</div>';
            }
        }

        function renderDateList() {
            let html = `<div class="date-item dashboard-item" data-entry-id="__dashboard__">Dashboard</div>`;
            for (const d of allDates) {
                const isToday = d.date_key === todayKey;
                const todayClass = isToday ? ' today' : '';
                const score = d.final_cumulative;
                const intg = d.integral || 0;
                const scoreClass = score > 0 ? 'pos' : score < 0 ? 'neg' : 'zero';
                const intgClass = intg > 0 ? 'pos' : intg < 0 ? 'neg' : 'zero';
                const scoreStr = score > 0 ? '+' + score : '' + score;
                const intgStr = intg > 0 ? '+' + intg : '' + intg;
                html += `<div class="date-item${todayClass}" data-entry-id="${d.entry_id}" data-date-key="${d.date_key}">` +
                    `<span>${d.date_display}</span>` +
                    `<span class="date-score"><span class="${scoreClass}">${scoreStr}</span> <span class="${intgClass}">${intgStr}</span></span>` +
                    `</div>`;
            }
            document.getElementById('date-list').innerHTML = html || '<div class="loading">No assessments found.</div>';
            document.querySelectorAll('.date-item').forEach(el => {
                el.addEventListener('click', function() { selectDate(this.dataset.entryId); });
            });
        }

        // Normalize a score object's field names
        function norm(s) {
            return {
                dt: s.dt || s.datetime || '',
                score: s.score ?? s.delta ?? 0,
                cumulative: s.cumulative ?? s.cumul ?? 0,
                precis: s.precis || '',
            };
        }

        function renderTimePlot(scores, cums, chartRange) {
            const W = 700, H = 120, pad = {l: 40, r: 20, t: 10, b: 25};
            const plotW = W - pad.l - pad.r;
            const plotH = H - pad.t - pad.b;
            const {mn, mx} = chartRange;
            const range = mx - mn || 1;

            // Parse times as minutes since midnight for x positioning
            const times = scores.map(s => {
                const d = new Date(norm(s).dt);
                return d.getHours() * 60 + d.getMinutes();
            });
            const tMin = Math.min(...times) - 15;
            const tMax = Math.max(...times) + 15;
            const tRange = tMax - tMin || 1;

            function x(t) { return pad.l + ((t - tMin) / tRange) * plotW; }
            function y(v) { return pad.t + plotH - ((v - mn) / range) * plotH; }

            // Zero line
            const y0 = y(0);
            let svg = `<svg width="${W}" height="${H}" style="display:block;margin-bottom:16px;">`;
            // Grid: zero line
            svg += `<line x1="${pad.l}" y1="${y0}" x2="${W-pad.r}" y2="${y0}" stroke="#555" stroke-dasharray="3,3"/>`;
            // Y axis labels
            svg += `<text x="${pad.l-5}" y="${y(mx)+4}" text-anchor="end" fill="#8a8a8a" font-size="10" font-family="monospace">+${mx}</text>`;
            svg += `<text x="${pad.l-5}" y="${y(mn)+4}" text-anchor="end" fill="#8a8a8a" font-size="10" font-family="monospace">${mn}</text>`;
            if (mn < 0 && mx > 0) {
                svg += `<text x="${pad.l-5}" y="${y0+4}" text-anchor="end" fill="#555" font-size="10" font-family="monospace">0</text>`;
            }

            // Area fill: green above zero, red below
            // Build path points starting from first score
            const pts = scores.map((s, i) => ({
                x: x(times[i]),
                y: y(cums[i]),
                cum: cums[i]
            }));

            // Draw filled area segments between zero line and curve
            for (let i = 0; i < pts.length - 1; i++) {
                const p1 = pts[i], p2 = pts[i+1];
                const color = (p1.cum >= 0 && p2.cum >= 0) ? '#9ccc6530' :
                              (p1.cum <= 0 && p2.cum <= 0) ? '#ef535030' : '#88888820';
                svg += `<polygon points="${p1.x},${y0} ${p1.x},${p1.y} ${p2.x},${p2.y} ${p2.x},${y0}" fill="${color}"/>`;
            }

            // Line connecting points
            const linePts = pts.map(p => `${p.x},${p.y}`).join(' ');
            svg += `<polyline points="${linePts}" fill="none" stroke="#e0e0e0" stroke-width="1.5"/>`;

            // Dots at each score
            pts.forEach((p, i) => {
                const sc = norm(scores[i]).score;
                const color = sc > 0 ? '#9ccc65' : sc < 0 ? '#ef5350' : '#8a8a8a';
                svg += `<circle cx="${p.x}" cy="${p.y}" r="3" fill="${color}"/>`;
            });

            // X axis time labels (every 2 hours within range)
            for (let m = Math.ceil(tMin/60)*60; m <= tMax; m += 120) {
                const hr = Math.floor(m / 60);
                const lbl = hr.toString().padStart(2,'0') + ':00';
                svg += `<text x="${x(m)}" y="${H-3}" text-anchor="middle" fill="#8a8a8a" font-size="10" font-family="monospace">${lbl}</text>`;
            }

            svg += `</svg>`;
            return svg;
        }

        function renderScoreRow(s, chartRange) {
            const n = norm(s);
            const score = n.score;
            const cumulative = n.cumulative;
            const dt = new Date(n.dt);
            const timeStr = dt.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            const scoreClass = score > 0 ? 'pos' : 'neg';
            const scoreStr = score > 0 ? '+' + score : '' + score;
            const cumStr = cumulative > 0 ? '+' + cumulative : '' + cumulative;
            // Inline bar chart: zero line in center, bar extends left (neg) or right (pos)
            const { mn, mx } = chartRange;
            const range = mx - mn || 1;
            const chartW = 170; // px width of chart cell
            const zeroPos = Math.round(((0 - mn) / range) * chartW);
            const cumPos = Math.round(((cumulative - mn) / range) * chartW);
            const barLeft = Math.min(zeroPos, cumPos);
            const barWidth = Math.max(Math.abs(cumPos - zeroPos), 2);
            const barClass = cumulative >= 0 ? 'pos' : 'neg';
            const chartHtml = `<span class="score-marker" style="left:${zeroPos}px"></span>` +
                `<span class="score-bar ${barClass}" style="left:${barLeft}px;width:${barWidth}px"></span>`;
            return `<div class="score-row">` +
                `<span class="score-time">${timeStr}</span>` +
                `<span class="score-val ${scoreClass}">${scoreStr}</span>` +
                `<span class="score-cum">${cumStr}</span>` +
                `<span class="score-precis">${escHtml(n.precis)}</span>` +
                `<span class="score-chart">${chartHtml}</span>` +
                `</div>`;
        }

        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        async function selectDate(entryId) {
            selectedEntryId = entryId;
            const url = new URL(window.location);
            url.searchParams.set('entry_id', entryId);
            history.replaceState(null, '', url);
            document.querySelectorAll('.date-item').forEach(el => {
                el.classList.toggle('selected', el.dataset.entryId === entryId);
            });
            if (entryId === '__dashboard__') {
                return loadDashboard();
            }
            document.getElementById('content-panel').innerHTML = '<div class="loading">Loading...</div>';
            try {
                const resp = await fetch(`/tjai/api/assessment/content?entry_id=${encodeURIComponent(entryId)}`);
                const data = await resp.json();
                if (data.error) {
                    document.getElementById('content-panel').innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }
                const scores = data.scores || [];
                // Compute chart range across all scores
                const cums = scores.map(s => norm(s).cumulative);
                const chartRange = {
                    mn: Math.min(...cums, -1, 0),
                    mx: Math.max(...cums, 1, 0),
                };

                let html = `<div class="assessment-header">` +
                    `<h1>AI Assessment: ${escHtml(data.date_display || entryId)}</h1>` +
                    `<a class="entry-link" href="/tjai/entry/?entry_id=${encodeURIComponent(entryId)}">[edit]</a>` +
                    `<button class="btn-rerun" onclick="rerunAssessment('${escHtml(entryId)}', this)">Rerun</button>` +
                    `</div>`;

                if (data.summary) {
                    html += `<div class="assessment-summary">${escHtml(data.summary)}</div>`;
                }

                // Time-based plot across the top
                if (scores.length > 0) {
                    html += renderTimePlot(scores, cums, chartRange);
                }

                // Score table with inline chart bars
                html += `<div class="score-row header">` +
                    `<span>Time</span><span style="text-align:right">Score</span>` +
                    `<span style="text-align:right">Cum</span><span>Event</span><span>Chart</span></div>`;
                for (const s of scores) {
                    html += renderScoreRow(s, chartRange);
                }

                if (scores.length === 0) {
                    html += `<div class="loading">No scored events for this date.</div>`;
                }

                // Observations (markdown content)
                if (data.content_html) {
                    html += `<div class="md-content">${data.content_html}</div>`;
                }

                document.getElementById('content-panel').innerHTML = html;
            } catch (e) {
                document.getElementById('content-panel').innerHTML = '<div class="error">Error loading assessment</div>';
            }
        }

        function renderDailyPlot(days, field, label, color) {
            if (!days || days.length === 0) return '';
            const W = 700, H = 130, pad = {l: 50, r: 20, t: 15, b: 30};
            const plotW = W - pad.l - pad.r;
            const plotH = H - pad.t - pad.b;
            const vals = days.map(d => d[field]);
            const mx = Math.max(...vals, 1);
            const mn = Math.min(...vals, -1);
            const range = mx - mn || 1;
            function x(i) { return pad.l + (i / Math.max(days.length - 1, 1)) * plotW; }
            function y(v) { return pad.t + plotH - ((v - mn) / range) * plotH; }
            const y0 = y(0);

            let svg = `<svg width="${W}" height="${H}" style="display:block;margin-bottom:8px;">`;
            svg += `<text x="5" y="12" fill="#d8a070" font-size="11" font-family="monospace">${label}</text>`;
            // Zero line
            svg += `<line x1="${pad.l}" y1="${y0}" x2="${W-pad.r}" y2="${y0}" stroke="#555" stroke-dasharray="3,3"/>`;
            // Y labels
            svg += `<text x="${pad.l-5}" y="${y(mx)+4}" text-anchor="end" fill="#8a8a8a" font-size="10" font-family="monospace">${mx > 0 ? '+' : ''}${mx}</text>`;
            svg += `<text x="${pad.l-5}" y="${y(mn)+4}" text-anchor="end" fill="#8a8a8a" font-size="10" font-family="monospace">${mn}</text>`;

            // Area fill
            for (let i = 0; i < days.length - 1; i++) {
                const v1 = vals[i], v2 = vals[i+1];
                const fillColor = (v1 >= 0 && v2 >= 0) ? '#9ccc6530' :
                                  (v1 <= 0 && v2 <= 0) ? '#ef535030' : '#88888820';
                svg += `<polygon points="${x(i)},${y0} ${x(i)},${y(v1)} ${x(i+1)},${y(v2)} ${x(i+1)},${y0}" fill="${fillColor}"/>`;
            }

            // Line
            const pts = days.map((d, i) => `${x(i)},${y(vals[i])}`).join(' ');
            svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/>`;

            // Dots
            days.forEach((d, i) => {
                const dotColor = vals[i] > 0 ? '#9ccc65' : vals[i] < 0 ? '#ef5350' : '#8a8a8a';
                svg += `<circle cx="${x(i)}" cy="${y(vals[i])}" r="3" fill="${dotColor}" style="cursor:pointer" onclick="selectDate('assessment-${d.date}')"/>`;
            });

            // X labels (every Nth day)
            const step = Math.max(1, Math.floor(days.length / 10));
            for (let i = 0; i < days.length; i += step) {
                const lbl = days[i].date.substring(5); // MM-DD
                svg += `<text x="${x(i)}" y="${H-3}" text-anchor="middle" fill="#8a8a8a" font-size="9" font-family="monospace">${lbl}</text>`;
            }
            // Always label last day
            if (days.length > 1) {
                const last = days.length - 1;
                svg += `<text x="${x(last)}" y="${H-3}" text-anchor="end" fill="#8a8a8a" font-size="9" font-family="monospace">${days[last].date.substring(5)}</text>`;
            }

            svg += `</svg>`;
            return svg;
        }

        async function loadDashboard() {
            document.getElementById('content-panel').innerHTML = '<div class="loading">Loading dashboard...</div>';
            try {
                const resp = await fetch('/tjai/api/assessment/dashboard');
                const data = await resp.json();
                if (data.error) {
                    document.getElementById('content-panel').innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }
                const days = data.days || [];
                let html = `<h1 style="color:#d8a070;font-size:18px;margin-bottom:16px">AI Performance Dashboard</h1>`;

                if (days.length === 0) {
                    html += '<div class="loading">No assessments yet.</div>';
                    document.getElementById('content-panel').innerHTML = html;
                    return;
                }

                // Daily endpoint plot
                html += renderDailyPlot(days, 'endpoint', 'Daily Endpoint', '#e0e0e0');
                // Daily integral plot
                html += renderDailyPlot(days, 'integral', 'Daily Integral', '#ce93d8');

                // Session list — all sessions, reverse chronological
                html += `<h2 style="color:#d8a070;font-size:15px;margin:20px 0 8px">Sessions</h2>`;
                html += `<div class="session-row header">` +
                    `<span>Date</span><span>Dur</span><span>Net</span><span>Intg</span><span>Precis</span></div>`;

                // Flatten all sessions with their dates, reverse order
                const allSessions = [];
                for (const day of days) {
                    for (const sess of (day.sessions || [])) {
                        allSessions.push({...sess, date: day.date});
                    }
                }
                allSessions.reverse();

                for (const s of allSessions) {
                    const netClass = s.net > 0 ? 'pos' : s.net < 0 ? 'neg' : 'zero';
                    const netStr = s.net > 0 ? '+' + s.net : '' + s.net;
                    const intgClass = s.integral > 0 ? 'pos' : s.integral < 0 ? 'neg' : 'zero';
                    const intgStr = s.integral > 0 ? '+' + s.integral : '' + s.integral;
                    const durStr = s.duration_min > 0 ? s.duration_min + 'm' : '<1m';
                    const dateShort = s.date.substring(5); // MM-DD
                    const startTime = s.start ? new Date(s.start).toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit',hour12:false}) : '';
                    const precis = s.precis || `${s.events} events`;
                    // Color date+dur when net and integral agree on direction
                    const bothPos = s.net > 0 && s.integral > 0;
                    const bothNeg = s.net < 0 && s.integral < 0;
                    const rowColor = bothPos ? 'pos' : bothNeg ? 'neg' : '';
                    html += `<div class="session-row">` +
                        `<span class="session-dur ${rowColor}" style="cursor:pointer" onclick="selectDate('assessment-${s.date}')">${dateShort} ${startTime}</span>` +
                        `<span class="session-dur ${rowColor}">${durStr}</span>` +
                        `<span class="session-net ${netClass}">${netStr}</span>` +
                        `<span class="session-net ${intgClass}">${intgStr}</span>` +
                        `<span class="session-precis">${escHtml(precis)}</span>` +
                        `</div>`;
                }

                document.getElementById('content-panel').innerHTML = html;
            } catch (e) {
                document.getElementById('content-panel').innerHTML = '<div class="error">Error loading dashboard</div>';
            }
        }

        async function rerunAssessment(entryId, btn) {
            btn.disabled = true;
            btn.textContent = 'Requesting...';
            try {
                const resp = await fetch('/tjai/api/assessment/rerun', {
                    method: 'POST',
                    headers: {'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/x-www-form-urlencoded'},
                    body: 'entry_id=' + encodeURIComponent(entryId),
                });
                const data = await resp.json();
                if (!resp.ok || data.error) {
                    btn.textContent = 'Failed';
                    alert('Rerun failed: ' + (data.error || 'Unknown error'));
                    return;
                }
                btn.textContent = 'Running...';
                let attempts = 0;
                const poll = setInterval(async () => {
                    attempts++;
                    if (attempts > 120) { clearInterval(poll); btn.textContent = 'Timeout'; return; }
                    try {
                        const cr = await fetch(`/tjai/api/assessment/content?entry_id=${encodeURIComponent(entryId)}`);
                        if (cr.ok) {
                            const cd = await cr.json();
                            if (cd.scores && cd.scores.length > 0) {
                                clearInterval(poll);
                                selectDate(entryId);
                            }
                        }
                    } catch(e) {}
                }, 5000);
            } catch (e) {
                btn.textContent = 'Error';
            }
        }

        fetchDates();
        // Poll agent status every 15s
        setInterval(async () => {
            try {
                const r = await fetch('/tjai/api/assessment/dates');
                if (r.ok) {
                    const d = await r.json();
                    updateBanner(d.agent);
                    // If new dates appeared, refresh the list
                    if ((d.dates || []).length !== allDates.length) {
                        allDates = d.dates || [];
                        renderDateList();
                        // Re-highlight selected
                        if (selectedEntryId) {
                            document.querySelectorAll('.date-item').forEach(el => {
                                el.classList.toggle('selected', el.dataset.entryId === selectedEntryId);
                            });
                        }
                    }
                }
            } catch(e) {}
        }, 15000);
    </script>
</body>
</html>

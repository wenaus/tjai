<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/tjai/static/tjai/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tjai Dev Activity</title>
    <link rel="stylesheet" href="/tjai/static/tjai/menu.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 32px 20px;
        }
        .day-content h2 {
            margin: 32px 0 10px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid #ff9800;
            font-size: 1.2em;
        }
        .day-content h2:first-child { margin-top: 0; }
        .day-content h2 a { color: #ff9800; text-decoration: none; }
        .day-content h2 a:hover { text-decoration: underline; }
        .day-content a { color: #81d4fa; text-decoration: none; }
        .day-content a:hover { text-decoration: underline; }
        .day-content .event { margin: 10px 0; line-height: 1.6; }
        .day-content .event-line { }
        .day-content .files { color: #888; font-size: 11px; margin: 2px 0 2px 16px; }
        .day-content .files code { color: #aaa; font-size: 11px; }
        .day-content .body-oneline { color: #bbb; font-size: 12px; margin: 2px 0 2px 16px; white-space: pre-wrap; }
        .day-content details { margin: 2px 0 2px 16px; }
        .day-content summary {
            cursor: pointer;
            list-style: none;
            color: #bbb;
            font-size: 12px;
        }
        .day-content summary::before {
            content: '▶ ';
            font-size: 9px;
            display: inline-block;
            transition: transform 0.15s;
            margin-right: 3px;
        }
        .day-content details[open] > summary::before {
            transform: rotate(90deg);
        }
        .day-content .body-text {
            margin: 4px 0 4px 16px;
            color: #999;
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.5;
        }
        .day-content .empty { color: #666; font-style: italic; margin: 4px 0 16px 0; }
        .loading { color: #888; padding: 20px 0; }
        .toc {
            position: sticky;
            top: 0;
            background: #1a1a1a;
            padding: 14px 0 10px;
            margin-bottom: 6px;
            border-bottom: 1px solid #333;
            font-size: 12px;
            line-height: 2;
            z-index: 5;
        }
        .toc a { color: #ff9800; text-decoration: none; white-space: nowrap; }
        .toc a:hover { text-decoration: underline; }
        .toc .toc-date { color: #888; font-size: 11px; }
        .toc .toc-sep { color: #555; }
        /* Dark mode scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: #444 #1a1a1a;
        }
    </style>
</head>
<body>
{% with current_page="dev" %}{% include "tjai_app/_menu.html" %}{% endwith %}
<div class="content" id="content">
    <div class="loading">Loading dev activity...</div>
</div>
<script>
(async function() {
    const el = document.getElementById('content');
    try {
        const resp = await fetch('/tjai/api/dev/data?_=' + Date.now());
        if (!resp.ok) {
            el.innerHTML = `<div class="loading" style="color:#ef5350;">HTTP ${resp.status}</div>`;
            return;
        }
        const data = await resp.json();
        if (!data.days || data.days.length === 0) {
            el.innerHTML = '<div class="loading">No dev activity found.</div>';
            return;
        }
        let html = '';
        for (const day of data.days) {
            html += `<div class="day-content">${day.html}</div>`;
        }
        el.innerHTML = html;

        // Compact TOC: repo sections sorted by most-recent activity date, inline,
        // with in-page anchors — a quick view of where the latest changes are and
        // a way to jump straight to them. Built from the rendered DOM: repo
        // sections are the h2s whose link points at github; a section's mod date
        // is its first event's <b>Mon D</b> (events render newest-first).
        const MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
        const esc = s => { const d = document.createElement('span'); d.textContent = s; return d.innerHTML; };
        const slug = s => 'sec-' + s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        const parseDate = t => {
            const m = (t || '').trim().match(/^([A-Z][a-z]{2})\s+(\d{1,2})/);
            if (!m || MONTHS[m[1]] === undefined) return -1;
            return MONTHS[m[1]] * 100 + parseInt(m[2], 10);
        };
        const repoH2s = [...el.querySelectorAll('h2')].filter(h => {
            const a = h.querySelector('a');
            return a && /github\.com/.test(a.getAttribute('href') || '');
        });
        const tocItems = [];
        for (const h2 of repoH2s) {
            const name = (h2.querySelector('a').textContent || '').trim();
            if (!h2.id) h2.id = slug(name);
            let dateTxt = '', dateVal = -1;
            for (let n = h2.nextElementSibling; n && n.tagName !== 'H2'; n = n.nextElementSibling) {
                const b = n.querySelector && n.querySelector('b');
                if (b) { dateTxt = b.textContent.trim(); dateVal = parseDate(dateTxt); break; }
            }
            tocItems.push({ name, id: h2.id, dateTxt, dateVal });
        }
        if (tocItems.length) {
            tocItems.sort((a, b) => b.dateVal - a.dateVal);
            const toc = document.createElement('div');
            toc.className = 'toc';
            toc.innerHTML = tocItems.map(it =>
                `<a href="#${it.id}">${esc(it.name)}${it.dateTxt ? ` <span class="toc-date">${esc(it.dateTxt)}</span>` : ''}</a>`
            ).join('<span class="toc-sep"> · </span>');
            el.insertBefore(toc, el.firstChild);
            // Offset anchor jumps so the section title clears the sticky TOC bar
            // (measured, so it stays correct when the bar wraps to >1 line).
            const off = toc.offsetHeight + 8;
            for (const h2 of repoH2s) h2.style.scrollMarginTop = off + 'px';
        }
    } catch (e) {
        el.innerHTML = `<div class="loading" style="color:#ef5350;">Error: ${e.message}</div>`;
    }
})();
</script>
</body>
</html>

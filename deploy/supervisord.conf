[supervisord]
logfile=/tmp/tjai-supervisord.log
pidfile=/tmp/tjai-supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/tjai-supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/tjai-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:action-agent]
command=/var/www/tjai/.venv/bin/python scripts/action_agent.py
directory=/var/www/tjai
autostart=true
autorestart=true
stopwaitsecs=10
stopsignal=QUIT
stdout_logfile=/tmp/tjai-action-agent.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
